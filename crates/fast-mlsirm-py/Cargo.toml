[package]
name = "fast-mlsirm-py"
version = "0.11.4"
edition = "2021"
license = "MIT"
description = "PyO3 bindings for the fast-mlsirm Rust core."
homepage = "https://github.com/ContextualWisdomLab/fast-mlsirm"
repository = "https://github.com/ContextualWisdomLab/fast-mlsirm"
documentation = "https://github.com/ContextualWisdomLab/fast-mlsirm/blob/main/README.md"

[lib]
name = "fast_mlsirm_core"
path = "src/entrypoint.rs"
crate-type = ["cdylib"]

[dependencies]
mlsirm-core = { path = "../mlsirm-core" }
numpy = "0.29.0"
pyo3 = "0.29.0"

# Byte-reproducible release wheels: with the default 16 codegen units, rustc's
# thin-local-LTO symbol suffixes (`.llvm.<hash>`) vary between otherwise
# identical fresh builds, so the shipped `_core` library differs build to build.
# A single codegen unit removes that source of nondeterminism.
[profile.release]
codegen-units = 1
