name: One-time enterprise issue adapter validation

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/one-time-enterprise-issue-adapters.yml

permissions: {}

concurrency:
  group: one-time-enterprise-issue-adapters-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.head_ref == 'feat-enterprise-issue-adapters-404'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat-enterprise-issue-adapters-404
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test and render authoritative documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m compileall -q python/fast_mlsirm/scoring/enterprise_issue
          python -m pytest tests/test_scoring_enterprise_issue_contracts.py
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          rm .github/workflows/one-time-enterprise-issue-adapters.yml
          git diff --check
      - name: Commit validated slice
        run: |
          git add -A
          git commit -m "feat(scoring): finalize enterprise issue evidence adapters"
          git fetch origin feat-enterprise-issue-adapters-404
          git rebase origin/feat-enterprise-issue-adapters-404
          git push origin "HEAD:feat-enterprise-issue-adapters-404"
