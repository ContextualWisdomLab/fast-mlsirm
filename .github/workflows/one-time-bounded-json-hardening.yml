name: One-time bounded JSON hardening

on:
  push:
    branches:
      - sentinel-json-dos-scripts-17708564860587448239
    paths:
      - .github/workflows/one-time-bounded-json-hardening.yml

permissions: {}

concurrency:
  group: one-time-bounded-json-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out exact security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sentinel-json-dos-scripts-17708564860587448239
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Bring branch current with main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Add shared bounded JSON contract
        run: |
          cat > scripts/_bounded_json.py <<'PY'
          """Bounded JSON helpers for repository automation scripts.

          Inputs are byte-bounded and scanned non-recursively for excessive
          object/array nesting before Python's recursive JSON decoder is called.
          """

          from __future__ import annotations

          import json
          from pathlib import Path
          from typing import Any

          MAX_JSON_BYTES = 32 * 1024 * 1024
          MAX_JSON_DEPTH = 128


          def _positive_limit(value: object, field_name: str) -> int:
              """Return one positive, non-Boolean integer limit."""
              if isinstance(value, bool) or not isinstance(value, int) or value <= 0:
                  raise ValueError(f"{field_name} must be a positive integer")
              return value


          def _validate_json_depth(content: bytes, *, path: Path, max_depth: int) -> None:
              """Reject structural nesting beyond ``max_depth`` without recursion."""
              depth = 0
              in_string = False
              escaped = False
              for byte in content:
                  if in_string:
                      if escaped:
                          escaped = False
                      elif byte == 0x5C:
                          escaped = True
                      elif byte == 0x22:
                          in_string = False
                      continue
                  if byte == 0x22:
                      in_string = True
                  elif byte in (0x5B, 0x7B):
                      depth += 1
                      if depth > max_depth:
                          raise ValueError(
                              f"JSON nesting exceeds maximum allowed depth "
                              f"{max_depth}: {path}"
                          )
                  elif byte in (0x5D, 0x7D) and depth:
                      depth -= 1


          def read_json_object(
              path: Path,
              *,
              max_bytes: int = MAX_JSON_BYTES,
              max_depth: int = MAX_JSON_DEPTH,
          ) -> dict[str, Any]:
              """Read one bounded UTF-8 JSON object from ``path``.

              The function reads at most ``max_bytes + 1`` bytes, rejects
              excessive structural depth before decoding, normalizes decoder
              recursion failures, and requires an object root.
              """
              byte_limit = _positive_limit(max_bytes, "max_bytes")
              depth_limit = _positive_limit(max_depth, "max_depth")
              with path.open("rb") as handle:
                  content = handle.read(byte_limit + 1)
              if len(content) > byte_limit:
                  raise ValueError(
                      f"JSON file exceeds maximum allowed size {byte_limit} bytes: {path}"
                  )
              text = content.decode("utf-8")
              _validate_json_depth(content, path=path, max_depth=depth_limit)
              try:
                  payload = json.loads(text)
              except RecursionError as exc:
                  raise ValueError(
                      f"JSON nesting exceeds decoder recursion capacity: {path}"
                  ) from exc
              if not isinstance(payload, dict):
                  raise RuntimeError(f"JSON artifact must be an object: {path}")
              return payload


          __all__ = ["MAX_JSON_BYTES", "MAX_JSON_DEPTH", "read_json_object"]
          PY
      - name: Delegate every governed script reader
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          paths = tuple(
              Path(value)
              for value in (
                  "scripts/build_benchmark_report.py",
                  "scripts/build_buyer_packet.py",
                  "scripts/build_commercial_release.py",
                  "scripts/build_figma_evidence_sync.py",
                  "scripts/build_pr_queue_governance.py",
                  "scripts/build_procurement_due_diligence.py",
                  "scripts/build_release_evidence_index.py",
                  "scripts/sales_readiness.py",
              )
          )
          imports = (
              "\ntry:\n"
              "    from scripts._bounded_json import read_json_object\n"
              "except ModuleNotFoundError:\n"
              "    from _bounded_json import read_json_object\n"
          )
          wrapper = (
              "def _read_json(path: Path) -> dict[str, Any]:\n"
              "    \"\"\"Read a size- and depth-bounded JSON object from disk.\"\"\"\n"
              "    return read_json_object(path)\n"
          )
          for path in paths:
              text = path.read_text(encoding="utf-8")
              tree = ast.parse(text)
              target = next(
                  node
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == "_read_json"
              )
              lines = text.splitlines(keepends=True)
              lines[target.lineno - 1 : target.end_lineno] = [wrapper]
              text = "".join(lines)
              text = text.replace("import json\n", "")
              text = text.replace("_MAX_JSON_BYTES = 32 * 1024 * 1024\n", "")
              if "from scripts._bounded_json import read_json_object" not in text:
                  tree = ast.parse(text)
                  import_end = max(
                      node.end_lineno
                      for node in tree.body
                      if isinstance(node, (ast.Import, ast.ImportFrom))
                      and node.end_lineno is not None
                  )
                  lines = text.splitlines(keepends=True)
                  lines.insert(import_end, imports)
                  text = "".join(lines)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Add deterministic security tests
        run: |
          cat > tests/test_bounded_json_scripts.py <<'PY'
          """Security and delegation tests for bounded script JSON readers."""

          from __future__ import annotations

          import importlib
          import json
          from pathlib import Path

          import pytest

          from scripts import _bounded_json
          from scripts._bounded_json import read_json_object

          MODULES = (
              "scripts.build_benchmark_report",
              "scripts.build_buyer_packet",
              "scripts.build_commercial_release",
              "scripts.build_figma_evidence_sync",
              "scripts.build_pr_queue_governance",
              "scripts.build_procurement_due_diligence",
              "scripts.build_release_evidence_index",
              "scripts.sales_readiness",
          )


          def _write(path: Path, content: bytes) -> Path:
              """Write exact bytes and return ``path``."""
              path.write_bytes(content)
              return path


          def test_valid_strings_unicode_and_exact_limits(tmp_path: Path) -> None:
              """String delimiters and escapes do not inflate structural depth."""
              content = json.dumps(
                  {"text": "[{}] \\\"quoted\\\" \\\\ slash", "nested": {"items": ["한글"]}},
                  ensure_ascii=False,
              ).encode()
              path = _write(tmp_path / "valid.json", content)
              assert read_json_object(path, max_bytes=len(content), max_depth=3) == json.loads(content)


          def test_depth_boundary_and_excess(tmp_path: Path) -> None:
              """The maximum depth is inclusive and the next level is rejected."""
              boundary = _write(tmp_path / "boundary.json", b'{"a":{"b":0}}')
              excessive = _write(tmp_path / "excessive.json", b'{"a":{"b":[]}}')
              assert read_json_object(boundary, max_depth=2) == {"a": {"b": 0}}
              with pytest.raises(ValueError, match="maximum allowed depth 2"):
                  read_json_object(excessive, max_depth=2)


          def test_size_boundary_and_excess(tmp_path: Path) -> None:
              """The exact byte bound is accepted and one extra byte is rejected."""
              exact = _write(tmp_path / "exact.json", b'{"a":1}')
              extra = _write(tmp_path / "extra.json", b'{"a":1} ')
              assert read_json_object(exact, max_bytes=7) == {"a": 1}
              with pytest.raises(ValueError, match="maximum allowed size 7 bytes"):
                  read_json_object(extra, max_bytes=7)


          @pytest.mark.parametrize(
              ("keyword", "value"),
              (("max_bytes", 0), ("max_bytes", True), ("max_bytes", "7"),
               ("max_depth", 0), ("max_depth", True), ("max_depth", "7")),
          )
          def test_invalid_limits_fail_closed(tmp_path: Path, keyword: str, value: object) -> None:
              """Limits must be positive non-Boolean integers."""
              path = _write(tmp_path / "input.json", b"{}")
              with pytest.raises(ValueError, match=f"{keyword} must be a positive integer"):
                  read_json_object(path, **{keyword: value})


          def test_syntax_utf8_root_and_recursion_failures(tmp_path: Path, monkeypatch) -> None:
              """Syntax, encoding, root, and recursion failures stay deterministic."""
              with pytest.raises(json.JSONDecodeError):
                  read_json_object(_write(tmp_path / "syntax.json", b'}{"a":1}'))
              with pytest.raises(UnicodeDecodeError):
                  read_json_object(_write(tmp_path / "utf8.json", b'{"a":"\xff"}'))
              with pytest.raises(RuntimeError, match="must be an object"):
                  read_json_object(_write(tmp_path / "root.json", b"[]"))
              path = _write(tmp_path / "recursion.json", b"{}")

              def raise_recursion(_: str) -> object:
                  raise RecursionError("deep")

              monkeypatch.setattr(_bounded_json.json, "loads", raise_recursion)
              with pytest.raises(ValueError, match="decoder recursion capacity"):
                  read_json_object(path)


          @pytest.mark.parametrize("module_name", MODULES)
          def test_all_script_readers_delegate(module_name: str, monkeypatch, tmp_path: Path) -> None:
              """Every governed script delegates to the shared bounded contract."""
              module = importlib.import_module(module_name)
              expected = {"bounded": True}
              path = tmp_path / "artifact.json"
              seen = []

              def fake_reader(value: Path):
                  seen.append(value)
                  return expected

              monkeypatch.setattr(module, "read_json_object", fake_reader)
              assert module._read_json(path) is expected
              assert seen == [path]
          PY
      - name: Document the security boundary and render changelog
        run: |
          cat > docs/bounded_json_input_security.md <<'MD'
          # Bounded JSON input security

          Repository automation treats JSON artifacts as untrusted input. All governed readers delegate to `scripts._bounded_json.read_json_object`, which enforces a 32 MiB bounded read and a non-recursive maximum structural depth of 128 before decoding. The scanner ignores delimiters inside strings and honors escape state; Python's standard decoder remains authoritative for syntax, UTF-8, and value construction. Object-root validation is preserved.

          Python documents that malicious JSON may consume substantial CPU and memory and recommends limiting untrusted input size. MITRE CWE-674 identifies missing recursion limits as an availability weakness and recommends rejecting excessive depth. The repository applies both independent controls and tests exact boundaries, excessive inputs, escapes, malformed syntax, invalid UTF-8, non-object roots, decoder recursion, and delegation.

          ## References

          MITRE. (2026, April 30). *CWE-674: Uncontrolled recursion* (CWE Version 4.20). https://cwe.mitre.org/data/definitions/674.html

          Python Software Foundation. (2026). *json—JSON encoder and decoder* (Python 3.12.13 documentation). https://docs.python.org/3.12/library/json.html
          MD
          cat > docs/changelog.d/bounded-json-input-hardening.md <<'MD'
          # Bounded JSON input hardening for automation scripts

          ## Security

          - Consolidated repository automation JSON reads behind one documented helper with a 32 MiB byte limit, a non-recursive 128-level structural depth limit, strict UTF-8 decoding, and object-root validation.
          - Added deterministic security, delegation, and boundary tests with 100% statement and branch coverage for the helper.
          MD
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          rm .github/workflows/one-time-bounded-json-hardening.yml
      - name: Install validation dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate hardened readers
        run: |
          pytest tests/test_bounded_json_scripts.py tests/test_changelog_fragment_contract.py \
            --cov=scripts._bounded_json --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(security): bound JSON size and nesting depth"
          git push origin "HEAD:sentinel-json-dos-scripts-17708564860587448239"
