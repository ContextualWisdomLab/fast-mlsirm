# Temporary workflow; it removes itself after applying and validating the fix.
name: One-time bounded JSON hardening

on:
  push:
    branches:
      - sentinel-json-dos-scripts-17708564860587448239
    paths:
      - .github/workflows/one-time-bounded-json-hardening.yml

permissions: {}

concurrency:
  group: one-time-bounded-json-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out exact security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sentinel-json-dos-scripts-17708564860587448239
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Bring branch current with main
        run: |
          git fetch origin main
          git merge --no-edit origin/main
      - name: Add shared bounded JSON contract
        run: |
          cat > scripts/_bounded_json.py <<'PY'
          """Bounded JSON input helpers for repository automation scripts.

          The helpers cap both bytes read and structural nesting before invoking
          Python's recursive JSON decoder. Brackets inside strings and escaped
          characters do not contribute to the structural depth count.
          """

          from __future__ import annotations

          import json
          from pathlib import Path
          from typing import Any

          MAX_JSON_BYTES = 32 * 1024 * 1024
          MAX_JSON_DEPTH = 128


          def _positive_limit(value: object, field_name: str) -> int:
              """Return one strictly positive, non-Boolean integer limit."""
              if isinstance(value, bool) or not isinstance(value, int) or value <= 0:
                  raise ValueError(f"{field_name} must be a positive integer")
              return value


          def _validate_json_depth(
              content: bytes,
              *,
              path: Path,
              max_depth: int,
          ) -> None:
              """Reject JSON whose object/array nesting exceeds ``max_depth``.

              This scanner is deliberately non-recursive and tracks JSON string
              and escape state so structural delimiters embedded in strings do
              not affect the depth count. Full syntax validation remains the
              responsibility of :func:`json.loads`.
              """
              depth = 0
              in_string = False
              escaped = False
              for byte in content:
                  if in_string:
                      if escaped:
                          escaped = False
                      elif byte == 0x5C:
                          escaped = True
                      elif byte == 0x22:
                          in_string = False
                      continue
                  if byte == 0x22:
                      in_string = True
                  elif byte in (0x5B, 0x7B):
                      depth += 1
                      if depth > max_depth:
                          raise ValueError(
                              f"JSON nesting exceeds maximum allowed depth "
                              f"{max_depth}: {path}"
                          )
                  elif byte in (0x5D, 0x7D) and depth:
                      depth -= 1


          def read_json_object(
              path: Path,
              *,
              max_bytes: int = MAX_JSON_BYTES,
              max_depth: int = MAX_JSON_DEPTH,
          ) -> dict[str, Any]:
              """Read one bounded UTF-8 JSON object from ``path``.

              At most ``max_bytes + 1`` bytes are read, allowing deterministic
              oversized-input rejection without loading an unbounded file. A
              non-recursive pre-scan rejects excessive object/array nesting
              before the standard-library decoder can exhaust the Python stack.
              """
              resolved_max_bytes = _positive_limit(max_bytes, "max_bytes")
              resolved_max_depth = _positive_limit(max_depth, "max_depth")
              with path.open("rb") as handle:
                  content = handle.read(resolved_max_bytes + 1)
              if len(content) > resolved_max_bytes:
                  raise ValueError(
                      f"JSON file exceeds maximum allowed size "
                      f"{resolved_max_bytes} bytes: {path}"
                  )
              text = content.decode("utf-8")
              _validate_json_depth(
                  content,
                  path=path,
                  max_depth=resolved_max_depth,
              )
              try:
                  payload = json.loads(text)
              except RecursionError as exc:
                  raise ValueError(
                      f"JSON nesting exceeds decoder recursion capacity: {path}"
                  ) from exc
              if not isinstance(payload, dict):
                  raise RuntimeError(f"JSON artifact must be an object: {path}")
              return payload


          __all__ = [
              "MAX_JSON_BYTES",
              "MAX_JSON_DEPTH",
              "read_json_object",
          ]
          PY
      - name: Delegate all repository automation readers
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          files = (
              "scripts/build_benchmark_report.py",
              "scripts/build_buyer_packet.py",
              "scripts/build_commercial_release.py",
              "scripts/build_figma_evidence_sync.py",
              "scripts/build_pr_queue_governance.py",
              "scripts/build_procurement_due_diligence.py",
              "scripts/build_release_evidence_index.py",
              "scripts/sales_readiness.py",
          )
          import_block = (
              "\ntry:\n"
              "    from scripts._bounded_json import read_json_object\n"
              "except ModuleNotFoundError:\n"
              "    from _bounded_json import read_json_object\n"
          )
          replacement = (
              "def _read_json(path: Path) -> dict[str, Any]:\n"
              "    \"\"\"Read a size- and depth-bounded JSON object from disk.\"\"\"\n"
              "    return read_json_object(path)\n"
          )

          for raw_path in files:
              path = Path(raw_path)
              text = path.read_text(encoding="utf-8")
              if "from scripts._bounded_json import read_json_object" not in text:
                  tree = ast.parse(text)
                  import_ends = [
                      node.end_lineno
                      for node in tree.body
                      if isinstance(node, (ast.Import, ast.ImportFrom))
                      and node.end_lineno is not None
                  ]
                  if not import_ends:
                      raise RuntimeError(f"no import anchor found in {path}")
                  lines = text.splitlines(keepends=True)
                  insert_at = max(import_ends)
                  lines.insert(insert_at, import_block)
                  text = "".join(lines)

              start = text.find("def _read_json(path: Path) -> dict[str, Any]:")
              if start < 0:
                  raise RuntimeError(f"_read_json contract missing in {path}")
              next_definition = text.find("\n\ndef ", start + 1)
              if next_definition < 0:
                  raise RuntimeError(f"next function anchor missing in {path}")
              text = text[:start] + replacement + text[next_definition + 2 :]
              path.write_text(text, encoding="utf-8")
          PY
      - name: Add deterministic security and delegation tests
        run: |
          cat > tests/test_bounded_json_scripts.py <<'PY'
          """Security and delegation tests for bounded script JSON readers."""

          from __future__ import annotations

          import importlib
          import json
          from pathlib import Path

          import pytest

          from scripts import _bounded_json
          from scripts._bounded_json import read_json_object

          _SCRIPT_MODULES = (
              "scripts.build_benchmark_report",
              "scripts.build_buyer_packet",
              "scripts.build_commercial_release",
              "scripts.build_figma_evidence_sync",
              "scripts.build_pr_queue_governance",
              "scripts.build_procurement_due_diligence",
              "scripts.build_release_evidence_index",
              "scripts.sales_readiness",
          )


          def _write(path: Path, content: bytes) -> Path:
              """Write exact bytes and return the resulting path."""
              path.write_bytes(content)
              return path


          def test_valid_object_preserves_string_delimiters_and_exact_limit(
              tmp_path: Path,
          ) -> None:
              """Strings, escapes, Unicode, and an exact byte limit parse normally."""
              content = json.dumps(
                  {
                      "text": "[{}] \\\"quoted\\\" \\\\ slash",
                      "nested": {"items": ["한글", 2]},
                  },
                  ensure_ascii=False,
              ).encode("utf-8")
              path = _write(tmp_path / "valid.json", content)

              assert read_json_object(
                  path,
                  max_bytes=len(content),
                  max_depth=3,
              ) == json.loads(content)


          def test_depth_limit_accepts_boundary_and_rejects_next_level(
              tmp_path: Path,
          ) -> None:
              """The structural scanner fails before decoder recursion is reachable."""
              boundary = _write(tmp_path / "boundary.json", b'{"a":{"b":0}}')
              excessive = _write(tmp_path / "excessive.json", b'{"a":{"b":[]}}')

              assert read_json_object(boundary, max_depth=2) == {"a": {"b": 0}}
              with pytest.raises(ValueError, match="maximum allowed depth 2"):
                  read_json_object(excessive, max_depth=2)


          def test_malformed_closer_is_left_to_json_syntax_validation(
              tmp_path: Path,
          ) -> None:
              """An unmatched closer cannot corrupt the non-recursive depth counter."""
              path = _write(tmp_path / "malformed.json", b'}{"value": 1}')

              with pytest.raises(json.JSONDecodeError):
                  read_json_object(path)


          def test_size_limit_rejects_only_oversized_content(tmp_path: Path) -> None:
              """The bounded read admits the exact limit and rejects one extra byte."""
              exact = _write(tmp_path / "exact.json", b'{"a":1}')
              oversized = _write(tmp_path / "oversized.json", b'{"a":1} ')

              assert read_json_object(exact, max_bytes=7) == {"a": 1}
              with pytest.raises(ValueError, match="maximum allowed size 7 bytes"):
                  read_json_object(oversized, max_bytes=7)


          @pytest.mark.parametrize(
              ("keyword", "value"),
              (("max_bytes", 0), ("max_bytes", True), ("max_depth", 0), ("max_depth", True)),
          )
          def test_limits_require_positive_non_boolean_integers(
              tmp_path: Path,
              keyword: str,
              value: object,
          ) -> None:
              """Configuration mistakes fail before file parsing."""
              path = _write(tmp_path / "value.json", b"{}")

              with pytest.raises(ValueError, match=f"{keyword} must be a positive integer"):
                  read_json_object(path, **{keyword: value})


          def test_invalid_utf8_and_non_object_roots_fail_closed(tmp_path: Path) -> None:
              """Readers retain the UTF-8 and object-root contracts."""
              invalid_utf8 = _write(tmp_path / "invalid_utf8.json", b'{"x":"\xff"}')
              array_root = _write(tmp_path / "array.json", b"[]")

              with pytest.raises(UnicodeDecodeError):
                  read_json_object(invalid_utf8)
              with pytest.raises(RuntimeError, match="must be an object"):
                  read_json_object(array_root)


          def test_decoder_recursion_error_is_normalized(
              monkeypatch: pytest.MonkeyPatch,
              tmp_path: Path,
          ) -> None:
              """Decoder-level recursion remains a deterministic validation failure."""
              path = _write(tmp_path / "object.json", b"{}")

              def raise_recursion(_: str) -> object:
                  raise RecursionError("decoder stack exhausted")

              monkeypatch.setattr(_bounded_json.json, "loads", raise_recursion)
              with pytest.raises(ValueError, match="decoder recursion capacity"):
                  read_json_object(path)


          @pytest.mark.parametrize("module_name", _SCRIPT_MODULES)
          def test_script_readers_delegate_to_shared_contract(
              module_name: str,
              monkeypatch: pytest.MonkeyPatch,
              tmp_path: Path,
          ) -> None:
              """Every governed automation script uses the same bounded reader."""
              module = importlib.import_module(module_name)
              marker = {"bounded": True}
              requested = tmp_path / "artifact.json"
              observed: list[Path] = []

              def fake_reader(path: Path) -> dict[str, bool]:
                  observed.append(path)
                  return marker

              monkeypatch.setattr(module, "read_json_object", fake_reader)

              assert module._read_json(requested) is marker
              assert observed == [requested]
          PY
      - name: Add security documentation and changelog fragment
        run: |
          cat > docs/bounded_json_input_security.md <<'MD'
          # Bounded JSON input security

          Repository automation scripts treat JSON artifacts as untrusted input. Every governed reader delegates to `scripts._bounded_json.read_json_object`, which enforces two independent availability controls before decoding:

          - a 32 MiB maximum read, implemented as a bounded `limit + 1` binary read;
          - a maximum object/array nesting depth of 128, checked by a non-recursive scanner that ignores brackets in JSON strings and honors escape state.

          The standard-library decoder remains authoritative for JSON syntax. UTF-8 decoding, object-root validation, and deterministic error handling are preserved. The depth scan is an availability guard rather than a replacement parser.

          Python's JSON documentation recommends limiting the size of untrusted JSON because malicious input can consume substantial CPU and memory. MITRE classifies missing recursion controls as CWE-674 and recommends a depth end condition that rejects excessive recursion. The repository therefore applies both byte and depth bounds and tests exact-limit, over-limit, escaped-string, malformed-input, invalid-UTF-8, non-object-root, and decoder-recursion behavior.

          ## References

          MITRE. (2026, April 30). *CWE-674: Uncontrolled recursion* (CWE Version 4.20). https://cwe.mitre.org/data/definitions/674.html

          Python Software Foundation. (2026). *json—JSON encoder and decoder* (Python 3.12.13 documentation). https://docs.python.org/3.12/library/json.html
          MD
          cat > docs/changelog.d/bounded-json-input-hardening.md <<'MD'
          # Bounded JSON input hardening for automation scripts

          ## Security

          - Consolidated repository automation JSON reads behind one documented helper with a 32 MiB byte limit, a non-recursive 128-level structural depth limit, strict UTF-8 decoding, and object-root validation.
          - Added deterministic tests for exact and oversized inputs, excessive nesting, delimiters and escapes inside strings, malformed syntax, decoder recursion, and delegation by every affected automation script.
          MD
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          rm .github/workflows/one-time-bounded-json-hardening.yml
      - name: Install package and CI dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run focused security validation
        run: |
          pytest \
            tests/test_bounded_json_scripts.py \
            tests/test_changelog_fragment_contract.py \
            --cov=scripts._bounded_json \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=100
      - name: Run repository validation affected by script imports
        run: |
          pytest \
            tests/test_benchmark_report.py \
            tests/test_buyer_packet.py \
            tests/test_commercial_release.py \
            tests/test_figma_evidence_sync.py \
            tests/test_pr_queue_governance.py \
            tests/test_procurement_due_diligence.py \
            tests/test_release_evidence_index.py \
            tests/test_sales_readiness.py
      - name: Commit hardened readers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(security): bound JSON size and nesting depth"
          git push origin "HEAD:sentinel-json-dos-scripts-17708564860587448239"
