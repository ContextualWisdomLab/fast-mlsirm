name: Apply CDM threshold source patch

on:
  push:
    branches: [feat/rust-true-parameter-recovery-389]
    paths: [.github/workflows/apply-cdm-threshold-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/rust-true-parameter-recovery-389
          fetch-depth: 0
      - name: Apply deterministic source patch
        run: python scripts/apply_cdm_threshold_patch.py
      - name: Commit only the statistical test correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/cdm_tests.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: calibrate higher-order recovery threshold to Monte Carlo error"
          git push origin HEAD:feat/rust-true-parameter-recovery-389
