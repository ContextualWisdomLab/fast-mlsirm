name: Enterprise calibration bundle changelog

on:
  push:
    branches:
      - feat/enterprise-calibration-bundle

permissions:
  contents: read

concurrency:
  group: enterprise-calibration-bundle-changelog
  cancel-in-progress: true

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enterprise-calibration-bundle
          fetch-depth: 0

      - name: Render authoritative changelog fragments
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          git diff --check

      - name: Commit rendered changelog and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enterprise-calibration-bundle-changelog.yml
          git add CHANGELOG.md
          git diff --cached --check
          git commit -m "docs(changelog): render enterprise calibration bundle"
          git push origin HEAD:feat/enterprise-calibration-bundle
