name: Development Source Snapshot

on:
  pull_request:
    paths:
      - .github/workflows/dev-source-snapshot.yml

permissions:
  contents: read

concurrency:
  group: dev-source-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Archive reviewed source
        run: |
          git rev-parse HEAD > /tmp/SOURCE_HEAD_SHA
          git archive --format=tar.gz --output=/tmp/source.tar.gz HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dev-source-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/source.tar.gz
            /tmp/SOURCE_HEAD_SHA
          if-no-files-found: error
          retention-days: 1
