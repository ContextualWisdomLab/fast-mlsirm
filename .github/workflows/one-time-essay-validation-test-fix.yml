# This workflow removes itself after correcting the validation contract test.
name: One-time essay validation test fix

on:
  push:
    branches:
      - feat/essay-validation-evidence-report
    paths:
      - .github/workflows/one-time-essay-validation-test-fix.yml

permissions: {}

concurrency:
  group: one-time-essay-validation-test-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-contract-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/essay-validation-evidence-report
          fetch-depth: 0
      - name: Correct structural gate assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_scoring_essay_validation_reporting.py")
          content = path.read_text(encoding="utf-8")
          old = '''    assert "threshold" not in str(payload)
              assert '\"pass\"' not in str(payload)
          '''
          new = '''    assert "pass" not in payload
              for metric_payload in payload["metrics"]:
                  assert "threshold" not in metric_payload
                  assert "pass" not in metric_payload
          '''
          if new not in content:
              if content.count(old) != 1:
                  raise RuntimeError("expected exactly one legacy gate assertion block")
              content = content.replace(old, new)
          path.write_text(content, encoding="utf-8")
          PY
      - name: Run focused validation
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
          pytest tests/test_scoring_essay_validation_reporting.py tests/test_scoring_essay_contracts.py
      - name: Commit fix and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-essay-validation-test-fix.yml
          git add tests/test_scoring_essay_validation_reporting.py
          git commit -m "test(essay): assert omitted gate fields structurally"
          git push origin "HEAD:feat/essay-validation-evidence-report"
