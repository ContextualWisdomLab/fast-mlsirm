# Temporary workflow; it removes itself after synchronizing exact contracts.
name: One-time facets HTML contract sync

on:
  push:
    branches:
      - feat/essay-facets-report-html
    paths:
      - .github/workflows/one-time-facets-html-sync.yml

permissions: {}

concurrency:
  group: one-time-facets-html-contract-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/essay-facets-report-html
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Synchronize public contracts and authoritative changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          contracts = Path("tests/test_scoring_essay_contracts.py")
          text = contracts.read_text(encoding="utf-8")
          anchor = '        "render_essay_score_report_html",\n'
          addition = '        "render_essay_facets_calibration_report_html",\n'
          if addition not in text:
              if text.count(anchor) != 1:
                  raise RuntimeError("expected one essay public-surface anchor")
              text = text.replace(anchor, addition + anchor)
          contracts.write_text(text, encoding="utf-8")

          exports = Path("tests/test_scoring_essay_reporting_exports.py")
          text = exports.read_text(encoding="utf-8")
          import_anchor = "import fast_mlsirm.scoring.essay as essay\n"
          import_line = (
              "import fast_mlsirm.scoring.essay.calibration_report_html "
              "as calibration_report_html\n"
          )
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line)
          expected_anchor = '        "render_essay_score_report_html",\n'
          expected_line = '        "render_essay_facets_calibration_report_html",\n'
          if expected_line not in text:
              text = text.replace(expected_anchor, expected_line + expected_anchor)
          identity_anchor = (
              "    assert (\n"
              "        essay.render_essay_score_report_html\n"
              "        is report_html.render_essay_score_report_html\n"
              "    )\n"
          )
          identity_block = (
              "    assert (\n"
              "        essay.render_essay_facets_calibration_report_html\n"
              "        is calibration_report_html.render_essay_facets_calibration_report_html\n"
              "    )\n"
          )
          if identity_block not in text:
              if text.count(identity_anchor) != 1:
                  raise RuntimeError("expected one score renderer identity anchor")
              text = text.replace(identity_anchor, identity_block + identity_anchor)
          doc_anchor = "    assert essay.render_essay_score_report_html.__doc__\n"
          doc_line = "    assert essay.render_essay_facets_calibration_report_html.__doc__\n"
          if doc_line not in text:
              text = text.replace(doc_anchor, doc_line + doc_anchor)
          exports.write_text(text, encoding="utf-8")

          html_tests = Path("tests/test_scoring_essay_facets_report_html.py")
          text = html_tests.read_text(encoding="utf-8")
          text = text.replace(
              '    assert "not evidence of model fit" not in html\n',
              "",
          )
          html_tests.write_text(text, encoding="utf-8")
          PY
          python scripts/render_changelog_fragments.py
          rm .github/workflows/one-time-facets-html-sync.yml
      - name: Commit synchronized contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            tests/test_scoring_essay_contracts.py \
            tests/test_scoring_essay_reporting_exports.py \
            tests/test_scoring_essay_facets_report_html.py \
            .github/workflows/one-time-facets-html-sync.yml
          git diff --cached --check
          git commit -m "test(essay): synchronize facets HTML public contracts"
          git push origin "HEAD:feat/essay-facets-report-html"
