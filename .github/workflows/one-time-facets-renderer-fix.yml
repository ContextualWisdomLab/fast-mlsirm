# Temporary workflow; it removes itself after applying exact tested fixes.
name: One-time facets renderer validation fix

on:
  push:
    branches:
      - feat/essay-facets-report-html
    paths:
      - .github/workflows/one-time-facets-renderer-fix.yml

permissions: {}

concurrency:
  group: one-time-facets-renderer-validation-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/essay-facets-report-html
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply exact renderer fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("python/fast_mlsirm/scoring/essay/calibration_report_html.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "validator: Callable[[object, str], _T],",
                  "validator: Callable[[object, str, str | None], _T],",
              ),
              (
                  '        validator(item, f"{field_name}[{index}]")\n',
                  '        validator(\n'
                  '            item,\n'
                  '            field_name,\n'
                  '            f"$.report.{field_name}[{index}]",\n'
                  '        )\n',
              ),
              (
                  "            report.category_values,\n"
                  "            report.category_values[1:],\n"
                  "            report.thresholds,\n",
                  "            report.category_values[:-1],\n"
                  "            report.category_values[1:],\n"
                  "            report.thresholds,\n",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f"expected one renderer target: {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/one-time-facets-renderer-fix.yml
      - name: Install package and CI dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run focused renderer validation
        run: |
          pytest \
            tests/test_scoring_essay_facets_report_html.py \
            tests/test_scoring_essay_facets_report_axis_labels.py
      - name: Commit exact fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(essay): repair facets renderer validation"
          git push origin "HEAD:feat/essay-facets-report-html"
