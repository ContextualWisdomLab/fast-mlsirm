# Temporary workflow; removes itself after rendering and validation.
name: One-time palette changelog finalize

on:
  push:
    branches:
      - palette/html-report-ux-a11y-13005393850638333940
    paths:
      - .github/workflows/one-time-palette-changelog-finalize.yml

permissions: {}

concurrency:
  group: one-time-palette-changelog-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: palette/html-report-ux-a11y-13005393850638333940
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Render authoritative changelog
        run: |
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
      - name: Install package and CI dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run focused validation
        run: |
          pytest \
            tests/test_scoring_essay_report_html.py \
            tests/test_changelog_fragment_contract.py
      - name: Commit rendered changelog and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-palette-changelog-finalize.yml
          git add CHANGELOG.md
          git diff --cached --check
          git commit -m "docs(changelog): render report accessibility notes"
          git push origin "HEAD:palette/html-report-ux-a11y-13005393850638333940"
