name: Render changelog once

on:
  push:
    branches:
      - feat/essay-score-report-review-routing

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render authoritative changelog fragments
        run: python scripts/render_changelog_fragments.py --update CHANGELOG.md
      - name: Commit rendered changelog
        shell: bash
        run: |
          git diff --check
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changelog update required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: render essay score report changelog fragment"
          git push origin "HEAD:${GITHUB_REF_NAME}"
