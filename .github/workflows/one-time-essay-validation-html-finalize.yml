# This workflow removes itself after rendering and validating the change.
name: One-time essay validation HTML finalize

on:
  push:
    branches:
      - feat/essay-validation-report-html
    paths:
      - .github/workflows/one-time-essay-validation-html-finalize.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: one-time-essay-validation-html-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/essay-validation-report-html
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Render authoritative changelog
        run: |
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
      - name: Install package and CI dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run focused validation
        run: |
          pytest \
            tests/test_scoring_essay_validation_reporting.py \
            tests/test_scoring_essay_validation_report_html.py \
            tests/test_scoring_essay_reporting_exports.py \
            tests/test_changelog_fragment_contract.py
      - name: Verify source-text and executable-content exclusions
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path(
              "python/fast_mlsirm/scoring/essay/validation_report_html.py"
          ).read_text(encoding="utf-8")
          test = Path(
              "tests/test_scoring_essay_validation_report_html.py"
          ).read_text(encoding="utf-8")
          required = (
              "render_essay_validation_evidence_report_html",
              "essay_validation_evidence_report_replay_mismatch",
              "mlsirm_core_agreement_validate_scoring",
          )
          for token in required:
              if token not in module:
                  raise RuntimeError(f"missing required renderer contract: {token}")
          for token in (
              'assert "automated_labels" not in first',
              'assert "reference_labels" not in first',
              'assert "&quot;threshold&quot;" not in first',
              'assert "&quot;pass&quot;" not in first',
              'assert "<script" not in first.lower()',
          ):
              if token not in test:
                  raise RuntimeError(f"missing required regression assertion: {token}")
          PY
      - name: Commit rendered changelog and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-essay-validation-html-finalize.yml
          git add CHANGELOG.md
          git diff --cached --check
          git commit -m "docs(changelog): render validation evidence HTML notes"
          git push origin "HEAD:feat/essay-validation-report-html"
