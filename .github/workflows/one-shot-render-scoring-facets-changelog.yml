name: One-shot Render Scoring Facets Changelog

on:
  push:
    branches:
      - feat/scoring-facets-handoff

permissions:
  contents: write

concurrency:
  group: one-shot-render-scoring-facets-changelog
  cancel-in-progress: true

jobs:
  render-and-clean:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/scoring-facets-handoff
          fetch-depth: 0

      - name: Render and verify authoritative changelog
        run: |
          set -euo pipefail
          python3 scripts/render_changelog_fragments.py --update CHANGELOG.md
          python3 scripts/render_changelog_fragments.py --check CHANGELOG.md

      - name: Commit rendered changelog and remove one-shot workflow
        run: |
          set -euo pipefail
          workflow=.github/workflows/one-shot-render-scoring-facets-changelog.yml
          rm "$workflow"
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(CHANGELOG\.md|\.github/workflows/one-shot-render-scoring-facets-changelog\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected changed paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md "$workflow"
          git commit -m "docs(changelog): render scoring facets handoff"
          git push origin HEAD:feat/scoring-facets-handoff
