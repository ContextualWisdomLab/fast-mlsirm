name: PR 533 restore changelog history

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  restore:
    if: github.event.pull_request.number == 533 && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Restore immutable released changelog history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python - <<'PY'
          from pathlib import Path
          import subprocess

          changelog_path = Path("CHANGELOG.md")
          current = changelog_path.read_text(encoding="utf-8")
          released_marker = "## [0.7.0] - 2026-08-04\n"
          if current.count(released_marker) != 1:
              raise SystemExit("expected one current 0.7.0 release marker")
          main = subprocess.check_output(
              ["git", "show", "origin/main:CHANGELOG.md"],
              text=True,
              encoding="utf-8",
          )
          if main.count(released_marker) != 1:
              raise SystemExit("expected one main 0.7.0 release marker")
          unreleased_prefix = current.split(released_marker, 1)[0]
          released_history = released_marker + main.split(released_marker, 1)[1]
          restored = unreleased_prefix + released_history
          restored = restored.replace(
              "#### Release cut 0.1.0\n\n"
              "- Project version is bumped to 0.1.1 in `pyproject.toml`,\n"
              "  `crates/mlsirm-core`, and `crates/fast-mlsirm-py`, and the accumulated\n"
              "  `Unreleased` notes (bifactor analytics and public API compatibility) now form the\n"
              "  `[0.1.1] - 2026-08-04` release section.",
              "#### Release cut 0.1.0\n\n"
              "- Project version is bumped to 0.1.0 in `pyproject.toml`,\n"
              "  `crates/mlsirm-core`, and `crates/fast-mlsirm-py`, and the accumulated\n"
              "  `Unreleased` notes (bifactor analytics and public API compatibility) now form the\n"
              "  `[0.1.0] - 2026-08-04` release section.",
          )
          restored = restored.replace(
              "[Unreleased]: https://github.com/ContextualWisdomLab/fast-mlsirm/compare/v0.7.0...HEAD\n",
              "",
          )
          changelog_path.write_text(restored, encoding="utf-8")
          PY
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          python -m pip install --require-hashes -r requirements/ci.txt
          pytest tests/test_changelog_fragment_contract.py
          git diff --check

      - name: Commit verified history restoration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "Released changelog history is already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "fix(changelog): restore immutable release history"
          git push origin HEAD:feat/enterprise-explicit-value-parser
