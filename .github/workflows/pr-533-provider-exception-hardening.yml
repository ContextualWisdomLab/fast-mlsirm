name: PR 533 provider boundary hardening

on:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review

permissions:
  contents: read

jobs:
  harden:
    if: github.event.pull_request.number == 533
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Seal provider trust and bounded collection boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          implementation = Path("python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py")
          text = implementation.read_text(encoding="utf-8")
          text = text.replace(
              "    AssessmentSpecError,\n    CanonicalContract,",
              "    CanonicalContract,",
              1,
          )

          old_limit = textwrap.dedent(
              '''\
                      candidates = self._candidates(source_text)
                      if len(candidates) > self.maximum_records:
                          raise assessment_error(
                              "explicit_value_record_limit",
                              "$.source_text",
                              "source text contains more explicit values than the configured limit",
                          )
                      revision = self.parser_revision_fingerprint
              '''
          )
          new_limit = textwrap.dedent(
              '''\
                      candidates = self._candidates(source_text)
                      revision = self.parser_revision_fingerprint
              '''
          )
          if old_limit not in text:
              raise SystemExit("expected post-collection limit block not found")
          text = text.replace(old_limit, new_limit, 1)

          candidates_start = text.index(
              "    def _candidates(self, source_text: str) -> tuple[_Candidate, ...]:"
          )
          candidates_end = text.index(
              "    @staticmethod\n    def _deadlines",
              candidates_start,
          )
          candidates_block = textwrap.indent(
              textwrap.dedent(
                  '''\
                  def _append_candidate(
                      self,
                      values: list[_Candidate],
                      item: _Candidate,
                  ) -> None:
                      """Append one candidate and stop after the configured limit plus one."""
                      values.append(item)
                      if len(values) > self.maximum_records:
                          raise assessment_error(
                              "explicit_value_record_limit",
                              "$.source_text",
                              "source text contains more explicit values than the configured limit",
                          )

                  def _candidates(self, source_text: str) -> tuple[_Candidate, ...]:
                      """Return valid candidates under bounded deterministic overlap rules."""
                      for match in _DATE_PATTERN.finditer(source_text):
                          _calendar_date(match.group("date"), "$.source_text")

                      values: list[_Candidate] = []
                      blocked: list[tuple[int, int]] = []
                      for item in self._deadlines(source_text):
                          self._append_candidate(values, item)
                          blocked.append((item.start_offset, item.end_offset))
                      for producer in (
                          self._money(source_text),
                          self._frequencies(source_text),
                          self._identifiers(source_text),
                          self._dates(source_text, tuple(blocked)),
                      ):
                          for item in producer:
                              self._append_candidate(values, item)

                      ordered = sorted(
                          values,
                          key=lambda item: (
                              item.start_offset,
                              item.end_offset,
                              item.value_kind.value,
                              json.dumps(item.normalized_payload, sort_keys=True),
                          ),
                      )
                      for previous, current in zip(ordered, ordered[1:]):
                          if current.start_offset < previous.end_offset:
                              raise assessment_error(
                                  "overlapping_explicit_values",
                                  "$.source_text",
                                  "accepted explicit values must not overlap",
                              )
                      return tuple(ordered)
                  '''
              ),
              "    ",
          ) + "\n"
          text = text[:candidates_start] + candidates_block + text[candidates_end:]

          output_start = text.index("def _validated_parser_output(")
          output_end = text.index("def parse_enterprise_explicit_values(", output_start)
          output_block = textwrap.dedent(
              '''\
              def _canonical_parser_record(
                  source_record: EnterpriseSourceRecord,
                  source_text: str,
                  item: Any,
                  path: str,
              ) -> ExplicitValueRecord:
                  """Reconstruct one untrusted provider record through canonical validation."""
                  if type(item) is not ExplicitValueRecord:
                      raise assessment_error(
                          "invalid_explicit_value_parser_output",
                          path,
                          "parser output must contain only exact ExplicitValueRecord values",
                      )
                  if type(item.source_id) is not str or item.source_id != source_record.source_id:
                      raise assessment_error(
                          "parser_output_source_mismatch",
                          path,
                          "parser output source_id does not match source_record",
                      )
                  if (
                      type(item.source_record_fingerprint) is not str
                      or item.source_record_fingerprint
                      != source_record.source_record_fingerprint
                  ):
                      raise assessment_error(
                          "parser_output_source_mismatch",
                          path,
                          "parser output source fingerprint does not match source_record",
                      )
                  try:
                      start_offset = _offset(item.start_offset, "start_offset")
                      end_offset = _offset(item.end_offset, "end_offset")
                  except Exception:
                      raise assessment_error(
                          "invalid_explicit_value_parser_output",
                          path,
                          "parser output offsets are not canonical nonnegative integers",
                      ) from None
                  if end_offset <= start_offset or end_offset > len(source_text):
                      raise assessment_error(
                          "parser_output_span_out_of_bounds",
                          path,
                          "parser output span exceeds verified source text",
                      )
                  expected_span = hashlib.sha256(
                      source_text[start_offset:end_offset].encode("utf-8")
                  ).hexdigest()
                  if (
                      type(item.span_content_fingerprint) is not str
                      or item.span_content_fingerprint != expected_span
                  ):
                      raise assessment_error(
                          "parser_output_span_mismatch",
                          path,
                          "parser output span fingerprint does not match verified source text",
                      )
                  try:
                      return ExplicitValueRecord(
                          source_id=source_record.source_id,
                          source_record_fingerprint=source_record.source_record_fingerprint,
                          span_content_fingerprint=expected_span,
                          start_offset=start_offset,
                          end_offset=end_offset,
                          value_kind=item.value_kind,
                          normalized_payload=item.normalized_payload,
                          parser_revision_fingerprint=item.parser_revision_fingerprint,
                          metadata=item.metadata,
                          schema_version=source_record.schema_version,
                      )
                  except Exception:
                      raise assessment_error(
                          "invalid_explicit_value_parser_output",
                          path,
                          "parser output record is not canonical",
                      ) from None


              def _validated_parser_output(
                  source_record: EnterpriseSourceRecord,
                  source_text: str,
                  values: Any,
              ) -> tuple[ExplicitValueRecord, ...]:
                  """Return fresh canonical records from one provider callback."""
                  if type(values) is not tuple:
                      raise assessment_error(
                          "invalid_explicit_value_parser_output",
                          "$.parser_output",
                          "parser output must be a tuple of ExplicitValueRecord values",
                      )
                  if len(values) > MAX_EXPLICIT_VALUE_RECORDS:
                      raise assessment_error(
                          "explicit_value_record_limit",
                          "$.parser_output",
                          "parser output exceeds the bounded explicit-value record limit",
                      )
                  records = [
                      _canonical_parser_record(
                          source_record,
                          source_text,
                          item,
                          f"$.parser_output[{index}]",
                      )
                      for index, item in enumerate(values)
                  ]
                  ordered = tuple(
                      sorted(
                          records,
                          key=lambda item: (
                              item.start_offset,
                              item.end_offset,
                              item.value_kind.value,
                              item.explicit_value_fingerprint,
                          ),
                      )
                  )
                  record_fingerprints = tuple(
                      item.explicit_value_fingerprint for item in ordered
                  )
                  if len(set(record_fingerprints)) != len(record_fingerprints):
                      raise assessment_error(
                          "duplicate_explicit_value_record",
                          "$.parser_output",
                          "parser output records must be unique",
                      )
                  for previous, current in zip(ordered, ordered[1:]):
                      if current.start_offset < previous.end_offset:
                          raise assessment_error(
                              "overlapping_explicit_values",
                              "$.parser_output",
                              "parser output records must not overlap",
                          )
                  return ordered


              '''
          )
          text = text[:output_start] + output_block + text[output_end:]

          callback_start = text.index(
              "    try:\n        values = resolved.parse(source_record, source_text)\n",
              text.index("def parse_enterprise_explicit_values("),
          )
          callback_end = text.index(
              "    return _validated_parser_output(source_record, source_text, values)\n",
              callback_start,
          ) + len("    return _validated_parser_output(source_record, source_text, values)\n")
          callback_block = textwrap.dedent(
              '''\
                  if parser is None:
                      values = resolved.parse(source_record, source_text)
                  else:
                      try:
                          values = resolved.parse(source_record, source_text)
                      except Exception:
                          raise assessment_error(
                              "explicit_value_parser_failure",
                              "$.parser",
                              "parser failed before returning validated explicit values",
                          ) from None
                  return _validated_parser_output(source_record, source_text, values)
              '''
          )
          text = text[:callback_start] + callback_block + text[callback_end:]
          implementation.write_text(text, encoding="utf-8")
          PY

          cat > tests/test_scoring_enterprise_explicit_values_provider_boundary.py <<'PYTEST'
          """Security and ownership tests for enterprise explicit-value provider adapters."""

          from __future__ import annotations

          import hashlib
          from typing import Any

          import pytest

          from fast_mlsirm.scoring import AssessmentSpecError
          from fast_mlsirm.scoring.enterprise_issue import (
              DeterministicExplicitValueParser,
              EnterpriseSourceRecord,
              ExplicitValueKind,
              ExplicitValueRecord,
              parse_enterprise_explicit_values,
          )
          from fast_mlsirm.scoring.enterprise_issue import explicit_values as parser_module


          def _source(text: str) -> EnterpriseSourceRecord:
              """Build one exact-replay enterprise source record."""
              return EnterpriseSourceRecord(
                  source_id="customer_report",
                  source_family_id="customer_feedback",
                  source_content_fingerprint=hashlib.sha256(text.encode("utf-8")).hexdigest(),
                  source_character_count=len(text),
                  metadata={"source_channel": "support_portal"},
              )


          class _StaticParser:
              """Return one configured value through the provider protocol."""

              def __init__(self, output: Any) -> None:
                  """Store one configured provider output."""
                  self.output = output

              def parse(
                  self,
                  source_record: EnterpriseSourceRecord,
                  source_text: str,
              ) -> Any:
                  """Return the configured value after observing exact inputs."""
                  assert source_record.source_id == "customer_report"
                  assert source_text
                  return self.output


          def test_custom_structured_exception_is_redacted() -> None:
              """A caller-supplied parser cannot expose private structured detail."""
              text = "No explicit values."
              source = _source(text)

              class FailingParser:
                  """Raise a provider-owned structured exception."""

                  def parse(
                      self,
                      source_record: EnterpriseSourceRecord,
                      source_text: str,
                  ) -> tuple[ExplicitValueRecord, ...]:
                      """Raise private detail after exact argument checks."""
                      assert source_record is source
                      assert source_text == text
                      raise parser_module.assessment_error(
                          "provider_private_error",
                          "$.provider",
                          "private structured provider detail",
                      )

              with pytest.raises(
                  AssessmentSpecError,
                  match="explicit_value_parser_failure",
              ) as captured:
                  parse_enterprise_explicit_values(source, text, parser=FailingParser())
              assert "private structured provider detail" not in str(captured.value)


          def test_provider_records_are_reconstructed_and_subclasses_rejected() -> None:
              """Provider-owned records never cross the canonical public boundary."""
              text = "event 2026-09-30"
              source = _source(text)
              supplied = DeterministicExplicitValueParser().parse(source, text)
              returned = parse_enterprise_explicit_values(
                  source,
                  text,
                  parser=_StaticParser(supplied),
              )
              assert returned == supplied
              assert returned[0] is not supplied[0]

              class ExplicitValueSubclass(ExplicitValueRecord):
                  """Represent an adversarial provider-owned subclass."""

              record = supplied[0]
              subclass_record = ExplicitValueSubclass(
                  source_id=record.source_id,
                  source_record_fingerprint=record.source_record_fingerprint,
                  span_content_fingerprint=record.span_content_fingerprint,
                  start_offset=record.start_offset,
                  end_offset=record.end_offset,
                  value_kind=record.value_kind,
                  normalized_payload=record.to_dict()["normalized_payload"],
                  parser_revision_fingerprint=record.parser_revision_fingerprint,
                  metadata=record.to_dict()["metadata"],
                  schema_version=record.schema_version,
              )
              with pytest.raises(
                  AssessmentSpecError,
                  match="invalid_explicit_value_parser_output",
              ):
                  parse_enterprise_explicit_values(
                      source,
                      text,
                      parser=_StaticParser((subclass_record,)),
                  )


          def test_mutated_provider_records_fail_through_redacted_validation() -> None:
              """Post-construction mutation cannot bypass canonical validation."""
              text = "event 2026-09-30"
              source = _source(text)

              metadata_record = DeterministicExplicitValueParser().parse(source, text)[0]
              object.__setattr__(
                  metadata_record,
                  "metadata",
                  {"source_text": "private_value"},
              )
              with pytest.raises(
                  AssessmentSpecError,
                  match="invalid_explicit_value_parser_output",
              ) as captured:
                  parse_enterprise_explicit_values(
                      source,
                      text,
                      parser=_StaticParser((metadata_record,)),
                  )
              assert "private_value" not in str(captured.value)

              offset_record = DeterministicExplicitValueParser().parse(source, text)[0]
              object.__setattr__(offset_record, "start_offset", object())
              with pytest.raises(
                  AssessmentSpecError,
                  match="invalid_explicit_value_parser_output",
              ):
                  parse_enterprise_explicit_values(
                      source,
                      text,
                      parser=_StaticParser((offset_record,)),
                  )


          def test_candidate_limit_stops_at_limit_plus_one(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              """Candidate collection does not exhaust an unexpectedly prolific iterator."""
              parser = DeterministicExplicitValueParser(maximum_records=1)
              observed: list[int] = []

              def generated_money(
                  self: DeterministicExplicitValueParser,
                  source_text: str,
              ) -> Any:
                  """Yield two candidates and fail if a third is requested."""
                  del self, source_text
                  for index in range(3):
                      observed.append(index)
                      if index == 2:
                          raise AssertionError("candidate producer was over-consumed")
                      yield parser_module._Candidate(
                          start_offset=index,
                          end_offset=index + 1,
                          value_kind=ExplicitValueKind.MONEY_AMOUNT,
                          normalized_payload={
                              "currency_code": "USD",
                              "decimal_amount": "1",
                          },
                      )

              monkeypatch.setattr(
                  DeterministicExplicitValueParser,
                  "_money",
                  generated_money,
              )
              with pytest.raises(
                  AssessmentSpecError,
                  match="explicit_value_record_limit",
              ):
                  parser._candidates("")
              assert observed == [0, 1]
          PYTEST

      - name: Install focused validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Format and verify provider boundary
        shell: bash
        run: |
          set -euo pipefail
          ruff format python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py tests/test_scoring_enterprise_explicit_values_provider_boundary.py
          ruff check python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py tests/test_scoring_enterprise_explicit_values.py tests/test_scoring_enterprise_explicit_values_provider_boundary.py
          pytest tests/test_scoring_enterprise_explicit_values.py tests/test_scoring_enterprise_explicit_values_provider_boundary.py \
            --cov=fast_mlsirm.scoring.enterprise_issue.explicit_values \
            --cov-branch --cov-report=term-missing --cov-fail-under=100
          python scripts/render_changelog_fragments.py --check CHANGELOG.md

      - name: Commit hardening and remove one-shot artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/pr-533-provider-exception-hardening.yml
          git rm -f .github/pr-533-provider-exception-trigger.txt
          git add -A
          git diff --cached --check
          git commit -m "fix(enterprise): seal provider trust boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
