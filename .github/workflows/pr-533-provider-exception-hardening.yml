name: PR 533 provider boundary hardening

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  harden:
    if: github.event.pull_request.number == 533 && contains(github.event.pull_request.head.ref, 'enterprise-explicit-value-parser')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply provider-boundary hardening
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/pr_533_harden.py

      - name: Install focused validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Format and verify provider boundary
        shell: bash
        run: |
          set -euo pipefail
          ruff format python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py tests/test_scoring_enterprise_explicit_values_provider_boundary.py
          ruff check python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py tests/test_scoring_enterprise_explicit_values.py tests/test_scoring_enterprise_explicit_values_provider_boundary.py
          pytest tests/test_scoring_enterprise_explicit_values.py tests/test_scoring_enterprise_explicit_values_provider_boundary.py \
            --cov=fast_mlsirm.scoring.enterprise_issue.explicit_values \
            --cov-branch --cov-report=term-missing --cov-fail-under=100
          python scripts/render_changelog_fragments.py --check CHANGELOG.md

      - name: Commit hardening and remove one-shot artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/pr-533-provider-exception-hardening.yml
          git rm -f .github/pr-533-provider-exception-trigger.txt
          git rm -f .github/scripts/pr_533_harden.py
          git add -A
          git diff --cached --check
          git commit -m "fix(enterprise): seal provider trust boundary"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
