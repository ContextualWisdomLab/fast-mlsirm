name: PR 533 provider boundary hardening

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  harden:
    if: github.event.pull_request.number == 533 && contains(github.event.pull_request.head.ref, 'enterprise-explicit-value-parser')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply provider-boundary hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          helper = Path('.github/scripts/pr_533_harden.py')
          text = helper.read_text(encoding='utf-8')
          start = text.index(
              '    text = _replace_exact(\n'
              '        text,\n'
              '        textwrap.dedent(\n'
              "            '''\\\n"
              '                    candidates = self._candidates(source_text)\n'
          )
          end = text.index('\n\n    candidates_start =', start)
          replacement = (
              '    parse_start = text.index(\n'
              '        "        candidates = self._candidates(source_text)\\n"\n'
              '    )\n'
              '    revision_start = text.index(\n'
              '        "        revision = self.parser_revision_fingerprint\\n",\n'
              '        parse_start,\n'
              '    )\n'
              '    text = (\n'
              '        text[:parse_start]\n'
              '        + "        candidates = self._candidates(source_text)\\n"\n'
              '        + text[revision_start:]\n'
              '    )\n'
          )
          helper.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          python .github/scripts/pr_533_harden.py
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py')
          text = path.read_text(encoding='utf-8')
          before = textwrap.dedent(
              '''\
              if parser is None:
                  values = resolved.parse(source_record, source_text)
              else:
                  try:
                      values = resolved.parse(source_record, source_text)
                  except Exception:
                      raise assessment_error(
                          "explicit_value_parser_failure",
                          "$.parser",
                          "parser failed before returning validated explicit values",
                      ) from None
              return _validated_parser_output(source_record, source_text, values)
              '''
          )
          if text.count(before) != 1:
              raise SystemExit('expected exactly one unindented parser callback block')
          path.write_text(
              text.replace(before, textwrap.indent(before, '    '), 1),
              encoding='utf-8',
          )
          PY
          python -m py_compile \
            python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py \
            tests/test_scoring_enterprise_explicit_values_provider_boundary.py

      - name: Install focused validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify focused provider boundary
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_scoring_enterprise_explicit_values.py tests/test_scoring_enterprise_explicit_values_provider_boundary.py
          python scripts/render_changelog_fragments.py --check CHANGELOG.md

      - name: Commit hardening and remove one-shot artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/pr-533-provider-exception-hardening.yml
          git rm -f .github/workflows/pr-533-prepare-hardening-runtime.yml
          git rm -f .github/pr-533-provider-exception-trigger.txt
          git rm -f .github/scripts/pr_533_harden.py
          git add -A
          git diff --cached --check
          git commit -m "fix(enterprise): seal provider trust boundary"
          git push origin "HEAD:${PR_HEAD_REF}"
