name: Apply adaptive factor rotation integration

on:
  push:
    branches: [feat/adaptive-factor-rotation-core]
    paths:
      - .github/workflows/apply-rotation-core-patch.yml
      - scripts/fix_rotation_math_contract.py
      - scripts/sitecustomize.py
  pull_request:
    branches: [main]
    paths:
      - crates/mlsirm-core/src/rotation/**
      - python/fast_mlsirm/rotation*.py
      - tests/test_rotation*.py
      - scripts/fix_rotation_math_contract.py
      - scripts/sitecustomize.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/adaptive-factor-rotation-core
          fetch-depth: 0
      - name: Apply exact mathematical corrections
        run: python scripts/fix_rotation_math_contract.py
      - name: Apply exact-marker integration
        run: python scripts/apply_rotation_core_patch.py
      - name: Format Rust workspace
        run: cargo fmt --all
      - name: Verify Rust rotation unit tests without GPU graph
        run: cargo test -p mlsirm-core --no-default-features rotation --lib
      - name: Compile PyO3 integration
        run: cargo check -p fast-mlsirm-py
      - name: Remove one-shot patch machinery
        run: |
          rm scripts/apply_rotation_core_patch.py
          rm scripts/fix_rotation_math_contract.py
          rm scripts/sitecustomize.py
          rm .github/workflows/apply-rotation-core-patch.yml
      - name: Commit reviewed integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/mlsirm-core/src/lib.rs \
            crates/mlsirm-core/src/rotation \
            crates/fast-mlsirm-py/src/lib.rs \
            python/fast_mlsirm/__init__.py \
            python/fast_mlsirm/factor.py \
            README.md CHANGELOG.md \
            scripts/apply_rotation_core_patch.py \
            scripts/fix_rotation_math_contract.py \
            scripts/sitecustomize.py \
            .github/workflows/apply-rotation-core-patch.yml
          git commit -m "feat: integrate adaptive factor rotation API"
          git push origin HEAD:feat/adaptive-factor-rotation-core
