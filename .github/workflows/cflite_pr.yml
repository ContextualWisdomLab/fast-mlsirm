name: ClusterFuzzLite PR fuzzing
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
    paths:
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite_pr.yml"
      - "Cargo.toml"
      - "crates/**"
      - "fuzz/**"

permissions:
  contents: read
  security-events: write

jobs:
  central:
    uses: ContextualWisdomLab/.github/.github/workflows/fast-mlsirm-cflite_pr.yml@f47dbe2ddb388ffe7a31b0dc15e1ea8063772202
