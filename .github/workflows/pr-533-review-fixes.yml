name: PR 533 review fixes

on:
  push:
    branches:
      - feat/enterprise-explicit-value-parser

permissions:
  contents: read

jobs:
  fix:
    if: github.event.head_commit.message == 'fix(review): address CodeRabbit parser findings'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enterprise-explicit-value-parser
          fetch-depth: 0

      - name: Apply verified review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          implementation = Path(
              "python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py"
          )
          text = implementation.read_text(encoding="utf-8")

          replacements = (
              (
                  "import hashlib\nimport json\nimport re\nfrom typing import Any, Protocol, runtime_checkable",
                  "import hashlib\nfrom itertools import pairwise\nimport json\nimport re\nfrom typing import Any, NoReturn, Protocol, runtime_checkable",
              ),
              (
                  "    EnterpriseAssertionKind,\n    EnterpriseSourceRecord,\n    EvidenceSpanRecord,",
                  "    EnterpriseAssertionKind,\n    EnterpriseSourceRecord,\n    EvidenceSpanRecord,\n    MAX_ENTERPRISE_SOURCE_CHARACTERS,",
              ),
              (
                  '        object.__setattr__(self, "start_offset", _offset(self.start_offset, "start_offset"))\n'
                  '        object.__setattr__(self, "end_offset", _offset(self.end_offset, "end_offset"))\n'
                  '        if self.end_offset <= self.start_offset:',
                  '        object.__setattr__(self, "start_offset", _offset(self.start_offset, "start_offset"))\n'
                  '        object.__setattr__(self, "end_offset", _offset(self.end_offset, "end_offset"))\n'
                  '        if self.start_offset > MAX_ENTERPRISE_SOURCE_CHARACTERS:\n'
                  '            raise assessment_error(\n'
                  '                "invalid_start_offset",\n'
                  '                "$.start_offset",\n'
                  '                (\n'
                  '                    "start_offset must be between 0 and "\n'
                  '                    f"{MAX_ENTERPRISE_SOURCE_CHARACTERS}"\n'
                  '                ),\n'
                  '            )\n'
                  '        if self.end_offset > MAX_ENTERPRISE_SOURCE_CHARACTERS:\n'
                  '            raise assessment_error(\n'
                  '                "invalid_end_offset",\n'
                  '                "$.end_offset",\n'
                  '                (\n'
                  '                    "end_offset must be between 0 and "\n'
                  '                    f"{MAX_ENTERPRISE_SOURCE_CHARACTERS}"\n'
                  '                ),\n'
                  '            )\n'
                  '        if self.end_offset <= self.start_offset:',
              ),
              (
                  "    def _payload_error(message: str) -> None:",
                  "    def _payload_error(message: str) -> NoReturn:",
              ),
              (
                  "for previous, current in zip(ordered, ordered[1:]):",
                  "for previous, current in pairwise(ordered):",
              ),
          )
          for before, after in replacements:
              count = text.count(before)
              expected = 2 if before.startswith("for previous") else 1
              if count != expected:
                  raise SystemExit(
                      f"expected {expected} occurrence(s), found {count}: {before[:80]}"
                  )
              text = text.replace(before, after)
          implementation.write_text(text, encoding="utf-8")

          tests = Path("tests/test_scoring_enterprise_explicit_values.py")
          test_text = tests.read_text(encoding="utf-8")
          before = '''def _normalized(records: tuple[ExplicitValueRecord, ...]) -> set[tuple[str, str]]:
              """Return kind/payload pairs independent of source offsets."""
              return {
                  (record.value_kind.value, repr(record.to_dict()["normalized_payload"]))
                  for record in records
              }
          '''
          after = '''def _normalized(
              records: tuple[ExplicitValueRecord, ...],
          ) -> set[tuple[str, tuple[tuple[str, Any], ...]]]:
              """Return kind/payload pairs independent of offsets and key order."""
              return {
                  (
                      record.value_kind.value,
                      tuple(sorted(record.to_dict()["normalized_payload"].items())),
                  )
                  for record in records
              }
          '''
          before = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in before.splitlines()
          )
          after = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in after.splitlines()
          )
          if test_text.count(before) != 1:
              raise SystemExit("normalized helper block not found exactly once")
          test_text = test_text.replace(before, after, 1)

          start = test_text.index(
              '@pytest.mark.parametrize(\n    ("kind", "payload"),'
          )
          end = test_text.index(
              '\n\n@pytest.mark.parametrize(\n    ("changes", "error"),',
              start,
          )
          payload_block = '''@pytest.mark.parametrize(
              ("kind", "payload", "expected_code"),
              (
                  (ExplicitValueKind.CALENDAR_DATE, [], "invalid_metadata"),
                  (
                      ExplicitValueKind.CALENDAR_DATE,
                      {},
                      "invalid_normalized_payload",
                  ),
                  (
                      ExplicitValueKind.CALENDAR_DATE,
                      {"calendar_date": 1},
                      "invalid_calendar_date",
                  ),
                  (
                      ExplicitValueKind.CALENDAR_DATE,
                      {"calendar_date": "2026-02-30"},
                      "invalid_calendar_date",
                  ),
                  (
                      ExplicitValueKind.MONEY_AMOUNT,
                      {"currency_code": "usd", "decimal_amount": "1"},
                      "invalid_normalized_payload",
                  ),
                  (
                      ExplicitValueKind.MONEY_AMOUNT,
                      {"currency_code": "USD", "decimal_amount": 1},
                      "invalid_normalized_payload",
                  ),
                  (
                      ExplicitValueKind.MONEY_AMOUNT,
                      {"currency_code": "USD", "decimal_amount": "abc"},
                      "invalid_decimal_amount",
                  ),
                  (
                      ExplicitValueKind.MONEY_AMOUNT,
                      {"currency_code": "USD", "decimal_amount": "-1"},
                      "invalid_decimal_amount",
                  ),
                  (
                      ExplicitValueKind.MONEY_AMOUNT,
                      {"currency_code": "USD", "decimal_amount": "1.00"},
                      "invalid_normalized_payload",
                  ),
                  (
                      ExplicitValueKind.FREQUENCY_COUNT,
                      {"frequency_count": True, "frequency_period": "month"},
                      "invalid_normalized_payload",
                  ),
                  (
                      ExplicitValueKind.FREQUENCY_COUNT,
                      {
                          "frequency_count": 1_000_000_001,
                          "frequency_period": "month",
                      },
                      "invalid_frequency_count",
                  ),
                  (
                      ExplicitValueKind.FREQUENCY_COUNT,
                      {"frequency_count": 1, "frequency_period": []},
                      "invalid_normalized_payload",
                  ),
                  (
                      ExplicitValueKind.FREQUENCY_COUNT,
                      {"frequency_count": 1, "frequency_period": "decade"},
                      "invalid_normalized_payload",
                  ),
                  (
                      ExplicitValueKind.CUSTOMER_IDENTIFIER,
                      {},
                      "invalid_normalized_payload",
                  ),
                  (
                      ExplicitValueKind.CUSTOMER_IDENTIFIER,
                      {"identifier_fingerprint": "bad"},
                      "invalid_identifier_fingerprint",
                  ),
              ),
          )
          def test_kind_specific_payloads_fail_closed(
              kind: ExplicitValueKind,
              payload: Any,
              expected_code: str,
          ) -> None:
              """Noncanonical payloads fail with their stable structured code."""
              with pytest.raises(AssessmentSpecError) as captured:
                  _record(kind, payload=payload)
              assert captured.value.code == expected_code
          '''
          payload_block = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in payload_block.splitlines()
          )
          test_text = test_text[:start] + payload_block + test_text[end:]

          before = '''        ({"start_offset": -1}, "invalid_start_offset"),
                  ({"end_offset": True}, "invalid_end_offset"),
                  ({"end_offset": 2}, "invalid_explicit_value_offsets"),'''
          after = '''        ({"start_offset": -1}, "invalid_start_offset"),
                  ({"start_offset": 100_000_001}, "invalid_start_offset"),
                  ({"end_offset": True}, "invalid_end_offset"),
                  ({"end_offset": 100_000_001}, "invalid_end_offset"),
                  ({"end_offset": 2}, "invalid_explicit_value_offsets"),'''
          before = "\n".join(
              line[8:] if line.startswith("        ") else line
              for line in before.splitlines()
          )
          after = "\n".join(
              line[8:] if line.startswith("        ") else line
              for line in after.splitlines()
          )
          if test_text.count(before) != 1:
              raise SystemExit("offset validation parameter block not found")
          test_text = test_text.replace(before, after, 1)
          tests.write_text(test_text, encoding="utf-8")

          docs = Path("docs/enterprise_issue_evidence_contracts.md")
          doc_text = docs.read_text(encoding="utf-8")
          before = '''Deadline matches supersede the calendar-date match embedded inside the same
          marked deadline. Any other accepted overlap fails closed rather than multiplying
          one occurrence into several evidence records. Output order and parser revision
          identity are deterministic and independent of caller currency-code ordering.
          '''
          after = '''Deadline matches supersede the calendar-date match embedded inside the same
          marked deadline. Any other accepted overlap fails closed rather than multiplying
          one occurrence into several evidence records. Validation is whole-source rather
          than per-span: any date-shaped candidate that is not a real Gregorian date, or
          any labeled customer/account identifier that is empty, malformed, or oversized,
          rejects the complete parse. Output order and parser revision identity are
          deterministic and independent of caller currency-code ordering.
          '''
          before = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in before.splitlines()
          )
          after = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in after.splitlines()
          )
          if doc_text.count(before) != 1:
              raise SystemExit("whole-source documentation block not found")
          docs.write_text(doc_text.replace(before, after, 1), encoding="utf-8")

          fragment = Path("docs/changelog.d/enterprise-explicit-value-parser.md")
          fragment_text = fragment.read_text(encoding="utf-8")
          anchor = '''- Added immutable content-addressed records that compile exact occurrences into
            the existing directly stated `EvidenceSpanRecord` boundary without adding a
            parallel scoring, observation, result, or engine schema.
          '''
          replacement = anchor + '''- Aligned explicit-value offset bounds with the shared enterprise evidence
            contract and documented whole-source rejection for invalid dates or malformed
            labeled identifiers.
          '''
          anchor = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in anchor.splitlines()
          )
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.splitlines()
          )
          if fragment_text.count(anchor) != 1:
              raise SystemExit("changelog fragment insertion point not found")
          fragment.write_text(
              fragment_text.replace(anchor, replacement, 1),
              encoding="utf-8",
          )
          PY
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          python -m py_compile \
            python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py \
            tests/test_scoring_enterprise_explicit_values.py

      - name: Install focused validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install "ruff==0.16.1"
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Validate review fixes
        shell: bash
        run: |
          set -euo pipefail
          ruff format --check \
            python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py \
            tests/test_scoring_enterprise_explicit_values.py
          ruff check \
            python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py \
            tests/test_scoring_enterprise_explicit_values.py
          pytest \
            tests/test_scoring_enterprise_explicit_values.py \
            tests/test_scoring_enterprise_explicit_values_provider_boundary.py \
            --cov=fast_mlsirm.scoring.enterprise_issue.explicit_values \
            --cov-branch \
            --cov-fail-under=100
          python scripts/render_changelog_fragments.py --check CHANGELOG.md

      - name: Commit verified fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr-533-review-fixes.yml
          git add \
            CHANGELOG.md \
            docs/changelog.d/enterprise-explicit-value-parser.md \
            docs/enterprise_issue_evidence_contracts.md \
            python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py \
            tests/test_scoring_enterprise_explicit_values.py
          git diff --cached --check
          git commit -m "fix(review): align parser contracts and tests"
          git push origin HEAD:feat/enterprise-explicit-value-parser
