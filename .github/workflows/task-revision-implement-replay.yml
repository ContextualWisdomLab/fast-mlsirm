name: Task Revision Identity Replay

on:
  push:
    branches:
      - feat/task-revision-calibration-identity

permissions:
  contents: write

concurrency:
  group: task-revision-identity-replay
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/task-revision-calibration-identity
          fetch-depth: 0

      - name: Replay reviewed implementation script
        shell: bash
        run: |
          git show 8c39e2db29a50f7c91e80b2975a0345c757b9ab5:.github/workflows/task-revision-implement.yml > /tmp/task-revision-implement.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/task-revision-implement.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          python3 -m compileall"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          bad_tail = "\npython_files = ["
          if bad_tail in script:
              script = script[: script.index(bad_tail)] + "\n"
          exec(compile(script, '<task-revision-implementation>', 'exec'), {'__name__': '__main__'})
          PY
          python3 -m compileall -q python/fast_mlsirm/scoring tests
          git diff --check

      - name: Commit implementation and remove replay workflow
        shell: bash
        run: |
          git rm .github/workflows/task-revision-implement-replay.yml
          git add python tests docs
          if git diff --cached --quiet; then
            echo "No implementation changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(scoring): bind calibration to exact task revisions"
          git push origin HEAD:feat/task-revision-calibration-identity
