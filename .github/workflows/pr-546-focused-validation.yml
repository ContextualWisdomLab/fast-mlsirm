name: PR 546 focused validation

on:
  push:
    branches:
      - feat/enterprise-facets-calibration-reports

permissions:
  contents: read

concurrency:
  group: pr-546-focused-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enterprise-facets-calibration-reports
          fetch-depth: 0

      - name: Render authoritative changelog
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          python -m py_compile \
            python/fast_mlsirm/scoring/enterprise_issue/reporting.py \
            tests/test_scoring_enterprise_issue_calibration_reporting.py
          git diff --check

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/focused-requirements.txt" <<'EOF'
          coverage==7.15.3 \
              --hash=sha256:63a4ff67364afb2cac826b8bbd78a5c50ce656a7b7137436b44d7b96a9271088
          ruff==0.16.1 \
              --hash=sha256:39897739f112253ee4fdd2e8aa9a4f9ded99fb2be367d5f31dfa4ded6025584c
          EOF
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r "${RUNNER_TEMP}/focused-requirements.txt"
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run focused statement and branch evidence
        shell: bash
        run: |
          set -euo pipefail
          ruff check --fix \
            python/fast_mlsirm/scoring/enterprise_issue/__init__.py \
            python/fast_mlsirm/scoring/enterprise_issue/reporting.py \
            tests/test_scoring_enterprise_issue_calibration_reporting.py
          ruff format \
            python/fast_mlsirm/scoring/enterprise_issue/__init__.py \
            python/fast_mlsirm/scoring/enterprise_issue/reporting.py \
            tests/test_scoring_enterprise_issue_calibration_reporting.py
          ruff format --check \
            python/fast_mlsirm/scoring/enterprise_issue/__init__.py \
            python/fast_mlsirm/scoring/enterprise_issue/reporting.py \
            tests/test_scoring_enterprise_issue_calibration_reporting.py
          ruff check \
            python/fast_mlsirm/scoring/enterprise_issue/__init__.py \
            python/fast_mlsirm/scoring/enterprise_issue/reporting.py \
            tests/test_scoring_enterprise_issue_calibration_reporting.py
          pytest -q \
            tests/test_scoring_enterprise_issue_calibration.py \
            tests/test_scoring_enterprise_issue_calibration_nested.py \
            tests/test_scoring_enterprise_issue_calibration_bundle.py \
            tests/test_scoring_enterprise_issue_calibration_reporting.py
          python -m coverage erase
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m coverage run \
            --branch \
            --source=fast_mlsirm.scoring.enterprise_issue.reporting \
            -m pytest -q \
            tests/test_scoring_enterprise_issue_calibration_reporting.py
          python -m coverage report \
            --include='*/enterprise_issue/reporting.py' \
            --fail-under=100
          python scripts/check_docstring_coverage.py
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          git diff --check

      - name: Commit verified product changes and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/pr-546-focused-validation.yml \
            .github/pr-546-focused-validation-trigger.txt
          git add \
            CHANGELOG.md \
            docs/changelog.d/enterprise-issue-facets-calibration-reports.md \
            docs/doctoring/enterprise-issue-facets-calibration-reports.md \
            docs/enterprise_issue_facets_calibration_reports.md \
            docs/superpowers/plans/2026-08-05-enterprise-facets-calibration-reports.md \
            docs/superpowers/specs/2026-08-05-enterprise-facets-calibration-reports-design.md \
            python/fast_mlsirm/scoring/enterprise_issue/__init__.py \
            python/fast_mlsirm/scoring/enterprise_issue/reporting.py \
            tests/test_scoring_enterprise_issue_calibration_reporting.py
          git diff --cached --check
          git commit -m "feat(enterprise): fit governed calibration reports"
          git push origin HEAD:feat/enterprise-facets-calibration-reports
