name: Apply reviewed CDM source correction

on:
  push:
    branches: [feat/rust-true-parameter-recovery-389]
    paths: [.github/workflows/apply-reviewed-cdm-source.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/rust-true-parameter-recovery-389
          fetch-depth: 0
      - name: Apply reviewed statistical correction to tracked source
        run: |
          python - <<'PY'
          from scripts.run_ignored_rust_shard import apply_statistical_contract_overlay
          apply_statistical_contract_overlay()
          PY
      - name: Commit the tracked Rust test correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/cdm_tests.rs
          git diff --cached --quiet && exit 0
          git commit -m "test: calibrate higher-order recovery threshold to Monte Carlo error"
          git push origin HEAD:feat/rust-true-parameter-recovery-389
