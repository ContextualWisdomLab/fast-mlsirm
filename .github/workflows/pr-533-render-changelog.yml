name: PR 533 render changelog

on:
  push:
    branches:
      - feat/enterprise-explicit-value-parser

permissions:
  contents: write

concurrency:
  group: pr-533-render-changelog
  cancel-in-progress: true

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enterprise-explicit-value-parser
          fetch-depth: 0

      - name: Render and verify authoritative changelog
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          git diff --check

      - name: Commit rendered changelog and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git rm .github/workflows/pr-533-render-changelog.yml
          git diff --cached --check
          git commit -m "docs(changelog): render explicit-value parser fragment"
          git push origin HEAD:feat/enterprise-explicit-value-parser
