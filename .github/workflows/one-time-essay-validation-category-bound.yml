# This workflow removes itself after enforcing pre-delegation category bounds.
name: One-time essay validation category bound

on:
  push:
    branches:
      - feat/essay-validation-evidence-report
    paths:
      - .github/workflows/one-time-essay-validation-category-bound.yml

permissions: {}

concurrency:
  group: one-time-essay-validation-category-bound-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enforce-category-bound:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/essay-validation-evidence-report
          fetch-depth: 0
      - name: Enforce category bound before Rust delegation
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("python/fast_mlsirm/scoring/essay/validation_reporting.py")
          source = source_path.read_text(encoding="utf-8")
          old_source = "    if type(category_count) is not int:\n"
          new_source = (
              "    if type(category_count) is not int or not 2 <= category_count <= 1_000:\n"
          )
          if new_source not in source:
              if source.count(old_source) != 1:
                  raise RuntimeError("expected exactly one category-count factory guard")
              source = source.replace(old_source, new_source)
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_scoring_essay_validation_reporting.py")
          tests = test_path.read_text(encoding="utf-8")
          old_cases = '''        ("category_count", True, "invalid_essay_validation_category_count"),
              ),
          '''
          new_cases = '''        ("category_count", True, "invalid_essay_validation_category_count"),
                  ("category_count", 1, "invalid_essay_validation_category_count"),
                  ("category_count", 1_001, "invalid_essay_validation_category_count"),
              ),
          '''
          if new_cases not in tests:
              if tests.count(old_cases) != 1:
                  raise RuntimeError("expected exactly one category-count parameter anchor")
              tests = tests.replace(old_cases, new_cases)
          test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Run focused validation
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
          pytest tests/test_scoring_essay_validation_reporting.py tests/test_scoring_essay_contracts.py
      - name: Commit hardening and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-essay-validation-category-bound.yml
          git add python/fast_mlsirm/scoring/essay/validation_reporting.py tests/test_scoring_essay_validation_reporting.py
          git commit -m "fix(essay): bound validation categories before delegation"
          git push origin "HEAD:feat/essay-validation-evidence-report"
