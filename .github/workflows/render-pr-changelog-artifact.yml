name: Render PR Changelog Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - feat/scoring-assessment-contracts
    paths:
      - CHANGELOG.md
      - docs/changelog.d/**
      - scripts/render_changelog_fragments.py
      - .github/workflows/render-pr-changelog-artifact.yml

permissions:
  contents: read

concurrency:
  group: render-pr-changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Render authoritative fragments into a review artifact
        run: |
          cp CHANGELOG.md rendered-CHANGELOG.md
          python scripts/render_changelog_fragments.py --update rendered-CHANGELOG.md
          python scripts/render_changelog_fragments.py --check rendered-CHANGELOG.md
      - name: Upload rendered changelog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rendered-pr-changelog
          path: rendered-CHANGELOG.md
          if-no-files-found: error
          retention-days: 1
