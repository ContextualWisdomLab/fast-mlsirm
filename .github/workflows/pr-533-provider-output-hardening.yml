name: PR 533 provider output hardening

on:
  push:
    branches:
      - feat/enterprise-explicit-value-parser

permissions:
  contents: read

jobs:
  harden:
    if: github.repository == 'ContextualWisdomLab/fast-mlsirm'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enterprise-explicit-value-parser
          fetch-depth: 0

      - name: Validate provider output at the stable boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          implementation = Path("python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py")
          text = implementation.read_text(encoding="utf-8")
          before = '''def parse_enterprise_explicit_values(
              source_record: EnterpriseSourceRecord,
              source_text: str,
              *,
              parser: EnterpriseExplicitValueParser | None = None,
          ) -> tuple[ExplicitValueRecord, ...]:
              """Parse verified text through the provider-neutral parser boundary."""
              resolved = DeterministicExplicitValueParser() if parser is None else parser
              if not isinstance(resolved, EnterpriseExplicitValueParser):
                  raise assessment_error(
                      "invalid_explicit_value_parser",
                      "$.parser",
                      "parser must implement EnterpriseExplicitValueParser",
                  )
              return resolved.parse(source_record, source_text)
          '''
          after = '''def _validated_parser_output(
              source_record: EnterpriseSourceRecord,
              source_text: str,
              values: Any,
          ) -> tuple[ExplicitValueRecord, ...]:
              """Return exact, ordered, non-overlapping records from one provider."""
              if type(values) is not tuple:
                  raise assessment_error(
                      "invalid_explicit_value_parser_output",
                      "$.parser_output",
                      "parser output must be a tuple of ExplicitValueRecord values",
                  )
              if len(values) > MAX_EXPLICIT_VALUE_RECORDS:
                  raise assessment_error(
                      "explicit_value_record_limit",
                      "$.parser_output",
                      "parser output exceeds the bounded explicit-value record limit",
                  )
              previous_key: tuple[int, int, str, str] | None = None
              previous_end = 0
              for index, item in enumerate(values):
                  path = f"$.parser_output[{index}]"
                  if not isinstance(item, ExplicitValueRecord):
                      raise assessment_error(
                          "invalid_explicit_value_parser_output",
                          path,
                          "parser output must contain only ExplicitValueRecord values",
                      )
                  if item.source_id != source_record.source_id:
                      raise assessment_error(
                          "parser_output_source_mismatch",
                          path,
                          "parser output source_id does not match source_record",
                      )
                  if (
                      item.source_record_fingerprint
                      != source_record.source_record_fingerprint
                  ):
                      raise assessment_error(
                          "parser_output_source_mismatch",
                          path,
                          "parser output source fingerprint does not match source_record",
                      )
                  if item.end_offset > len(source_text):
                      raise assessment_error(
                          "parser_output_span_out_of_bounds",
                          path,
                          "parser output span exceeds verified source text",
                      )
                  expected_span = hashlib.sha256(
                      source_text[item.start_offset : item.end_offset].encode("utf-8")
                  ).hexdigest()
                  if item.span_content_fingerprint != expected_span:
                      raise assessment_error(
                          "parser_output_span_mismatch",
                          path,
                          "parser output span fingerprint does not match verified source text",
                      )
                  key = (
                      item.start_offset,
                      item.end_offset,
                      item.value_kind.value,
                      item.explicit_value_fingerprint,
                  )
                  if previous_key is not None and key < previous_key:
                      raise assessment_error(
                          "parser_output_order_mismatch",
                          path,
                          "parser output must use canonical deterministic ordering",
                      )
                  if previous_key is not None and item.start_offset < previous_end:
                      raise assessment_error(
                          "overlapping_explicit_values",
                          path,
                          "parser output records must not overlap",
                      )
                  previous_key = key
                  previous_end = item.end_offset
              return values


          def parse_enterprise_explicit_values(
              source_record: EnterpriseSourceRecord,
              source_text: str,
              *,
              parser: EnterpriseExplicitValueParser | None = None,
          ) -> tuple[ExplicitValueRecord, ...]:
              """Parse verified text through the provider-neutral parser boundary."""
              resolved = DeterministicExplicitValueParser() if parser is None else parser
              if not isinstance(resolved, EnterpriseExplicitValueParser):
                  raise assessment_error(
                      "invalid_explicit_value_parser",
                      "$.parser",
                      "parser must implement EnterpriseExplicitValueParser",
                  )
              DeterministicExplicitValueParser._validate_source(source_record, source_text)
              return _validated_parser_output(
                  source_record,
                  source_text,
                  resolved.parse(source_record, source_text),
              )
          '''
          if before not in text:
              raise SystemExit("stable parser boundary insertion point not found")
          implementation.write_text(text.replace(before, after, 1), encoding="utf-8")

          tests = Path("tests/test_scoring_enterprise_explicit_values.py")
          test_text = tests.read_text(encoding="utf-8")
          test_text = test_text.replace(
              "from dataclasses import FrozenInstanceError\n",
              "from dataclasses import FrozenInstanceError, replace\n",
              1,
          )
          addition = r'''

          def test_provider_output_is_revalidated_against_verified_source() -> None:
              """Custom providers cannot return stale, forged, unordered, or broad output."""
              text = "event 2026-09-30 then 2026-10-01"
              source = _source(text)
              records = DeterministicExplicitValueParser().parse(source, text)

              class StaticParser:
                  """Return one configured object through the provider protocol."""

                  def __init__(self, output: Any) -> None:
                      """Store output for one deterministic boundary invocation."""
                      self.output = output

                  def parse(
                      self,
                      source_record: EnterpriseSourceRecord,
                      source_text: str,
                  ) -> Any:
                      """Return configured output after observing exact inputs."""
                      assert source_record is source
                      assert source_text == text
                      return self.output

              assert parse_enterprise_explicit_values(
                  source, text, parser=StaticParser(records)
              ) == records

              invalid_outputs = (
                  (list(records), "invalid_explicit_value_parser_output"),
                  ((object(),), "invalid_explicit_value_parser_output"),
                  (
                      (replace(records[0], source_id="other_source"),),
                      "parser_output_source_mismatch",
                  ),
                  (
                      (replace(records[0], source_record_fingerprint=FP_A),),
                      "parser_output_source_mismatch",
                  ),
                  (
                      (
                          replace(
                              records[0],
                              end_offset=len(text) + 1,
                              span_content_fingerprint=FP_B,
                          ),
                      ),
                      "parser_output_span_out_of_bounds",
                  ),
                  (
                      (replace(records[0], span_content_fingerprint=FP_B),),
                      "parser_output_span_mismatch",
                  ),
                  (tuple(reversed(records)), "parser_output_order_mismatch"),
              )
              for output, error in invalid_outputs:
                  with pytest.raises(AssessmentSpecError, match=error):
                      parse_enterprise_explicit_values(
                          source, text, parser=StaticParser(output)
                      )

              overlap_start = records[0].start_offset + 1
              overlap_end = records[0].end_offset
              overlap = replace(
                  records[1],
                  start_offset=overlap_start,
                  end_offset=overlap_end,
                  span_content_fingerprint=hashlib.sha256(
                      text[overlap_start:overlap_end].encode("utf-8")
                  ).hexdigest(),
              )
              with pytest.raises(AssessmentSpecError, match="overlapping_explicit_values"):
                  parse_enterprise_explicit_values(
                      source, text, parser=StaticParser((records[0], overlap))
                  )

              with pytest.raises(AssessmentSpecError, match="explicit_value_record_limit"):
                  parse_enterprise_explicit_values(
                      source,
                      text,
                      parser=StaticParser((records[0],) * 129),
                  )


          def test_custom_provider_cannot_bypass_source_replay_validation() -> None:
              """The stable boundary validates source replay before invoking a provider."""
              text = "event 2026-09-30"
              source = _source(text, fingerprint_text="different")

              class NeverParser:
                  """Protocol parser that must not observe an invalid source replay."""

                  def parse(
                      self,
                      source_record: EnterpriseSourceRecord,
                      source_text: str,
                  ) -> tuple[ExplicitValueRecord, ...]:
                      """Fail if source validation does not precede provider execution."""
                      raise AssertionError("provider must not run")

              with pytest.raises(
                  AssessmentSpecError, match="source_content_fingerprint_mismatch"
              ):
                  parse_enterprise_explicit_values(
                      source,
                      text,
                      parser=NeverParser(),
                  )
          '''
          addition = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in addition.splitlines()
          )
          if "def test_provider_output_is_revalidated_against_verified_source" in test_text:
              raise SystemExit("provider output tests already exist")
          tests.write_text(test_text.rstrip() + addition + "\n", encoding="utf-8")
          PY

      - name: Commit hardening and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr-533-provider-output-hardening.yml
          git add python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py tests/test_scoring_enterprise_explicit_values.py
          git diff --cached --check
          git commit -m "fix(enterprise): validate explicit parser output"
          git push origin HEAD:feat/enterprise-explicit-value-parser
