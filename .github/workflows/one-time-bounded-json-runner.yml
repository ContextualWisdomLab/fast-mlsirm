name: One-time exact-head review follow-up runner

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/one-time-bounded-json-runner.yml

permissions: {}

concurrency:
  group: one-time-review-followup-runner-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'sentinel-json-dos-scripts-17708564860587448239'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sentinel-json-dos-scripts-17708564860587448239
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply reviewed fixes and focused validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          script_path = Path("scripts/build_figma_evidence_sync.py")
          script_text = script_path.read_text(encoding="utf-8")
          old_main = '''\
              print(
                  json.dumps(
                      {
                          "status": manifest["status"],
                          "out": str(Path(args.out).resolve()),
                          "manifest": str(
                              Path(args.out).resolve() / "figma_evidence_sync_manifest.json"
                          ),
                          "html": manifest["html_report_file"],
                          "failed_checks": len(manifest["failed_checks"]),
                      },
                      indent=2,
                      sort_keys=True,
                  )
              )
          '''
          new_main = '''\
              repo_root = Path(args.repo_root).resolve()
              out_dir = _resolve_path(args.out, base=repo_root).resolve()
              print(
                  json.dumps(
                      {
                          "status": manifest["status"],
                          "out": str(out_dir),
                          "manifest": str(
                              out_dir / "figma_evidence_sync_manifest.json"
                          ),
                          "html": manifest["html_report_file"],
                          "failed_checks": len(manifest["failed_checks"]),
                      },
                      indent=2,
                      sort_keys=True,
                  )
              )
          '''
          if script_text.count(old_main) != 1:
              raise RuntimeError("Figma CLI output anchor was not found exactly once")
          script_path.write_text(script_text.replace(old_main, new_main), encoding="utf-8")

          bounded_test_path = Path("tests/test_bounded_json_scripts.py")
          bounded_test_text = bounded_test_path.read_text(encoding="utf-8")
          old_fixture = '''\
                      "text": "[{}] \\ slash",
                      "nested": {"items": ["한글"]},
          '''
          new_fixture = '''\
                      "text": "[{}] \\ slash",
                      "escaped_quote": 'quote: " and delimiters: {[]}',
                      "nested": {"items": ["한글"]},
          '''
          if bounded_test_text.count(old_fixture) != 1:
              raise RuntimeError("bounded JSON escaped-string fixture was not found exactly once")
          bounded_test_path.write_text(
              bounded_test_text.replace(old_fixture, new_fixture),
              encoding="utf-8",
          )

          figma_test_path = Path("tests/test_figma_evidence_sync.py")
          figma_test_text = figma_test_path.read_text(encoding="utf-8")
          test_name = "test_main_reports_repo_root_relative_output"
          if test_name in figma_test_text:
              raise RuntimeError("Figma CLI regression test already exists")
          figma_test_text += '''\


def test_main_reports_repo_root_relative_output(tmp_path, monkeypatch, capsys):
    module = _load_sync()
    repo_root = tmp_path / "repo"
    _write_packet(repo_root / "packet.json")
    working_directory = tmp_path / "working-directory"
    working_directory.mkdir()
    monkeypatch.chdir(working_directory)

    exit_code = module.main(
        [
            "--repo-root",
            str(repo_root),
            "--packet",
            "packet.json",
            "--out",
            "relative-output",
        ]
    )

    output = json.loads(capsys.readouterr().out)
    expected_out = (repo_root / "relative-output").resolve()
    manifest_path = Path(output["manifest"])
    assert exit_code == 0
    assert output["out"] == str(expected_out)
    assert manifest_path == expected_out / "figma_evidence_sync_manifest.json"
    assert manifest_path.exists()
          '''
          figma_test_path.write_text(figma_test_text, encoding="utf-8")
          PY
          rm .github/workflows/one-time-bounded-json-runner.yml
          rm .github/workflows/one-time-review-followup.yml
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pytest tests/test_figma_evidence_sync.py tests/test_bounded_json_scripts.py
          git diff --check
      - name: Commit exact reviewed fixes
        run: |
          git add -A
          git commit -m "fix(review): preserve Figma output base and JSON escape coverage"
          git fetch origin sentinel-json-dos-scripts-17708564860587448239
          git rebase origin/sentinel-json-dos-scripts-17708564860587448239
          git push origin "HEAD:sentinel-json-dos-scripts-17708564860587448239"
