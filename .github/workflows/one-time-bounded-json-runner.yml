name: One-time bounded JSON runner

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/one-time-bounded-json-runner.yml

permissions: {}

concurrency:
  group: one-time-bounded-json-runner-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'sentinel-json-dos-scripts-17708564860587448239'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sentinel-json-dos-scripts-17708564860587448239
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Bring branch current and apply hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python scripts/_apply_bounded_json_hardening.py
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install "pytest-cov==7.1.0"
          python -m pip install --no-deps --no-build-isolation -e .
          pytest tests/test_bounded_json_scripts.py tests/test_changelog_fragment_contract.py \
            --cov=scripts._bounded_json --cov-branch --cov-report=term-missing --cov-fail-under=100
          pytest \
            tests/test_benchmark_report.py \
            tests/test_buyer_packet.py \
            tests/test_commercial_release.py \
            tests/test_figma_evidence_sync.py \
            tests/test_pr_queue_governance.py \
            tests/test_procurement_due_diligence.py \
            tests/test_release_evidence_index.py \
            tests/test_sales_readiness.py
          rm scripts/_apply_bounded_json_hardening.py
          rm .github/workflows/one-time-bounded-json-hardening.yml
          rm .github/workflows/one-time-bounded-json-runner.yml
          git diff --check
      - name: Commit exact hardening
        run: |
          git add -A
          git commit -m "fix(security): bound JSON size and nesting depth"
          git push origin "HEAD:sentinel-json-dos-scripts-17708564860587448239"
