name: PR 498 Finalizer

on:
  push:
    branches:
      - feat/scoring-facets-handoff

permissions:
  contents: write

concurrency:
  group: pr-498-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/scoring-facets-handoff
          fetch-depth: 0

      - name: Apply reviewed deterministic corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              if content.count(old) != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one reviewed replacement target"
                  )
              target.write_text(content.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "python/fast_mlsirm/scoring/calibration.py",
              '''        if previous_response is not None and previous_response != response_contract:\n            identity_changed = previous_response[:2] != response_contract[:2]\n            conflict_field = (\n                "response_id" if identity_changed else "response_content_fingerprint"\n            )\n''',
              '''        if previous_response is not None and previous_response != response_contract:\n            if previous_response[0] != response_contract[0]:\n                conflict_field = "respondent_id"\n            elif previous_response[1] != response_contract[1]:\n                conflict_field = "task_id"\n            else:\n                conflict_field = "response_content_fingerprint"\n''',
          )
          replace_once(
              "tests/test_scoring_facets_calibration.py",
              '''                        claim_score=claim_score,\n                        source_score=(2 - base_score + engine_index) % 3,\n                        claim_status=claim_status,\n''',
              '''                        claim_score=claim_score,\n                        source_score=(2 - base_score + 2 * engine_index) % 3,\n                        claim_status=claim_status,\n''',
          )
          replace_once(
              "tests/test_scoring_facets_respondent_indexing.py",
              '''    assert caught.value.code == "respondent_task_response_conflict"\n    assert caught.value.path.endswith(".response_content_fingerprint")\n''',
              '''    assert caught.value.code == "response_provenance_conflict"\n    assert caught.value.path.endswith(".response_content_fingerprint")\n''',
          )

          fit_replay = Path("tests/test_scoring_facets_fit_replay.py")
          fit_replay_text = fit_replay.read_text(encoding="utf-8")
          duplicate_marker = (
              "\n\ndef test_bundle_fit_forwards_tuning_values_with_fresh_tensors"
          )
          if fit_replay_text.count(duplicate_marker) != 1:
              raise SystemExit(
                  "tests/test_scoring_facets_fit_replay.py: duplicate review test target changed"
              )
          fit_replay.write_text(
              fit_replay_text.split(duplicate_marker, 1)[0].rstrip() + "\n",
              encoding="utf-8",
          )
          PY

          python3 scripts/render_changelog_fragments.py --update CHANGELOG.md
          python3 scripts/render_changelog_fragments.py --check CHANGELOG.md

      - name: Commit the finalized reviewed branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No finalization changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md \
            python/fast_mlsirm/scoring/calibration.py \
            tests/test_scoring_facets_calibration.py \
            tests/test_scoring_facets_fit_replay.py \
            tests/test_scoring_facets_respondent_indexing.py
          git commit -m "fix(scoring): finalize governed facets handoff"
          git push origin HEAD:feat/scoring-facets-handoff
