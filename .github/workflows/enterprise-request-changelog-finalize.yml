name: Final enterprise request changelog render

on:
  push:
    branches:
      - feat/enterprise-issue-scoring-request
    paths:
      - .github/workflows/enterprise-request-changelog-finalize.yml

permissions:
  contents: write

concurrency:
  group: enterprise-request-changelog-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: >-
      github.ref == 'refs/heads/feat/enterprise-issue-scoring-request' &&
      !contains(github.event.head_commit.message, 'finalize enterprise request changelog')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enterprise-issue-scoring-request
          fetch-depth: 0
      - name: Render exact current fragments
        run: |
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          rm .github/workflows/enterprise-request-changelog-finalize.yml
          git diff --check
      - name: Commit exact rendered changelog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .github/workflows/enterprise-request-changelog-finalize.yml
          git commit -m 'docs(changelog): finalize enterprise request changelog'
          git fetch origin feat/enterprise-issue-scoring-request
          git rebase origin/feat/enterprise-issue-scoring-request
          git push origin HEAD:feat/enterprise-issue-scoring-request
