name: PR 533 one-shot autofix

on:
  push:
    branches:
      - feat/enterprise-explicit-value-parser

permissions:
  contents: write

concurrency:
  group: pr-533-one-shot-autofix
  cancel-in-progress: false

jobs:
  fix:
    if: github.repository == 'ContextualWisdomLab/fast-mlsirm'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enterprise-explicit-value-parser
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply structured validation and render changelog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py")
          text = path.read_text(encoding="utf-8")
          before = '''def _decimal_amount(value: str, path: str) -> str:
              """Return exact finite nonnegative decimal text without float conversion."""
              try:
                  amount = Decimal(value.replace(",", ""))
          '''
          after = '''def _decimal_amount(value: str, path: str) -> str:
              """Return exact finite nonnegative decimal text without float conversion."""
              if type(value) is not str:
                  raise assessment_error(
                      "invalid_decimal_amount",
                      path,
                      "decimal amount must use the accepted nonnegative decimal grammar",
                  )
              try:
                  amount = Decimal(value.replace(",", ""))
          '''
          if before not in text:
              raise SystemExit("expected _decimal_amount implementation was not found")
          path.write_text(text.replace(before, after, 1), encoding="utf-8")
          PY
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md

      - name: Install focused test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify focused regressions
        shell: bash
        run: |
          set -euo pipefail
          pytest tests/test_scoring_enterprise_explicit_values.py tests/test_changelog_fragment_contract.py

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr-533-autofix.yml
          git add CHANGELOG.md python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py
          git diff --cached --check
          git commit -m "fix(enterprise): close parser validation gaps"
          git push origin HEAD:feat/enterprise-explicit-value-parser
