name: Development Marginal Source Snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/dev-marginal-source-snapshot.yml"
  workflow_dispatch:

concurrency:
  group: dev-marginal-source-snapshot-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.14.1
        with:
          egress-policy: audit

      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact head and clean source
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --short)"

      - name: Upload exact source tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-mlsirm-marginal-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
