name: PR 537 focused semantic validation

on:
  push:
    branches:
      - feat/enterprise-semantic-issue-proposals

permissions:
  contents: write

concurrency:
  group: pr-537-focused-semantic-validation
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enterprise-semantic-issue-proposals
          fetch-depth: 0

      - name: Apply deterministic focused corrections
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pr537_semantic_fixes.py
          python - <<'PY'
          from pathlib import Path

          guide = Path("docs/enterprise_issue_evidence_contracts.md")
          text = guide.read_text(encoding="utf-8")
          marker = "## Evidence-grounded semantic issue proposals"
          if marker not in text:
              section = '''

## Evidence-grounded semantic issue proposals

`EnterpriseSemanticIssueProvider` is the provider-neutral trust boundary for
semantic issue candidates over authorized enterprise text. Before any provider
callback, `extract_enterprise_semantic_issues()` replays every exact
`EnterpriseSourceRecord` by matching the Python Unicode-code-point character
count and SHA-256 over the transient source text's UTF-8 bytes. The source text
mapping must contain exactly the declared source identifiers. A replay failure
rejects the complete batch before provider execution.

Providers return bounded primitive proposal and assertion mappings rather than
package-owned records. The package derives the issue-content fingerprint from a
transient issue statement, verifies every source ID and code-point span, hashes
the exact UTF-8 span bytes, and reconstructs only the existing
`EvidenceSpanRecord`, `CounterevidenceRecord`, `StakeholderPerspective`, and
`AtomicIssueRecord` contracts. Provider order, source order, assertion order, and
mapping insertion order do not determine public output order.

Epistemic roles remain separate. Direct facts, supported inferences, and
unresolved ambiguities become issue evidence spans. Counterevidence remains a
`CounterevidenceRecord`. Stakeholder value judgments become separate
`StakeholderPerspective` values and cannot create an atomic issue without
factual, inferential, ambiguity, or counterevidence support. Compilation proves
only source, span, schema, and provenance consistency; it does not establish
semantic truth, materiality, construct validity, fairness, causal effect,
expected utility, recommendation quality, or deployment readiness.

Raw source text and transient issue statements are never serialized. Semantic
metadata rejects source-text, prompt, authorization, credential, token,
password, API-key, and secret-like keys. Non-domain provider exceptions are
redacted, malformed or excessive collections fail closed, duplicate or
unresolved overlapping spans are rejected, and source content is always treated
as data rather than executable instructions. The core executes no model, tool,
network, shell, filesystem, ranking, scoring, calibration, or queue action.

`OfflineSemanticIssueFixtureProvider` supplies a deterministic disconnected
adapter for testing and standalone use. Live model adapters may wrap the runtime
protocol in a service layer; they must still pass the same canonical validator
and must not alter the independent review-agent credential boundary.
'''
              anchor = "\n## Replay and provenance\n"
              if anchor not in text:
                  raise SystemExit("enterprise evidence guide anchor is missing")
              text = text.replace(anchor, section + anchor, 1)
              guide.write_text(text, encoding="utf-8")
          PY
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          python -m py_compile \
            python/fast_mlsirm/scoring/enterprise_issue/semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_provider_boundary.py

      - name: Build isolated validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install "ruff==0.16.1" "coverage==7.15.3"
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run focused verification
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          ruff check --fix \
            python/fast_mlsirm/scoring/enterprise_issue/semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_provider_boundary.py \
            scripts/pr537_semantic_fixes.py
          ruff format \
            python/fast_mlsirm/scoring/enterprise_issue/semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_provider_boundary.py \
            scripts/pr537_semantic_fixes.py
          ruff format --check \
            python/fast_mlsirm/scoring/enterprise_issue/semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_provider_boundary.py \
            scripts/pr537_semantic_fixes.py
          ruff check \
            python/fast_mlsirm/scoring/enterprise_issue/semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_provider_boundary.py \
            scripts/pr537_semantic_fixes.py
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q \
            tests/test_scoring_enterprise_semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_provider_boundary.py
          python -m coverage erase
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m coverage run \
            --branch \
            --source=python/fast_mlsirm/scoring/enterprise_issue/semantic_proposals.py \
            -m pytest -q \
            tests/test_scoring_enterprise_semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_provider_boundary.py
          python -m coverage report \
            --include='*/semantic_proposals.py' \
            --fail-under=100
          python scripts/check_docstring_coverage.py
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          git diff --check

      - name: Commit verified product changes and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/pr-537-focused-fixes.yml \
            scripts/pr537_semantic_fixes.py
          git add \
            CHANGELOG.md \
            docs/changelog.d/enterprise-semantic-issue-proposals.md \
            docs/doctoring/enterprise-semantic-issue-proposals.md \
            docs/enterprise_issue_evidence_contracts.md \
            docs/superpowers/plans/2026-08-05-enterprise-semantic-issue-proposals.md \
            docs/superpowers/specs/2026-08-05-enterprise-semantic-issue-proposals-design.md \
            python/fast_mlsirm/scoring/enterprise_issue/__init__.py \
            python/fast_mlsirm/scoring/enterprise_issue/semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_provider_boundary.py
          git diff --cached --check
          git commit -m "feat(enterprise): validate semantic issue proposals"
          git push origin HEAD:feat/enterprise-semantic-issue-proposals
