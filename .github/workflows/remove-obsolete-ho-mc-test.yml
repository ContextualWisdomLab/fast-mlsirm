name: Remove obsolete higher-order Monte Carlo gate

on:
  push:
    branches: [feat/rust-true-parameter-recovery-389]
    paths: [.github/workflows/remove-obsolete-ho-mc-test.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/rust-true-parameter-recovery-389
          fetch-depth: 0
      - name: Remove the superseded exact-rate test and skip exception
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/unit/cdm_tests.rs")
          text = test_path.read_text(encoding="utf-8")
          start_marker = (
              "/// Literature-grade Monte-Carlo (>=500 reps): higher-order DINA parameter recovery\n"
          )
          end_marker = "\n// ----- Higher-order G-DINA"
          if text.count(start_marker) != 1:
              raise SystemExit("expected exactly one historical higher-order Monte Carlo test")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end + 1 :]
          test_path.write_text(text, encoding="utf-8")

          ci_path = Path(".github/workflows/ci.yml")
          ci = ci_path.read_text(encoding="utf-8")
          skip_line = "          --skip mc_ho_recovery_500\n"
          if ci.count(skip_line) != 1:
              raise SystemExit("expected exactly one obsolete-test skip line")
          ci = ci.replace(skip_line, "", 1)
          ci = ci.replace(
              "    # CPU/GPU sentinels run in their own jobs. The obsolete mc_ho_recovery_500\n"
              "    # exact-threshold gate is replaced by the integration-test contract\n",
              "    # CPU/GPU sentinels run in their own jobs. The superseded exact-rate\n"
              "    # study was removed after its design was migrated to the integration-test contract\n",
              1,
          )
          ci_path.write_text(ci, encoding="utf-8")

          doc_path = Path("docs/papers/higher-order-dina-monte-carlo-contract.md")
          doc = doc_path.read_text(encoding="utf-8")
          old = (
              "The old exact-threshold test is explicitly excluded from the shard command so\n"
              "CI does not run two conflicting acceptance rules over the same deterministic\n"
              "experiment. The replacement is not a failure-accepting compatibility shim: it\n"
              "executes the model fit and all recovery assertions directly through the public\n"
              "Rust core.\n"
          )
          new = (
              "The superseded exact-threshold test was removed after the replacement was added,\n"
              "so the ignored-test inventory has no exception for this study and no duplicate\n"
              "conflicting acceptance rule. The replacement executes the model fit and every\n"
              "recovery assertion directly through the public Rust core.\n"
          )
          if old not in doc:
              raise SystemExit("expected historical-test documentation paragraph")
          doc_path.write_text(doc.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit the reviewed source change and remove this one-shot workflow
        run: |
          rm .github/workflows/remove-obsolete-ho-mc-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/cdm_tests.rs .github/workflows/ci.yml \
            docs/papers/higher-order-dina-monte-carlo-contract.md \
            .github/workflows/remove-obsolete-ho-mc-test.yml
          git commit -m "test: replace obsolete higher-order Monte Carlo gate"
          git push origin HEAD:feat/rust-true-parameter-recovery-389
