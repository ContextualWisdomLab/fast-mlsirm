name: Render PR 545 changelog

on:
  push:
    branches:
      - feat/enterprise-calibration-reports

permissions:
  contents: write

concurrency:
  group: render-pr-545-changelog
  cancel-in-progress: false

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enterprise-calibration-reports
      - name: Render authoritative changelog fragment
        run: |
          python - <<'PY'
          from pathlib import Path

          changelog_path = Path("CHANGELOG.md")
          fragment_path = Path(
              "docs/changelog.d/enterprise-issue-calibration-reports.md"
          )
          changelog = changelog_path.read_text(encoding="utf-8")
          lines = fragment_path.read_text(encoding="utf-8").splitlines()
          if len(lines) < 5 or not lines[0].startswith("# "):
              raise SystemExit("changelog fragment requires a level-one title")
          if lines[2] != "## Added":
              raise SystemExit("changelog fragment must declare the Added section")
          title = lines[0][2:].strip()
          body = "\n".join(lines[4:]).strip()
          rendered = f"#### {title}\n\n{body}\n\n"
          if f"#### {title}\n" in changelog:
              raise SystemExit(0)
          anchor = (
              "<!-- BEGIN AUTHORITATIVE CHANGELOG FRAGMENTS -->\n"
              "### Added\n\n"
          )
          if changelog.count(anchor) != 1:
              raise SystemExit("authoritative Added anchor must occur exactly once")
          changelog_path.write_text(
              changelog.replace(anchor, anchor + rendered, 1),
              encoding="utf-8",
          )
          PY
      - name: Commit rendered changelog
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): render enterprise calibration reports"
          git push origin HEAD:feat/enterprise-calibration-reports
