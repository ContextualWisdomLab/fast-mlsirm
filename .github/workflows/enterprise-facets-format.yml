name: Format enterprise facets handoff

on:
  push:
    branches:
      - feat/enterprise-facets-handoff
    paths:
      - .github/workflows/enterprise-facets-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enterprise-facets-handoff
      - name: Format exact changed Python files
        run: |
          python -m pip install "ruff==0.16.1"
          ruff format \
            python/fast_mlsirm/scoring/enterprise_issue/calibration.py \
            tests/test_scoring_enterprise_issue_calibration_nested.py
          ruff format --check \
            python/fast_mlsirm/scoring/enterprise_issue/calibration.py \
            tests/test_scoring_enterprise_issue_calibration_nested.py
      - name: Remove one-shot workflow and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enterprise-facets-format.yml
          git add python/fast_mlsirm/scoring/enterprise_issue/calibration.py \
            tests/test_scoring_enterprise_issue_calibration_nested.py
          git diff --cached --check
          git commit -m "style(enterprise): format facets handoff tests"
          git push origin HEAD:feat/enterprise-facets-handoff
