name: Temporary essay changelog render

on:
  push:
    branches:
      - feat/essay-facets-calibration-report
    paths:
      - .github/workflows/temporary-render-essay-changelog.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/essay-facets-calibration-report
          fetch-depth: 0
      - name: Render authoritative changelog and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          rm .github/workflows/temporary-render-essay-changelog.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/temporary-render-essay-changelog.yml
          git diff --cached --check
          git commit -m "docs(changelog): render essay calibration fragment"
          git push origin HEAD:feat/essay-facets-calibration-report
