name: PR 541 review fixes

on:
  push:
    branches:
      - feat/enterprise-facets-handoff

permissions:
  contents: read

concurrency:
  group: pr-541-review-fixes
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enterprise-facets-handoff
          fetch-depth: 0

      - name: Apply deterministic review fixes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pr541_review_fixes.py
          python -m py_compile \
            tests/scoring_enterprise_issue_calibration_fixtures.py \
            tests/test_scoring_enterprise_issue_calibration.py \
            tests/test_scoring_enterprise_issue_calibration_nested.py
          git diff --check

      - name: Install hash-locked test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Verify focused and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_scoring_enterprise_issue_calibration.py \
            tests/test_scoring_enterprise_issue_calibration_nested.py
          python scripts/check_docstring_coverage.py
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          git diff --check

      - name: Commit verified review fixes and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/pr-541-review-fixes.yml \
            scripts/pr541_review_fixes.py \
            .github/pr-541-review-fixes-trigger.txt
          git add \
            tests/scoring_enterprise_issue_calibration_fixtures.py \
            tests/test_scoring_enterprise_issue_calibration.py \
            tests/test_scoring_enterprise_issue_calibration_nested.py
          git diff --cached --check
          git commit -m "test(enterprise): address facets handoff review findings"
          git push origin HEAD:feat/enterprise-facets-handoff
