name: Synchronize enterprise facets handoff

on:
  push:
    branches:
      - feat/enterprise-facets-handoff
    paths:
      - .github/workflows/enterprise-facets-sync.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enterprise-facets-handoff
          fetch-depth: 0
      - name: Merge main and render authoritative changelog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          git rm .github/workflows/enterprise-facets-sync.yml
          git add CHANGELOG.md
          git diff --cached --check
          git commit -m "docs(changelog): render enterprise facets handoff"
          git push origin HEAD:feat/enterprise-facets-handoff
