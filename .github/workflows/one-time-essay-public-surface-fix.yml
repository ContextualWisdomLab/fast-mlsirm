# Temporary workflow; the automation removes it after applying the exact fix.
name: One-time essay public surface fix

on:
  push:
    branches:
      - feat/essay-validation-report-html
    paths:
      - .github/workflows/one-time-essay-public-surface-fix.yml
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions: {}

concurrency:
  group: one-time-essay-public-surface-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-public-surface:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/essay-validation-report-html
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Update exact public-surface contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_scoring_essay_contracts.py")
          content = path.read_text(encoding="utf-8")
          old = '''        "render_essay_score_report_html",
              "score_essay_request",
          '''
          new = '''        "render_essay_score_report_html",
              "render_essay_validation_evidence_report_html",
              "score_essay_request",
          '''
          if content.count(old) == 1 and new not in content:
              content = content.replace(old, new)
          elif content.count(new) == 1 and old not in content:
              pass
          else:
              raise RuntimeError("public-surface contract is not in an expected state")
          path.write_text(content, encoding="utf-8")
          PY
      - name: Install package and CI dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run focused validation
        run: |
          pytest \
            tests/test_scoring_essay_contracts.py::test_public_surface_is_explicit_and_documented \
            tests/test_scoring_essay_reporting_exports.py \
            tests/test_scoring_essay_validation_report_html.py
      - name: Commit exact contract fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_scoring_essay_contracts.py
          git diff --cached --check
          git commit -m "test(essay): include validation HTML in public surface"
          git push origin "HEAD:feat/essay-validation-report-html"
