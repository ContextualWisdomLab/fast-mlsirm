name: Publish Package

# Builds hash-pinnable sdist + wheel artifacts from an explicitly verified
# release commit and publishes them under the corresponding immutable release
# tag. The canonical release-tag workflow dispatches this workflow explicitly
# because events created with GITHUB_TOKEN do not recursively start ordinary
# event-triggered workflows.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable release tag to publish (for example v0.9.0)"
        required: true
        type: string
      release_commit:
        description: "Reviewed release source commit (full lowercase SHA-1)"
        required: true
        type: string
      control_plane_commit:
        description: "Protected default-branch commit that selected this publication workflow"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: verify release provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify publication control-plane identity
        env:
          CONTROL_PLANE_COMMIT: ${{ inputs.control_plane_commit }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$CONTROL_PLANE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "control_plane_commit must be a canonical 40-character lowercase SHA-1" >&2
            exit 1
          fi
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [ "$PUBLISH_REF" != "$expected_ref" ]; then
            echo "package publication must run from $expected_ref, not $PUBLISH_REF" >&2
            exit 1
          fi
          if [ "$CONTROL_PLANE_SHA" != "$CONTROL_PLANE_COMMIT" ]; then
            echo "publication control plane moved after release verification" >&2
            exit 1
          fi
      - name: Validate release source identity
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release_commit must be a canonical 40-character lowercase SHA-1" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Require release tag and source commit to match project version
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$RELEASE_COMMIT" ]; then
            echo "checked-out release source does not match release_commit" >&2
            exit 1
          fi
          if ! tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}" 2>/dev/null)"; then
            echo "release tag is unavailable for provenance verification" >&2
            exit 1
          fi
          if [ "$tag_commit" != "$RELEASE_COMMIT" ]; then
            echo "release tag does not target release_commit" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              project = tomllib.load(stream)["project"]

          expected = f"v{project['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"release tag does not match project version: expected {expected!r}, got {actual!r}"
              )
          PY

  sdist:
    name: sdist
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: sdist
          maturin-version: v1.14.1
          args: --out dist
      - name: Attest sdist build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-sdist
          path: dist

  wheels:
    name: wheels (${{ matrix.target }}, py${{ matrix.python-version }})
    needs: verify-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.12"
            interpreter: python3.12
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.13"
            interpreter: python3.13
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.14"
            interpreter: python3.14
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.12"
            interpreter: python3.12
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.13"
            interpreter: python3.13
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.14"
            interpreter: python3.14
          - runner: macos-latest
            target: universal2-apple-darwin
            manylinux: ""
            python-version: "3.12"
            interpreter: python
          - runner: macos-latest
            target: universal2-apple-darwin
            manylinux: ""
            python-version: "3.13"
            interpreter: python
          - runner: macos-latest
            target: universal2-apple-darwin
            manylinux: ""
            python-version: "3.14"
            interpreter: python
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
            python-version: "3.12"
            interpreter: python
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
            python-version: "3.13"
            interpreter: python
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
            python-version: "3.14"
            interpreter: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          maturin-version: v1.14.1
          args: --release --out dist -i ${{ matrix.interpreter }}
      - name: Attest wheel build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-wheel-${{ matrix.target }}-py${{ matrix.python-version }}
          path: dist

  sbom:
    name: release SBOM
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - name: Prepare SBOM output directory
        run: mkdir -p dist
      - name: Generate SPDX JSON SBOM from release source
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          syft-version: v1.51.1
          output-file: dist/fast-mlsirm.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate SPDX 2.3 SBOM
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def _reject_nonfinite(token: str) -> None:
              raise ValueError(f"non-standard JSON constant in release SBOM: {token}")

          def _reject_duplicates(pairs: list[tuple[str, object]]) -> dict[str, object]:
              document: dict[str, object] = {}
              for key, value in pairs:
                  if key in document:
                      raise ValueError(f"duplicate JSON member in release SBOM: {key}")
                  document[key] = value
              return document

          path = Path("dist/fast-mlsirm.spdx.json")
          with path.open("r", encoding="utf-8") as stream:
              document = json.load(
                  stream,
                  parse_constant=_reject_nonfinite,
                  object_pairs_hook=_reject_duplicates,
              )

          expected = "SPDX-2.3"
          actual = document.get("spdxVersion")
          if actual != expected:
              raise SystemExit(
                  f"release SBOM declares unsupported SPDX version: expected {expected!r}, got {actual!r}"
              )
          PY
      - name: Attest release SBOM provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/fast-mlsirm.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-sbom
          path: dist/fast-mlsirm.spdx.json

  release-assets:
    name: attach release assets
    needs: [sdist, wheels, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-sbom
          path: dist
      - name: List built artifacts
        run: ls -la dist
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "${{ github.repository }}"

  publish-pypi:
    name: publish to PyPI
    needs: [sdist, wheels, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: List built artifacts
        run: ls -la dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          password: ${{ secrets.PIPY_TOKEN }}
          attestations: false
