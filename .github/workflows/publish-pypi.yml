name: Publish Package

# Builds hash-pinnable sdist + wheel artifacts from an explicitly verified
# release commit and publishes them under the corresponding immutable release
# tag. The canonical release-tag workflow dispatches this workflow explicitly
# because events created with GITHUB_TOKEN do not recursively start ordinary
# event-triggered workflows.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable release tag to publish (for example v0.9.0)"
        required: true
        type: string
      release_commit:
        description: "Reviewed release source commit (full lowercase SHA-1)"
        required: true
        type: string
      control_plane_commit:
        description: "Protected default-branch commit that selected this publication workflow"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: verify release provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify publication control-plane identity
        env:
          CONTROL_PLANE_COMMIT: ${{ inputs.control_plane_commit }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$CONTROL_PLANE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "control_plane_commit must be a canonical 40-character lowercase SHA-1" >&2
            exit 1
          fi
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [ "$PUBLISH_REF" != "$expected_ref" ]; then
            echo "package publication must run from $expected_ref, not $PUBLISH_REF" >&2
            exit 1
          fi
          if [ "$CONTROL_PLANE_SHA" != "$CONTROL_PLANE_COMMIT" ]; then
            echo "publication control plane moved after release verification" >&2
            exit 1
          fi
      - name: Validate release source identity
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release_commit must be a canonical 40-character lowercase SHA-1" >&2
            exit 1
          fi
      - name: Require exact draft release state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          releases_file="$(mktemp)"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases_file"
          python3 - "$releases_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          pages = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_tag = os.environ["RELEASE_TAG"]
          matches = [
              release
              for page in pages
              if isinstance(page, list)
              for release in page
              if isinstance(release, dict) and release.get("tag_name") == expected_tag
          ]
          if len(matches) != 1:
              raise SystemExit(
                  "publication requires exactly one matching unpublished draft release"
              )
          release = matches[0]
          if release.get("draft") is not True or release.get("name") != expected_tag:
              raise SystemExit(
                  "publication requires exactly one matching unpublished draft release"
              )
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Require release tag and source commit to match project version
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$RELEASE_COMMIT" ]; then
            echo "checked-out release source does not match release_commit" >&2
            exit 1
          fi
          if ! tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}" 2>/dev/null)"; then
            echo "release tag is unavailable for provenance verification" >&2
            exit 1
          fi
          if [ "$tag_commit" != "$RELEASE_COMMIT" ]; then
            echo "release tag does not target release_commit" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              project = tomllib.load(stream)["project"]

          expected = f"v{project['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"release tag does not match project version: expected {expected!r}, got {actual!r}"
              )
          PY

  sdist:
    name: sdist
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: sdist
          maturin-version: v1.14.1
          args: --out dist
      - name: Attest sdist build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-sdist
          path: dist

  wheels:
    name: wheels (${{ matrix.target }}, py${{ matrix.python-version }})
    needs: verify-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.12"
            interpreter: python3.12
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.13"
            interpreter: python3.13
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.14"
            interpreter: python3.14
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.12"
            interpreter: python3.12
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.13"
            interpreter: python3.13
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.14"
            interpreter: python3.14
          - runner: macos-latest
            target: universal2-apple-darwin
            manylinux: ""
            python-version: "3.12"
            interpreter: python
          - runner: macos-latest
            target: universal2-apple-darwin
            manylinux: ""
            python-version: "3.13"
            interpreter: python
          - runner: macos-latest
            target: universal2-apple-darwin
            manylinux: ""
            python-version: "3.14"
            interpreter: python
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
            python-version: "3.12"
            interpreter: python
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
            python-version: "3.13"
            interpreter: python
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
            python-version: "3.14"
            interpreter: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          maturin-version: v1.14.1
          args: --release --out dist -i ${{ matrix.interpreter }}
      - name: Attest wheel build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-wheel-${{ matrix.target }}-py${{ matrix.python-version }}
          path: dist

  sbom:
    name: release SBOM
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - name: Prepare SBOM output directory
        run: mkdir -p dist
      - name: Generate SPDX JSON SBOM from release source
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          syft-version: v1.51.1
          output-file: dist/fast-mlsirm.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate SPDX 2.3 SBOM
        run: python scripts/validate_release_spdx.py dist/fast-mlsirm.spdx.json
      - name: Attest release SBOM provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/fast-mlsirm.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-sbom
          path: dist/fast-mlsirm.spdx.json

  release-assets:
    name: attach release assets
    needs: [sdist, wheels, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-sbom
          path: dist
      - name: List built artifacts
        run: ls -la dist
      - name: Revalidate exact draft release state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          releases_file="$(mktemp)"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases_file"
          python3 - "$releases_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          pages = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_tag = os.environ["RELEASE_TAG"]
          matches = [
              release
              for page in pages
              if isinstance(page, list)
              for release in page
              if isinstance(release, dict) and release.get("tag_name") == expected_tag
          ]
          if len(matches) != 1:
              raise SystemExit("release mutation requires exactly one matching unpublished draft release")
          release = matches[0]
          if release.get("draft") is not True or release.get("name") != expected_tag:
              raise SystemExit("release mutation requires exactly one matching unpublished draft release")
          PY
      - name: Attach release assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "${{ github.repository }}"

  publish-pypi:
    name: publish to PyPI
    needs: [sdist, wheels, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: List built artifacts
        run: ls -la dist
      - name: Revalidate exact draft release state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          releases_file="$(mktemp)"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases_file"
          python3 - "$releases_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          pages = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_tag = os.environ["RELEASE_TAG"]
          matches = [
              release
              for page in pages
              if isinstance(page, list)
              for release in page
              if isinstance(release, dict) and release.get("tag_name") == expected_tag
          ]
          if len(matches) != 1:
              raise SystemExit("release mutation requires exactly one matching unpublished draft release")
          release = matches[0]
          if release.get("draft") is not True or release.get("name") != expected_tag:
              raise SystemExit("release mutation requires exactly one matching unpublished draft release")
          PY
      - name: Prepare digest-bound PyPI retry set
        id: pypi-recovery
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          evidence_dir=".release-evidence"
          pypi_json="$evidence_dir/pypi-before.json"
          mkdir -p "$evidence_dir/already-published"
          http_status="$(curl --silent --show-error --location \
            --output "$pypi_json" --write-out '%{http_code}' \
            "https://pypi.org/pypi/fast-mlsirm/${release_version}/json")"
          case "$http_status" in
            200|404) ;;
            *) echo "PyPI release lookup failed with HTTP $http_status" >&2; exit 1 ;;
          esac
          python3 - "$http_status" "$pypi_json" "$evidence_dir/pypi-manifest.json" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          status, response_path, manifest_path = sys.argv[1:]
          local_files = sorted(path for path in Path("dist").iterdir() if path.is_file())
          if not local_files:
              raise SystemExit("publication requires at least one built distribution")

          def digest(path: Path) -> str:
              hasher = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      hasher.update(chunk)
              return hasher.hexdigest()

          local = {path.name: (path, digest(path)) for path in local_files}
          if len(local) != len(local_files):
              raise SystemExit("duplicate local distribution filenames are not publishable")

          if status == "404":
              payload = {"urls": []}
          else:
              payload = json.loads(Path(response_path).read_text(encoding="utf-8"))
          urls = payload.get("urls") if isinstance(payload, dict) else None
          if not isinstance(urls, list):
              raise SystemExit("PyPI release response does not contain a file list")

          remote: dict[str, str] = {}
          for entry in urls:
              if not isinstance(entry, dict):
                  raise SystemExit("PyPI release response contains an invalid file entry")
              filename = entry.get("filename")
              digests = entry.get("digests")
              remote_sha = digests.get("sha256") if isinstance(digests, dict) else None
              if not isinstance(filename, str) or not isinstance(remote_sha, str):
                  raise SystemExit("PyPI release response is missing a filename or SHA-256 digest")
              if filename in remote:
                  raise SystemExit("PyPI release response contains duplicate filenames")
              remote[filename] = remote_sha

          unexpected = sorted(set(remote) - set(local))
          if unexpected:
              raise SystemExit(
                  "unexpected PyPI files for this release: " + ", ".join(unexpected)
              )

          missing: list[str] = []
          already_published = Path(".release-evidence/already-published")
          for filename, (local_path, local_sha) in sorted(local.items()):
              remote_sha = remote.get(filename)
              if remote_sha is None:
                  missing.append(filename)
                  continue
              if remote_sha != local_sha:
                  raise SystemExit(
                      "published PyPI digest does not match the reviewed artifact: " + filename
                  )
              local_path.replace(already_published / filename)

          manifest = {"files": {name: sha for name, (_, sha) in sorted(local.items())}}
          Path(manifest_path).write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"needs_publish={str(bool(missing)).lower()}\n")
          PY
      - name: Publish package distributions to PyPI
        if: steps.pypi-recovery.outputs.needs_publish == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          password: ${{ secrets.PIPY_TOKEN }}
          attestations: false
      - name: Verify complete PyPI artifact set
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          evidence_dir=".release-evidence"
          manifest="$evidence_dir/pypi-manifest.json"
          pypi_json="$evidence_dir/pypi-after.json"
          verified=false
          for attempt in 1 2 3 4 5 6; do
            if curl --silent --show-error --location --fail \
              --output "$pypi_json" \
              "https://pypi.org/pypi/fast-mlsirm/${release_version}/json"; then
              if python3 - "$manifest" "$pypi_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = manifest.get("files") if isinstance(manifest, dict) else None
          response = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          urls = response.get("urls") if isinstance(response, dict) else None
          if not isinstance(expected, dict) or not isinstance(urls, list):
              raise SystemExit("PyPI artifact set is incomplete or contains unexpected files")

          remote: dict[str, str] = {}
          for entry in urls:
              if not isinstance(entry, dict):
                  raise SystemExit("PyPI artifact set is incomplete or contains unexpected files")
              filename = entry.get("filename")
              digests = entry.get("digests")
              remote_sha = digests.get("sha256") if isinstance(digests, dict) else None
              if not isinstance(filename, str) or not isinstance(remote_sha, str):
                  raise SystemExit("PyPI artifact set is incomplete or contains unexpected files")
              if filename in remote:
                  raise SystemExit("PyPI artifact set is incomplete or contains unexpected files")
              remote[filename] = remote_sha

          if set(remote) != set(expected):
              raise SystemExit("PyPI artifact set is incomplete or contains unexpected files")
          for filename, local_sha in expected.items():
              if remote.get(filename) != local_sha:
                  raise SystemExit("PyPI artifact digest mismatch after publication: " + filename)
          PY
              then
                verified=true
                break
              fi
            fi
            sleep 5
          done
          if [ "$verified" != true ]; then
            echo "PyPI artifact verification did not converge on the reviewed distribution set" >&2
            exit 1
          fi

  finalize-release:
    name: publish immutable GitHub release
    needs: [release-assets, publish-pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dist-*
          path: .release-evidence/github-assets
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-sbom
          path: .release-evidence/github-assets
      - name: Revalidate exact draft release state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          releases_file="$(mktemp)"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$releases_file"
          python3 - "$releases_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          pages = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_tag = os.environ["RELEASE_TAG"]
          matches = [
              release
              for page in pages
              if isinstance(page, list)
              for release in page
              if isinstance(release, dict) and release.get("tag_name") == expected_tag
          ]
          if len(matches) != 1:
              raise SystemExit("release mutation requires exactly one matching unpublished draft release")
          release = matches[0]
          if release.get("draft") is not True or release.get("name") != expected_tag:
              raise SystemExit("release mutation requires exactly one matching unpublished draft release")
          PY
      - name: Verify exact GitHub release asset set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_json="$(mktemp)"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$release_json"
          python3 - "$release_json" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          asset_dir = Path(".release-evidence/github-assets")
          local_files = sorted(path for path in asset_dir.iterdir() if path.is_file())
          if not local_files:
              raise SystemExit("GitHub release publication requires reviewed release assets")

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          expected = {path.name: (sha256(path), path.stat().st_size) for path in local_files}
          if len(expected) != len(local_files):
              raise SystemExit("duplicate reviewed GitHub release asset filenames are not publishable")

          release = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assets = release.get("assets") if isinstance(release, dict) else None
          if not isinstance(assets, list):
              raise SystemExit("GitHub release response does not contain an asset list")

          remote: dict[str, tuple[str, int]] = {}
          for asset in assets:
              if not isinstance(asset, dict):
                  raise SystemExit("GitHub release response contains an invalid asset entry")
              name = asset.get("name")
              remote_digest = asset.get("digest")
              size = asset.get("size")
              if (
                  not isinstance(name, str)
                  or not isinstance(remote_digest, str)
                  or not isinstance(size, int)
                  or asset.get("state") != "uploaded"
              ):
                  raise SystemExit("GitHub release asset is missing uploaded digest evidence")
              if name in remote:
                  raise SystemExit("GitHub release response contains duplicate asset filenames")
              remote[name] = (remote_digest, size)

          if set(remote) != set(expected):
              raise SystemExit("GitHub release asset set differs from the reviewed artifact set")
          for filename, (local_sha, local_size) in expected.items():
              remote_digest, remote_size = remote[filename]
              if remote_digest != f"sha256:{local_sha}" or remote_size != local_size:
                  raise SystemExit(
                      "GitHub release asset digest/size differs from the reviewed artifact: "
                      + filename
                  )
          PY
      - name: Publish the fully assembled draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --draft=false
