name: Publish Package

# Builds hash-pinnable sdist + wheel artifacts from an explicitly verified
# release commit and publishes them under the corresponding immutable release
# tag. The canonical release-tag workflow dispatches this workflow explicitly
# because events created with GITHUB_TOKEN do not recursively start ordinary
# event-triggered workflows.
#
# Dual-path note (ADR-0029 / docs/orchestration/release-publish-contract.md):
# This local workflow body remains the default execution path. Do NOT remove it
# or switch callers to ContextualWisdomLab/.github until one full release has
# succeeded via the central reusable workflow. A SEPARATE thin-wrapper PR will
# pin `uses: ...@<exact-merged-sha>` after ContextualWisdomLab/.github lands
# reusable workflows (expected central name: publish-package / equivalent —
# align to whatever that PR ships). Exact SHA/path TBD — leave commented; do
# not invent a live uses: that would fail CI:
#
# # jobs:
# #   call-central:
# #     uses: ContextualWisdomLab/.github/.github/workflows/<publish-package-or-shipped-name>.yml@<exact-sha>
# #     with:
# #       release_tag: ${{ inputs.release_tag }}
# #       release_commit: ${{ inputs.release_commit }}
# #       control_plane_commit: ${{ inputs.control_plane_commit }}
# #     secrets: inherit

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable release tag to publish (for example v0.9.0)"
        required: true
        type: string
      release_commit:
        description: "Reviewed release source commit (full lowercase SHA-1)"
        required: true
        type: string
      control_plane_commit:
        description: "Protected default-branch commit that selected this publication workflow"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: verify release provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify publication control-plane identity
        env:
          CONTROL_PLANE_COMMIT: ${{ inputs.control_plane_commit }}
          CONTROL_PLANE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$CONTROL_PLANE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "control_plane_commit must be a canonical 40-character lowercase SHA-1" >&2
            exit 1
          fi
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [ "$PUBLISH_REF" != "$expected_ref" ]; then
            echo "package publication must run from $expected_ref, not $PUBLISH_REF" >&2
            exit 1
          fi
          if [ "$CONTROL_PLANE_SHA" != "$CONTROL_PLANE_COMMIT" ]; then
            echo "publication control plane moved after release verification" >&2
            exit 1
          fi
      - name: Validate release source identity
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release_commit must be a canonical 40-character lowercase SHA-1" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Require release tag and source commit to match project version
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$RELEASE_COMMIT" ]; then
            echo "checked-out release source does not match release_commit" >&2
            exit 1
          fi
          if ! tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}" 2>/dev/null)"; then
            echo "release tag is unavailable for provenance verification" >&2
            exit 1
          fi
          if [ "$tag_commit" != "$RELEASE_COMMIT" ]; then
            echo "release tag does not target release_commit" >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as stream:
              project = tomllib.load(stream)["project"]

          expected = f"v{project['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"release tag does not match project version: expected {expected!r}, got {actual!r}"
              )
          PY

  sdist:
    name: sdist
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: sdist
          maturin-version: v1.14.1
          args: --out dist
      # Historical release tags predate the pyproject include workaround for
      # maturin omitting LICENSE from mixed-layout sdists while still writing
      # License-File metadata. Inject the checked-out LICENSE when missing so
      # already-cut tags remain publishable without retagging.
      - name: Ensure LICENSE is present in the sdist
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import io
          import sys
          import tarfile
          from pathlib import Path

          dist = Path("dist")
          archives = sorted(dist.glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"expected exactly one sdist archive, found {archives!r}")
          archive = archives[0]
          license_path = Path("LICENSE")
          if not license_path.is_file():
              raise SystemExit("checked-out release source is missing LICENSE")
          license_bytes = license_path.read_bytes()

          with tarfile.open(archive, "r:gz") as reader:
              names = reader.getnames()
              members = reader.getmembers()
              file_members = {
                  member.name: reader.extractfile(member).read()
                  for member in members
                  if member.isfile()
              }

          roots = {name.split("/", 1)[0] for name in names if name}
          if len(roots) != 1:
              raise SystemExit(f"sdist must have a single top-level directory, found {sorted(roots)!r}")
          root = next(iter(roots))
          license_member = f"{root}/LICENSE"
          if license_member in file_members:
              if file_members[license_member] != license_bytes:
                  raise SystemExit("sdist LICENSE content does not match checked-out LICENSE")
              print(f"{archive.name} already contains {license_member}")
              sys.exit(0)

          rebuilt = archive.with_suffix(archive.suffix + ".rewritten")
          with tarfile.open(archive, "r:gz") as reader, tarfile.open(rebuilt, "w:gz") as writer:
              for member in members:
                  payload = reader.extractfile(member) if member.isfile() else None
                  writer.addfile(member, payload)
              info = tarfile.TarInfo(name=license_member)
              info.size = len(license_bytes)
              info.mode = 0o644
              writer.addfile(info, io.BytesIO(license_bytes))

          rebuilt.replace(archive)
          with tarfile.open(archive, "r:gz") as reader:
              if license_member not in reader.getnames():
                  raise SystemExit(f"failed to inject {license_member} into {archive.name}")
          print(f"injected {license_member} into {archive.name}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-sdist
          path: dist

  wheels:
    name: wheels (${{ matrix.target }}, py${{ matrix.python-version }})
    needs: verify-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.12"
            interpreter: python3.12
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.13"
            interpreter: python3.13
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.14"
            interpreter: python3.14
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.12"
            interpreter: python3.12
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.13"
            interpreter: python3.13
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
            python-version: "3.14"
            interpreter: python3.14
          - runner: macos-latest
            target: universal2-apple-darwin
            manylinux: ""
            python-version: "3.12"
            interpreter: python
          - runner: macos-latest
            target: universal2-apple-darwin
            manylinux: ""
            python-version: "3.13"
            interpreter: python
          - runner: macos-latest
            target: universal2-apple-darwin
            manylinux: ""
            python-version: "3.14"
            interpreter: python
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
            python-version: "3.12"
            interpreter: python
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
            python-version: "3.13"
            interpreter: python
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""
            python-version: "3.14"
            interpreter: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Select reviewed license bundle for wheel target
        shell: bash
        run: bash tools/select_third_party_license.sh "${{ matrix.target }}"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          maturin-version: v1.14.1
          args: --release --out dist -i ${{ matrix.interpreter }}
      - name: Verify wheel license bytes
        run: python tools/verify_wheel_license.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-wheel-${{ matrix.target }}-py${{ matrix.python-version }}
          path: dist

  release-assets:
    name: attach release assets
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: List built artifacts
        run: ls -la dist
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Immutable GitHub Releases reject later asset uploads (HTTP 422).
          # Skip cleanly so a PyPI-only republish of an already-cut release is
          # not forced into an overall workflow FAILURE by an unrecoverable
          # asset sink, while still failing closed for mutable releases.
          immutable="$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.immutable // false')"
          if [ "$immutable" = "true" ]; then
            echo "release $RELEASE_TAG is immutable; skipping GitHub asset upload"
            exit 0
          fi
          # Per-file upload: already-present assets also return HTTP 422
          # (name already_exists / immutable). Treat those as success so
          # retries after a partial attach remain green; other failures fail closed.
          shopt -s nullglob
          assets=(dist/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no dist artifacts to attach" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            upload_log="$(mktemp)"
            set +e
            gh release upload "$RELEASE_TAG" "$asset" --repo "$REPOSITORY" >"$upload_log" 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              rm -f "$upload_log"
              continue
            fi
            if grep -Eiq 'HTTP 422|already[_ ]exists|immutable|unprocessable' "$upload_log"; then
              echo "skipping already-uploaded or immutable asset: $asset"
              cat "$upload_log"
              rm -f "$upload_log"
              continue
            fi
            cat "$upload_log" >&2
            rm -f "$upload_log"
            echo "failed to attach release asset: $asset" >&2
            exit 1
          done

  publish-pypi:
    name: publish to PyPI
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: List built artifacts
        run: ls -la dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          password: ${{ secrets.PIPY_TOKEN }}
          attestations: false
          # Partial publishes (wheels accepted, sdist rejected) must be
          # retryable without failing on already-uploaded filenames.
          skip-existing: true
