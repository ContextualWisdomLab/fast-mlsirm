name: Temporary synchronize essay HTML branch

on:
  push:
    branches:
      - feat/essay-score-report-html
    paths:
      - .github/workflows/temporary-sync-essay-html-main.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/essay-score-report-html
          fetch-depth: 0
      - name: Merge current main and preserve composed essay exports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ] && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            exit "$merge_status"
          fi
          for path in CHANGELOG.md python/fast_mlsirm/scoring/essay/__init__.py tests/test_scoring_essay_contracts.py; do
            if git ls-files -u -- "$path" | grep -q .; then
              git checkout --theirs -- "$path"
            fi
          done
          python - <<'PY'
          from pathlib import Path

          package_path = Path("python/fast_mlsirm/scoring/essay/__init__.py")
          package_text = package_path.read_text(encoding="utf-8")
          import_block = (
              "from .report_html import (\n"
              "    render_essay_score_report_html as render_essay_score_report_html,\n"
              ")\n"
          )
          if import_block not in package_text:
              anchor = "from .reporting import EssayScoreReport as EssayScoreReport\n"
              if package_text.count(anchor) != 1:
                  raise SystemExit("unexpected essay package reporting import anchor")
              package_text = package_text.replace(anchor, import_block + anchor)
          export_line = '    "render_essay_score_report_html",\n'
          if export_line not in package_text:
              anchor = '    "score_essay_request",\n'
              if package_text.count(anchor) != 1:
                  raise SystemExit("unexpected essay package export anchor")
              package_text = package_text.replace(anchor, export_line + anchor)
          package_path.write_text(package_text, encoding="utf-8")

          contract_path = Path("tests/test_scoring_essay_contracts.py")
          contract_text = contract_path.read_text(encoding="utf-8")
          expected_line = '        "render_essay_score_report_html",\n'
          if expected_line not in contract_text:
              anchor = '        "score_essay_request",\n'
              if contract_text.count(anchor) != 1:
                  raise SystemExit("unexpected essay contract expected-set anchor")
              contract_text = contract_text.replace(anchor, expected_line + anchor)
          contract_path.write_text(contract_text, encoding="utf-8")
          PY
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          rm .github/workflows/temporary-sync-essay-html-main.yml
          git add -A
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            printf 'unresolved merge paths:\n%s\n' "$unresolved" >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m "merge: synchronize essay HTML report with main"
          git push origin HEAD:feat/essay-score-report-html
