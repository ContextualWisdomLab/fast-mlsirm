name: PR 533 payload hardening

on:
  push:
    branches:
      - feat/enterprise-explicit-value-parser

permissions:
  contents: read

jobs:
  harden:
    if: github.repository == 'ContextualWisdomLab/fast-mlsirm'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enterprise-explicit-value-parser
          fetch-depth: 0

      - name: Apply fail-closed payload fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          implementation = Path("python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py")
          text = implementation.read_text(encoding="utf-8")
          before = "        payload = thaw_json_value(freeze_metadata(value))\n        if self.value_kind in {"
          after = "        payload = thaw_json_value(freeze_metadata(value))\n        if type(payload) is not dict:\n            self._payload_error(\"normalized_payload must be a mapping\")\n        if self.value_kind in {"
          if before not in text:
              raise SystemExit("normalized payload insertion point not found")
          text = text.replace(before, after, 1)
          before = "            if payload[\"frequency_period\"] not in {\n                \"day\",\n                \"week\",\n                \"month\",\n                \"quarter\",\n                \"year\",\n            }:\n                self._payload_error(\"frequency_period must be supported\")"
          after = "            period = payload[\"frequency_period\"]\n            if type(period) is not str or period not in {\n                \"day\",\n                \"week\",\n                \"month\",\n                \"quarter\",\n                \"year\",\n            }:\n                self._payload_error(\"frequency_period must be supported\")"
          if before not in text:
              raise SystemExit("frequency period validation block not found")
          implementation.write_text(text.replace(before, after, 1), encoding="utf-8")

          tests = Path("tests/test_scoring_enterprise_explicit_values.py")
          test_text = tests.read_text(encoding="utf-8")
          before = "    (\n        (ExplicitValueKind.CALENDAR_DATE, {}),\n        (ExplicitValueKind.CALENDAR_DATE, {\"calendar_date\": 1}),"
          after = "    (\n        (ExplicitValueKind.CALENDAR_DATE, []),\n        (ExplicitValueKind.CALENDAR_DATE, {}),\n        (ExplicitValueKind.CALENDAR_DATE, {\"calendar_date\": 1}),"
          if before not in test_text:
              raise SystemExit("payload case insertion point not found")
          test_text = test_text.replace(before, after, 1)
          before = "        (\n            ExplicitValueKind.FREQUENCY_COUNT,\n            {\"frequency_count\": 1, \"frequency_period\": \"decade\"},\n        ),"
          after = "        (\n            ExplicitValueKind.FREQUENCY_COUNT,\n            {\"frequency_count\": 1, \"frequency_period\": []},\n        ),\n        (\n            ExplicitValueKind.FREQUENCY_COUNT,\n            {\"frequency_count\": 1, \"frequency_period\": \"decade\"},\n        ),"
          if before not in test_text:
              raise SystemExit("frequency payload case insertion point not found")
          test_text = test_text.replace(before, after, 1)
          before = "    payload: dict[str, Any],\n) -> None:"
          after = "    payload: Any,\n) -> None:"
          if before not in test_text:
              raise SystemExit("payload annotation not found")
          tests.write_text(test_text.replace(before, after, 1), encoding="utf-8")
          PY

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr-533-payload-hardening.yml
          git add python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py tests/test_scoring_enterprise_explicit_values.py
          git diff --cached --check
          git commit -m "fix(enterprise): harden explicit payload validation"
          git push origin HEAD:feat/enterprise-explicit-value-parser
