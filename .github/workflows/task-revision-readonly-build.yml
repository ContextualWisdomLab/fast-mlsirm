name: Task Revision Read-Only Candidate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: task-revision-readonly-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-candidate:
    if: github.event.pull_request.head.ref == 'feat/task-revision-calibration-identity-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/task-revision-calibration-identity-v2
          fetch-depth: 0

      - name: Apply reviewed implementation in ephemeral workspace
        shell: bash
        run: |
          git fetch --no-tags origin 8c39e2db29a50f7c91e80b2975a0345c757b9ab5
          git show 8c39e2db29a50f7c91e80b2975a0345c757b9ab5:.github/workflows/task-revision-implement.yml > /tmp/task-revision-implement.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/task-revision-implement.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          python3 -m compileall"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          bad_tail = "\npython_files = ["
          if bad_tail in script:
              script = script[: script.index(bad_tail)] + "\n"
          exec(compile(script, '<task-revision-implementation>', 'exec'), {'__name__': '__main__'})
          PY
          python3 -m compileall -q python/fast_mlsirm/scoring tests
          git diff --check

      - name: Package candidate files and patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import shutil
          import subprocess

          excluded = {'.github/workflows/task-revision-readonly-build.yml'}
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACM'], text=True
          ).splitlines())
          changed.update(subprocess.check_output(
              ['git', 'ls-files', '--others', '--exclude-standard'], text=True
          ).splitlines())
          changed = sorted(path for path in changed if path and path not in excluded)
          if not changed:
              raise SystemExit('implementation script produced no source changes')
          root = Path('task-revision-artifact/tree')
          manifest = []
          for path_text in changed:
              source = Path(path_text)
              target = root / path_text
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              data = source.read_bytes()
              manifest.append({'path': path_text, 'sha256': hashlib.sha256(data).hexdigest(), 'size': len(data)})
          Path('task-revision-artifact/manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          with Path('task-revision-artifact/implementation.patch').open('w', encoding='utf-8') as output:
              subprocess.run(['git', 'diff', '--binary'], check=True, stdout=output, text=True)
          print('\n'.join(changed))
          PY

      - name: Upload candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: task-revision-candidate-${{ github.sha }}
          path: task-revision-artifact
          if-no-files-found: error
          retention-days: 1
