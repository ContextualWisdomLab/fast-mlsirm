name: Repair PR 898 Equating Controls

on:
  push:
    branches:
      - fix/equating-control-callbacks

permissions:
  contents: write

concurrency:
  group: repair-pr-898-equating-controls
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - name: Apply the reviewed fail-closed source patch
        run: python scripts/ci/materialize_pr_898_equating_controls.py
      - name: Build the exact Python and Rust package boundary
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify focused equating control regressions
        run: |
          python -m py_compile python/fast_mlsirm/equating.py
          pytest -q \
            tests/test_equating_control_validation.py \
            tests/test_equating_callback_safety.py \
            tests/test_equating_control_ranges.py \
            tests/test_cov_a_equating.py
      - name: Remove one-shot writer assets and verify scope
        run: |
          rm scripts/ci/materialize_pr_898_equating_controls.py
          rm .github/workflows/repair-pr-898-equating-controls.yml
          git diff --check
          actual="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/repair-pr-898-equating-controls.yml \
            python/fast_mlsirm/equating.py \
            scripts/ci/materialize_pr_898_equating_controls.py | sort)"
          test "$actual" = "$expected"
      - name: Commit the verified implementation to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(equating): validate controls before Rust dispatch"
          git push origin "HEAD:${GITHUB_REF_NAME}"
