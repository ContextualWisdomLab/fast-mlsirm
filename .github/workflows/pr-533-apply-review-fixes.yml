name: PR 533 apply review fixes

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

jobs:
  apply:
    if: github.event.pull_request.number == 533 && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Add remaining payload branch tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          tests = Path("tests/test_scoring_enterprise_explicit_values.py")
          text = tests.read_text(encoding="utf-8")
          marker = "def test_payload_validation_rejects_non_mapping_thaw_results"
          if marker not in text:
              addition = dedent(
                  '''


                  def test_noncanonical_compact_calendar_date_fails_closed() -> None:
                      """A parseable but noncanonical compact date is rejected."""
                      with pytest.raises(AssessmentSpecError) as captured:
                          _record(
                              ExplicitValueKind.CALENDAR_DATE,
                              payload={"calendar_date": "20260930"},
                          )
                      assert captured.value.code == "invalid_normalized_payload"


                  def test_payload_validation_rejects_non_mapping_thaw_results(
                      monkeypatch: pytest.MonkeyPatch,
                  ) -> None:
                      """The defensive post-thaw mapping guard remains explicitly covered."""
                      record = _record()
                      monkeypatch.setattr(
                          parser_module,
                          "thaw_json_value",
                          lambda value: [],
                      )
                      with pytest.raises(AssessmentSpecError) as captured:
                          record._normalized_payload({"calendar_date": "2026-09-30"})
                      assert captured.value.code == "invalid_normalized_payload"
                  '''
              )
              tests.write_text(
                  text.rstrip() + addition.rstrip() + "\n",
                  encoding="utf-8",
              )
          PY
          python -m py_compile tests/test_scoring_enterprise_explicit_values.py
          git diff --check

      - name: Commit exact branch tests
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/test_scoring_enterprise_explicit_values.py; then
            echo "Targeted branch tests are already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_scoring_enterprise_explicit_values.py
          git commit -m "test(enterprise): cover remaining explicit-value branches"
          git push origin HEAD:feat/enterprise-explicit-value-parser
