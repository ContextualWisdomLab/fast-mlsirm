name: Temporary readiness guidance repair

on:
  push:
    branches:
      - docs/repository-pages-surface

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'seonghobae'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout writer branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: docs/repository-pages-surface
          persist-credentials: true

      - name: Repair current readiness guidance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '''For a release-oriented local evidence build, the repository provides:

```bash
python scripts/build_commercial_release.py \\
  --out commercial-release \\
  --require-rust \\
  --check-import
```

That command produces review evidence; it does not by itself prove deployment, customer adoption, regulatory approval, commercial transfer, or suitability for a specific high-stakes use.
'''
          new = '''For a price-neutral release-oriented evidence check, run the acceptance and generic sales-readiness gates directly:

```bash
python scripts/release_acceptance.py --out release_acceptance --require-rust
python scripts/sales_readiness.py \\
  --acceptance release_acceptance/acceptance_summary.json \\
  --require-rust \\
  --check-import \\
  --out release_acceptance/sales_readiness_manifest.json
```

These commands produce review evidence; they do not by themselves prove deployment, customer adoption, regulatory approval, commercial transfer, or suitability for a specific high-stakes use.
'''
          if text.count(old) != 1:
              raise SystemExit(f'README release block anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old2 = '''**Enterprise Sales Readiness** is an evidence gate, not a sales, valuation, certification, or customer claim. The canonical gate is [`scripts/sales_readiness.py`](scripts/sales_readiness.py), driven by release evidence from [`scripts/release_acceptance.py`](scripts/release_acceptance.py). Higher-level procurement packets are assembled by [`scripts/build_release_evidence_index.py`](scripts/build_release_evidence_index.py), [`scripts/build_commercial_release.py`](scripts/build_commercial_release.py), [`scripts/build_procurement_due_diligence.py`](scripts/build_procurement_due_diligence.py), [`scripts/build_pr_queue_governance.py`](scripts/build_pr_queue_governance.py), and [`scripts/build_figma_evidence_sync.py`](scripts/build_figma_evidence_sync.py).
'''
          new2 = '''**Enterprise Sales Readiness** is an evidence gate, not a sales, valuation, certification, or customer claim. The canonical price-neutral gate is [`scripts/sales_readiness.py`](scripts/sales_readiness.py), driven by release evidence from [`scripts/release_acceptance.py`](scripts/release_acceptance.py). Higher-level procurement evidence is assembled by [`scripts/build_release_evidence_index.py`](scripts/build_release_evidence_index.py), [`scripts/build_procurement_due_diligence.py`](scripts/build_procurement_due_diligence.py), [`scripts/build_pr_queue_governance.py`](scripts/build_pr_queue_governance.py), and [`scripts/build_figma_evidence_sync.py`](scripts/build_figma_evidence_sync.py). The historical [`scripts/build_commercial_release.py`](scripts/build_commercial_release.py) remains a legacy 20B compatibility orchestrator and is not the current generic acquisition-readiness gate.
'''
          if text.count(old2) != 1:
              raise SystemExit(f'README acquisition paragraph anchor count={text.count(old2)}')
          readme.write_text(text.replace(old2, new2, 1), encoding='utf-8')

          guide = Path('docs/release_acceptance.md')
          text = guide.read_text(encoding='utf-8')
          old = '''For a full buyer-review evidence bundle, prefer the single commercial release
builder:

```bash
python scripts/build_commercial_release.py \\
  --out commercial-release \\
  --require-rust \\
  --check-import
```

The builder writes `commercial_release_manifest.json` and
`commercial_release_report.html`, then runs procurement due diligence by
default to write `procurement_due_diligence_manifest.json` and
`procurement_due_diligence_report.html`, and runs PR queue governance by
default to write `pr_queue_governance_manifest.json` and
`pr_queue_governance_report.html` under the same output directory. It then
runs Figma evidence sync by default to write
`figma_evidence_sync_manifest.json` and `figma_evidence_sync_report.html` after
PR queue governance so the static Figma buyer-review packet is checked against
the repo-local evidence bundle. It also
records each stage command, duration, status, failed stage, source commit,
contract value, artifact paths, and SHA256 digests for the same release
candidate.
'''
          new = '''The historical `scripts/build_commercial_release.py` orchestrator is retained
for legacy 20B compatibility. It is **not** the current price-neutral
acquisition-readiness entry point: its legacy orchestration still selects the
old deal-value profile. Do not use it to establish the generic gate above.

For current buyer-review evidence, compose the price-neutral
`--require-acquisition-readiness` contract from the same release candidate and
explicitly supplied benchmark, buyer-packet, release-index, procurement,
PR-queue, and Figma evidence manifests. A monetary transaction scenario is
optional evidence and must be supplied explicitly rather than inferred from a
hard-coded target.
'''
          if text.count(old) != 1:
              raise SystemExit(f'release guide legacy-builder anchor count={text.count(old)}')
          guide.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python -m pytest -q tests/test_acquisition_readiness_docs.py
          git diff --check

      - name: Commit repair and remove one-shot writer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_temp_readiness_guidance_repair.yml
          git add README.md docs/release_acceptance.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(readiness): separate generic gate from legacy builder'
          git push origin HEAD:docs/repository-pages-surface
