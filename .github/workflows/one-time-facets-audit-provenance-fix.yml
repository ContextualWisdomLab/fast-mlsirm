# Temporary workflow; it removes itself after applying and testing exact fixes.
name: One-time facets audit provenance fix

on:
  push:
    branches:
      - feat/essay-facets-report-html
    paths:
      - .github/workflows/one-time-facets-audit-provenance-fix.yml

permissions: {}

concurrency:
  group: one-time-facets-audit-provenance-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/essay-facets-report-html
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply exact audit fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(
                      f"expected exactly one replacement target in {path}: {old!r}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          renderer = "python/fast_mlsirm/scoring/essay/calibration_report_html.py"
          replace_once(
              renderer,
              '        return f\'<p class="empty-state">{escape(empty_message)}</p>\'\n',
              '        return f\'<div class="empty-state" role="status">{escape(empty_message)}</div>\'\n',
          )
          replace_once(
              renderer,
              '            ("Rust backend", "mlsirm_core_facets_fit_facets"),\n',
              "",
          )
          replace_once(
              renderer,
              '<p class="subtitle">Exact criterion-specific Rust facets output with source-text-free audit provenance.</p>',
              '<p class="subtitle">Exact criterion-specific facets calibration output with source-text-free audit provenance.</p>',
          )

          tests = "tests/test_scoring_essay_facets_report_html.py"
          replace_once(
              tests,
              '    assert "mlsirm_core_facets_fit_facets" in first\n',
              '    assert "mlsirm_core_facets_fit_facets" not in first\n'
              '    assert \'class="empty-state" role="status"\' in first\n',
          )
          replace_once(
              tests,
              '        \'<p class="empty-state">Nothing declared.</p>\'\n',
              '        \'<div class="empty-state" role="status">Nothing declared.</div>\'\n',
          )

          boundary_sentence = (
              " The renderer does not invent a backend implementation identifier; "
              "backend provenance must be established by the governed fit path and "
              "deployment evidence rather than inferred from a report payload."
          )
          doc_path = "docs/automated_essay_facets_calibration_reports.md"
          doc_anchor = (
              "`render_essay_facets_calibration_report_html` writes a deterministic "
              "standalone artifact containing exact report, design, assessment, rubric, "
              "construct, occasion, criterion, respondent, task-revision, rater-engine, "
              "category, estimate, convergence, connectedness, iteration, and review-trigger "
              "evidence. It intentionally excludes source text and does not produce fit, "
              "reliability, fairness, scoreability, global-optimum, or deployment decisions."
          )
          replace_once(doc_path, doc_anchor, doc_anchor + boundary_sentence)

          changelog_sentence = (
              " The artifact does not assert an unsealed backend implementation identity; "
              "backend provenance remains the responsibility of the governed fit path and "
              "deployment evidence."
          )
          fragment = "docs/changelog.d/essay-facets-calibration-report-html.md"
          fragment_anchor = (
              "- A restrictive meta-delivered Content Security Policy and output encoding "
              "reduce injection impact; convergence and connectedness remain integrity "
              "prerequisites and do not establish model fit, reliability, fairness, scorer "
              "interchangeability, construct validity, global optimality, or deployment "
              "authorization."
          )
          replace_once(fragment, fragment_anchor, fragment_anchor + changelog_sentence)
          replace_once("CHANGELOG.md", fragment_anchor, fragment_anchor + changelog_sentence)

          Path(".github/workflows/one-time-facets-audit-provenance-fix.yml").unlink()
          PY
      - name: Install package and CI dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate focused contracts
        run: |
          pytest \
            tests/test_scoring_essay_facets_report_html.py \
            tests/test_scoring_essay_facets_report_axis_labels.py \
            tests/test_changelog_fragment_contract.py
      - name: Commit exact fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(essay): make facets audit provenance conservative"
          git push origin "HEAD:feat/essay-facets-report-html"
