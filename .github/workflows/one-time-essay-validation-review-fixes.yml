# This workflow removes itself after applying verified review fixes.
name: One-time essay validation review fixes

on:
  push:
    branches:
      - feat/essay-validation-evidence-report
    paths:
      - .github/workflows/one-time-essay-validation-review-fixes.yml

permissions: {}

concurrency:
  group: one-time-essay-validation-review-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/essay-validation-evidence-report
          fetch-depth: 0
      - name: Apply verified review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path("tests/test_scoring_essay_validation_reporting.py")
          content = test_path.read_text(encoding="utf-8")

          old_metric_block = '''    expected_values = {
              "quadratic_weighted_kappa": expected.gates[0]["value"],
              "pearson_correlation": expected.gates[1]["value"],
              "standardized_mean_difference": expected.gates[2]["value"],
              "human_machine_degradation": expected.gates[3]["value"],
              "worst_subgroup_standardized_mean_difference": expected.gates[4]["value"],
              "exact_agreement": expected.exact_agreement,
              "adjacent_agreement": expected.adjacent_agreement,
          }
          '''
          new_metric_block = '''    expected_values = {
              validation_reporting._METRIC_NAME_MAP[gate["name"]]: gate["value"]
              for gate in expected.gates
          }
          expected_values["exact_agreement"] = expected.exact_agreement
          expected_values["adjacent_agreement"] = expected.adjacent_agreement
          assert set(expected_values) == set(_ALL_METRIC_IDS)
          '''
          old_metric_count = content.count(old_metric_block)
          new_metric_count = content.count(new_metric_block)
          if old_metric_count == 1 and new_metric_count == 0:
              content = content.replace(old_metric_block, new_metric_block)
          elif old_metric_count == 0 and new_metric_count == 1:
              pass
          else:
              raise RuntimeError(
                  "expected exactly one legacy or one corrected metric assertion block"
              )

          old_privacy = "    assert _AUTOMATED.tolist() not in payload.values()\n"
          new_privacy = '''    serialized_payload = str(payload)
          assert str(_AUTOMATED.tolist()) not in serialized_payload
          assert str(_REFERENCE.tolist()) not in serialized_payload
          assert str(_HUMAN_A.tolist()) not in serialized_payload
          assert str(_HUMAN_B.tolist()) not in serialized_payload
          assert str(_SUBGROUP.tolist()) not in serialized_payload
          '''
          old_privacy_count = content.count(old_privacy)
          new_privacy_count = content.count(new_privacy)
          if old_privacy_count == 1 and new_privacy_count == 0:
              content = content.replace(old_privacy, new_privacy)
          elif old_privacy_count == 0 and new_privacy_count == 1:
              pass
          else:
              raise RuntimeError(
                  "expected exactly one legacy or one corrected privacy assertion block"
              )

          if old_metric_block in content or old_privacy in content:
              raise RuntimeError("review fixes did not reach the required target state")
          if new_metric_block not in content or new_privacy not in content:
              raise RuntimeError("corrected assertions are missing after replacement")

          test_path.write_text(content, encoding="utf-8")
          PY
      - name: Run focused validation
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
          pytest tests/test_scoring_essay_validation_reporting.py tests/test_scoring_essay_contracts.py
      - name: Commit review fixes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-essay-validation-review-fixes.yml
          git add tests/test_scoring_essay_validation_reporting.py
          git diff --cached --check
          git commit -m "test(essay): harden validation evidence assertions"
          git push origin "HEAD:feat/essay-validation-evidence-report"
