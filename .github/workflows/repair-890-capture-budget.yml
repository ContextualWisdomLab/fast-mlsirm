name: Repair PR 890 cumulative capture budget

on:
  push:
    branches: [fix/hourly-pr-query-bounds-889]
    paths:
      - .github/workflows/repair-890-capture-budget.yml

permissions:
  contents: write

concurrency:
  group: repair-pr-890-capture-budget
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/hourly-pr-query-bounds-889
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply cumulative capture budget patch
        run: |
          cat > "$RUNNER_TEMP/repair-890.py.b64" <<'B64'
                    B64
          base64 --decode "$RUNNER_TEMP/repair-890.py.b64" > "$RUNNER_TEMP/repair-890.py"
          python "$RUNNER_TEMP/repair-890.py"
      - name: Install hash-locked CI dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci.txt
      - name: Verify focused tests and exact coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch -m pytest \
            tests/test_capture_pr_queue_snapshot.py \
            tests/test_hourly_snapshot_split_workflow.py \
            -q
          python -m coverage report \
            --include=scripts/capture_pr_queue_snapshot.py \
            --fail-under=100
          python -m compileall -q scripts/capture_pr_queue_snapshot.py tests/test_capture_pr_queue_snapshot.py tests/test_hourly_snapshot_split_workflow.py
      - name: Commit validated repair and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "seonghobae"
          git config user.email "me@seonghobae.me"
          git rm .github/workflows/repair-890-capture-budget.yml
          git add \
            .github/workflows/hourly-pr-governance.yml \
            docs/changelog.d/889-hourly-pr-query-bounds.md \
            docs/doctoring/889-github-graphql-query-bounds.md \
            scripts/capture_pr_queue_snapshot.py \
            tests/test_capture_pr_queue_snapshot.py \
            tests/test_hourly_snapshot_split_workflow.py
          git diff --cached --check
          git commit -m "fix(ops): cap cumulative queue capture time"
          git push origin HEAD:fix/hourly-pr-query-bounds-889
