name: PR 558 Render Changelog Once

on:
  push:
    branches:
      - automation/hourly-review-repair-fast-mlsirm

permissions:
  contents: write

concurrency:
  group: pr-558-render-changelog-once
  cancel-in-progress: false

jobs:
  render-and-remove:
    if: >-
      github.repository == 'ContextualWisdomLab/fast-mlsirm' &&
      github.ref == 'refs/heads/automation/hourly-review-repair-fast-mlsirm'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Render authoritative changelog and verify bounded diff
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_BRANCH: automation/hourly-review-repair-fast-mlsirm
          WORKFLOW_PATH: .github/workflows/pr-558-render-changelog-once.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote_sha="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"

          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          grep -Fq '#### Hourly bounded review-repair caller' CHANGELOG.md

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "CHANGELOG.md"

          rm -- "$WORKFLOW_PATH"
          mapfile -t final_changed < <(git status --short | sed -E 's/^...//')
          test "${#final_changed[@]}" -eq 2
          printf '%s\n' "${final_changed[@]}" | sort -u > /tmp/changed.txt
          printf '%s\n' CHANGELOG.md "$WORKFLOW_PATH" | sort -u > /tmp/expected.txt
          cmp /tmp/changed.txt /tmp/expected.txt
          git diff --check

      - name: Commit deterministic rendered changelog and remove one-shot workflow
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_BRANCH: automation/hourly-review-repair-fast-mlsirm
          WORKFLOW_PATH: .github/workflows/pr-558-render-changelog-once.yml
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md "$WORKFLOW_PATH"
          git commit -m "docs(changelog): render hourly review-repair fragment"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SHA"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD | sort | tr '\n' ' ')" = ".github/workflows/pr-558-render-changelog-once.yml CHANGELOG.md "
          git push origin "HEAD:refs/heads/$EXPECTED_BRANCH"
