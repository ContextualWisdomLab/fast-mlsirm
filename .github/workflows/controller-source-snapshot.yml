name: Controller Source Snapshot

on:
  pull_request:
    paths:
      - .github/workflows/controller-source-snapshot.yml

permissions:
  contents: read

concurrency:
  group: controller-source-snapshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact reviewed PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Archive reviewed source without repository metadata
        run: tar --exclude=.git -czf fast-mlsirm-source.tgz .
      - name: Publish source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: controller-source-${{ github.sha }}
          path: fast-mlsirm-source.tgz
          if-no-files-found: error
          retention-days: 1
