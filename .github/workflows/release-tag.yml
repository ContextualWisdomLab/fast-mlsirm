name: Release Tag

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to publish (e.g. 0.2.0); must match pyproject.toml"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  publish-release-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify dispatch targets the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [ "$DISPATCH_REF" != "$expected_ref" ]; then
            echo "release dispatch must target $expected_ref, not $DISPATCH_REF" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify the requested version is the released source version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          project_version="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          if [ "$project_version" != "$RELEASE_VERSION" ]; then
            echo "pyproject.toml version $project_version does not match requested $RELEASE_VERSION" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          release_version = os.environ["RELEASE_VERSION"]
          header = f"## [{release_version}] - "
          matches = [
              line
              for line in Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
              if line.startswith(header)
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one CHANGELOG section for {release_version}; "
                  f"found {len(matches)}"
              )
          PY
      - name: Extract the release notes from the CHANGELOG section
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          awk -v header="## [$RELEASE_VERSION] - " '
            index($0, header) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "CHANGELOG section for $RELEASE_VERSION is empty" >&2
            exit 1
          fi
      - name: Verify the release tag and release do not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          check_absent() {
            endpoint="$1"
            label="$2"
            response_file="$(mktemp)"
            status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$endpoint")"
            case "$status" in
              404)
                rm -f "$response_file"
                ;;
              200)
                rm -f "$response_file"
                echo "$label already exists; refusing to overwrite or reuse it" >&2
                exit 1
                ;;
              *)
                cat "$response_file" >&2
                rm -f "$response_file"
                echo "GitHub API returned HTTP $status while checking $label" >&2
                exit 1
                ;;
            esac
          }
          check_absent "git/ref/tags/v$RELEASE_VERSION" "tag v$RELEASE_VERSION"
          check_absent "releases/tags/v$RELEASE_VERSION" "release v$RELEASE_VERSION"
      - name: Publish the tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$RELEASE_VERSION" \
            --notes-file release_notes.md
