name: Release Tag

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to publish (e.g. 0.2.0); must match pyproject.toml"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  publish-release-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify dispatch targets the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [ "$DISPATCH_REF" != "$expected_ref" ]; then
            echo "release dispatch must target $expected_ref, not $DISPATCH_REF" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify the requested version is the released source version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          release_version = os.environ["RELEASE_VERSION"]
          core_semver = re.compile(
              r"(?:0|[1-9][0-9]*)\."
              r"(?:0|[1-9][0-9]*)\."
              r"(?:0|[1-9][0-9]*)\Z"
          )
          if core_semver.fullmatch(release_version) is None:
              raise SystemExit(
                  "release_version must be a canonical three-component semantic "
                  "version without leading zeros"
              )

          project = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          project_version = project["project"]["version"]
          if project_version != release_version:
              raise SystemExit(
                  f"pyproject.toml version {project_version} does not match "
                  f"requested {release_version}"
              )

          header = f"## [{release_version}] - "
          matches = [
              line
              for line in Path("CHANGELOG.md").read_text(
                  encoding="utf-8"
              ).splitlines()
              if line.startswith(header)
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one CHANGELOG section for {release_version}; "
                  f"found {len(matches)}"
              )
          PY
      - name: Extract the release notes from the CHANGELOG section
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          awk -v header="## [$RELEASE_VERSION] - " '
            index($0, header) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "CHANGELOG section for $RELEASE_VERSION is empty" >&2
            exit 1
          fi
      - name: Verify the release tag and release do not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          check_absent() {
            endpoint="$1"
            label="$2"
            response_file="$(mktemp)"
            status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$endpoint")"
            case "$status" in
              404)
                rm -f "$response_file"
                ;;
              200)
                rm -f "$response_file"
                echo "$label already exists; refusing to overwrite or reuse it" >&2
                exit 1
                ;;
              *)
                cat "$response_file" >&2
                rm -f "$response_file"
                echo "GitHub API returned HTTP $status while checking $label" >&2
                exit 1
                ;;
            esac
          }
          check_absent "git/ref/tags/v$RELEASE_VERSION" "tag v$RELEASE_VERSION"
          check_absent "releases/tags/v$RELEASE_VERSION" "release v$RELEASE_VERSION"
      - name: Atomically create the immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          request_file="$(mktemp)"
          response_file="$(mktemp)"
          cleanup() {
            rm -f "$request_file" "$response_file"
          }
          trap cleanup EXIT

          python3 - "$request_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "ref": f"refs/tags/v{os.environ['RELEASE_VERSION']}",
                      "sha": os.environ["GITHUB_SHA"],
                  }
              ),
              encoding="utf-8",
          )
          PY

          status="$(curl --silent --show-error \
            --request POST \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "@$request_file" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs")"
          if [ "$status" != "201" ]; then
            cat "$response_file" >&2
            echo "GitHub API returned HTTP $status while creating the release tag" >&2
            exit 1
          fi

          python3 - "$response_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_ref = f"refs/tags/v{os.environ['RELEASE_VERSION']}"
          actual_ref = response.get("ref")
          actual_sha = response.get("object", {}).get("sha")
          if actual_ref != expected_ref or actual_sha != os.environ["GITHUB_SHA"]:
              raise SystemExit(
                  "GitHub returned an unexpected ref or commit for the release tag"
              )
          PY
      - name: Publish the GitHub release from the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "v$RELEASE_VERSION" \
            --notes-file release_notes.md
