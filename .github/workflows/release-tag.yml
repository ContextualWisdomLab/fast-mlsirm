name: Release Tag

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to publish (e.g. 0.2.0); must match pyproject.toml"
        required: true
        type: string
      release_commit:
        description: "Release source commit reviewed for this version (full lowercase SHA-1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  publish-release-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - name: Verify dispatch targets the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          if [ "$DISPATCH_REF" != "$expected_ref" ]; then
            echo "release dispatch must target $expected_ref, not $DISPATCH_REF" >&2
            exit 1
          fi
      - name: Validate release source identity
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "release_commit must be a canonical 40-character lowercase SHA-1" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_commit }}
      - name: Verify the release source is on the current default-branch lineage
        env:
          DISPATCH_SHA: ${{ github.sha }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          set -euo pipefail
          checked_out_commit="$(git rev-parse HEAD)"
          if [ "$checked_out_commit" != "$RELEASE_COMMIT" ]; then
            echo "checked-out release source does not match release_commit" >&2
            exit 1
          fi
          if ! git cat-file -e "$DISPATCH_SHA^{commit}"; then
            echo "default-branch dispatch commit is unavailable for ancestry verification" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" "$DISPATCH_SHA"; then
            echo "release commit must be an ancestor of the default branch" >&2
            exit 1
          fi
      - name: Verify the requested version is the released source version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          release_version = os.environ["RELEASE_VERSION"]
          core_semver = re.compile(
              r"(?:0|[1-9][0-9]*)\."
              r"(?:0|[1-9][0-9]*)\."
              r"(?:0|[1-9][0-9]*)\Z"
          )
          if core_semver.fullmatch(release_version) is None:
              raise SystemExit(
                  "release_version must be a canonical three-component semantic "
                  "version without leading zeros"
              )

          project = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          project_version = project["project"]["version"]
          if project_version != release_version:
              raise SystemExit(
                  f"pyproject.toml version {project_version} does not match "
                  f"requested {release_version}"
              )

          header = f"## [{release_version}] - "
          matches = [
              line
              for line in Path("CHANGELOG.md").read_text(
                  encoding="utf-8"
              ).splitlines()
              if line.startswith(header)
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"expected exactly one CHANGELOG section for {release_version}; "
                  f"found {len(matches)}"
              )
          PY
      - name: Verify the release source is the version-cut transition
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if ! parent_commit="$(git rev-parse "$RELEASE_COMMIT^" 2>/dev/null)"; then
            echo "release commit must have a verifiable first parent" >&2
            exit 1
          fi
          python3 - "$parent_commit" <<'PY'
          import os
          import subprocess
          import sys
          import tomllib

          parent_commit = sys.argv[1]
          release_version = os.environ["RELEASE_VERSION"]

          def parent_text(path: str) -> str:
              result = subprocess.run(
                  ["git", "show", f"{parent_commit}:{path}"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  raise SystemExit(
                      f"release parent is missing required source file {path}"
                  )
              return result.stdout

          parent_project = tomllib.loads(parent_text("pyproject.toml"))
          parent_version = parent_project["project"]["version"]
          if parent_version == release_version:
              raise SystemExit(
                  "parent project version already equals requested release version"
              )

          header = f"## [{release_version}] - "
          parent_changelog = parent_text("CHANGELOG.md").splitlines()
          if any(line.startswith(header) for line in parent_changelog):
              raise SystemExit(
                  "parent CHANGELOG already contains requested release section"
              )
          PY
      - name: Fail closed on fragment to CHANGELOG aggregate drift
        run: |
          set -euo pipefail
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
      - name: Extract the release notes from the CHANGELOG section
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          awk -v header="## [$RELEASE_VERSION] - " '
            index($0, header) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "CHANGELOG section for $RELEASE_VERSION is empty" >&2
            exit 1
          fi
      - name: Cap the release body below the GitHub release-body limit
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          notes_path = Path("release_notes.md")
          notes_text = notes_path.read_text(encoding="utf-8")
          body_limit = 120_000
          if len(notes_text) > body_limit:
              release_version = os.environ["RELEASE_VERSION"]
              repository = os.environ["GITHUB_REPOSITORY"]
              changelog_url = (
                  f"https://github.com/{repository}/blob/"
                  f"v{release_version}/CHANGELOG.md"
              )
              headings = list(
                  dict.fromkeys(
                      line
                      for line in notes_text.splitlines()
                      if line.startswith("#### ")
                  )
              )
              summary_lines = [
                  "The complete notes for this release exceed GitHub's "
                  "release-body limit, so this body is a summary.",
                  "",
                  f"Full authoritative notes: the `[{release_version}]` "
                  f"section of [CHANGELOG.md]({changelog_url}).",
                  "",
                  "### Contents",
                  "",
              ]
              summary_lines += [
                  "- " + line[len("#### "):] for line in headings
              ]
              capped_text = "\n".join(summary_lines) + "\n"
              if len(capped_text) > body_limit:
                  capped_text = (
                      capped_text[: body_limit - 60].rsplit("\n", 1)[0]
                      + "\n\n(contents list truncated)\n"
                  )
              notes_path.write_text(capped_text, encoding="utf-8")
          PY
      - name: Verify release state and classify tag recovery
        id: release_tag_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          api_status() {
            endpoint="$1"
            response_file="$2"
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$endpoint"
          }
          response_file="$(mktemp)"
          resume_existing_release=false
          status="$(api_status "releases/tags/v$RELEASE_VERSION" "$response_file")"
          case "$status" in
            404)
              echo "resume_existing_release=false" >> "$GITHUB_OUTPUT"
              ;;
            200)
              python3 - "$response_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if response.get("draft") is not True:
              raise SystemExit(
                  f"release v{os.environ['RELEASE_VERSION']} is already published; refusing to overwrite or reuse it"
              )
          expected_name = f"v{os.environ['RELEASE_VERSION']}"
          if response.get("tag_name") != expected_name or response.get("name") != expected_name:
              raise SystemExit("existing draft release identity does not match the requested release")
          PY
              resume_existing_release=true
              echo "release v$RELEASE_VERSION already exists as an unpublished draft; resuming exact-tag publication"
              echo "resume_existing_release=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              cat "$response_file" >&2
              echo "GitHub API returned HTTP $status while checking release v$RELEASE_VERSION" >&2
              exit 1
              ;;
          esac
          status="$(api_status "git/ref/tags/v$RELEASE_VERSION" "$response_file")"
          case "$status" in
            404)
              if [ "$resume_existing_release" = "true" ]; then
                echo "existing draft release is missing its required release tag" >&2
                exit 1
              fi
              echo "resume_existing_tag=false" >> "$GITHUB_OUTPUT"
              ;;
            200)
              python3 - "$response_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          tag_object = response.get("object", {})
          actual_tag_sha = tag_object.get("sha")
          if (
              tag_object.get("type") != "commit"
              or actual_tag_sha != os.environ["RELEASE_COMMIT"]
          ):
              raise SystemExit(
                  "existing tag does not target the requested release commit"
              )
          PY
              echo "tag v$RELEASE_VERSION exists and targets the requested immutable source"
              echo "resume_existing_tag=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              cat "$response_file" >&2
              echo "GitHub API returned HTTP $status while checking tag v$RELEASE_VERSION" >&2
              exit 1
              ;;
          esac
          rm -f "$response_file"
      - name: Atomically create the immutable release tag
        if: steps.release_tag_state.outputs.resume_existing_tag != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          request_file="$(mktemp)"
          response_file="$(mktemp)"
          cleanup() {
            rm -f "$request_file" "$response_file"
          }
          trap cleanup EXIT

          python3 - "$request_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "ref": f"refs/tags/v{os.environ['RELEASE_VERSION']}",
                      "sha": os.environ["RELEASE_COMMIT"],
                  }
              ),
              encoding="utf-8",
          )
          PY

          status="$(curl --silent --show-error \
            --request POST \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data-binary "@$request_file" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs")"
          if [ "$status" != "201" ]; then
            cat "$response_file" >&2
            echo "GitHub API returned HTTP $status while creating the release tag" >&2
            exit 1
          fi

          python3 - "$response_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          response = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_ref = f"refs/tags/v{os.environ['RELEASE_VERSION']}"
          actual_ref = response.get("ref")
          actual_sha = response.get("object", {}).get("sha")
          if actual_ref != expected_ref or actual_sha != os.environ["RELEASE_COMMIT"]:
              raise SystemExit(
                  "GitHub returned an unexpected ref or commit for the release tag"
              )
          PY
      - name: Create the draft GitHub release from the verified tag
        if: steps.release_tag_state.outputs.resume_existing_release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "v$RELEASE_VERSION" \
            --notes-file release_notes.md
      - name: Dispatch package publication from the verified release source
        env:
          CONTROL_PLANE_COMMIT: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          gh workflow run publish-pypi.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f release_tag="v$RELEASE_VERSION" \
            -f release_commit="$RELEASE_COMMIT" \
            -f control_plane_commit="$CONTROL_PLANE_COMMIT"
