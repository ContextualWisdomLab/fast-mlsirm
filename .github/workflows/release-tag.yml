name: Release Tag

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to publish (e.g. 0.2.0); must match pyproject.toml"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify the requested version is the released source version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          project_version="$(python3 -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          if [ "$project_version" != "$RELEASE_VERSION" ]; then
            echo "pyproject.toml version $project_version does not match requested $RELEASE_VERSION" >&2
            exit 1
          fi
          grep -Fq "## [$RELEASE_VERSION] - " CHANGELOG.md
      - name: Extract the release notes from the CHANGELOG section
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          awk -v header="## [$RELEASE_VERSION] - " '
            index($0, header) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release_notes.md
          if ! [ -s release_notes.md ]; then
            echo "CHANGELOG section for $RELEASE_VERSION is empty" >&2
            exit 1
          fi
      - name: Publish the tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release v$RELEASE_VERSION already exists; refusing to overwrite" >&2
            exit 1
          fi
          gh release create "v$RELEASE_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$RELEASE_VERSION" \
            --notes-file release_notes.md
