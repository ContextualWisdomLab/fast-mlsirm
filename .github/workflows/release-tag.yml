name: Release Tag
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to publish (e.g. 0.2.0); must match pyproject.toml"
        required: true
        type: string
      release_commit:
        description: "Release source commit reviewed for this version (full lowercase SHA-1)"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  central:
    uses: ContextualWisdomLab/.github/.github/workflows/fast-mlsirm-release-tag.yml@635c0f3bac4e2b3eff93206f4eab82bfadcdc349
    with:
      release_version: ${{ inputs.release_version }}
      release_commit: ${{ inputs.release_commit }}
    secrets: inherit
