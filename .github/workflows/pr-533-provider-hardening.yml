name: PR 533 provider hardening

on:
  push:
    branches:
      - feat/enterprise-explicit-value-parser

permissions:
  contents: read

jobs:
  harden:
    if: github.repository == 'ContextualWisdomLab/fast-mlsirm'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enterprise-explicit-value-parser
          fetch-depth: 0

      - name: Apply provider-boundary, metadata, and test hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          implementation = Path("python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py")
          text = implementation.read_text(encoding="utf-8")
          import_before = "    ASSESSMENT_SCHEMA_VERSION,\n    CanonicalContract,"
          import_after = "    ASSESSMENT_SCHEMA_VERSION,\n    AssessmentSpecError,\n    CanonicalContract,"
          if import_before not in text:
              raise SystemExit("validation import insertion point not found")
          text = text.replace(import_before, import_after, 1)

          metadata_before = '        object.__setattr__(self, "metadata", freeze_metadata(self.metadata))'
          metadata_after = textwrap.dedent('''
                  metadata = freeze_metadata(self.metadata)
                  unexpected_metadata = set(metadata) - {"offset_unit"}
                  if unexpected_metadata:
                      raise assessment_error(
                          "unexpected_explicit_value_metadata",
                          "$.metadata",
                          "explicit value metadata may contain only offset_unit",
                      )
                  if (
                      "offset_unit" in metadata
                      and metadata["offset_unit"] != "python_unicode_code_point"
                  ):
                      raise assessment_error(
                          "invalid_offset_unit",
                          "$.metadata.offset_unit",
                          "offset_unit must be python_unicode_code_point",
                      )
                  object.__setattr__(self, "metadata", metadata)
          ''').strip("\n")
          if metadata_before not in text:
              raise SystemExit("metadata validation insertion point not found")
          text = text.replace(metadata_before, metadata_after, 1)

          marker = "\ndef _validated_parser_output("
          prefix, separator, _ = text.partition(marker)
          if not separator:
              raise SystemExit("provider boundary marker not found")
          tail = textwrap.dedent('''
              def _validated_parser_output(
                  source_record: EnterpriseSourceRecord,
                  source_text: str,
                  values: Any,
              ) -> tuple[ExplicitValueRecord, ...]:
                  """Return exact canonical records from one provider callback."""
                  if type(values) is not tuple:
                      raise assessment_error(
                          "invalid_explicit_value_parser_output",
                          "$.parser_output",
                          "parser output must be a tuple of ExplicitValueRecord values",
                      )
                  if len(values) > MAX_EXPLICIT_VALUE_RECORDS:
                      raise assessment_error(
                          "explicit_value_record_limit",
                          "$.parser_output",
                          "parser output exceeds the bounded explicit-value record limit",
                      )
                  records: list[ExplicitValueRecord] = []
                  for index, item in enumerate(values):
                      path = f"$.parser_output[{index}]"
                      if not isinstance(item, ExplicitValueRecord):
                          raise assessment_error(
                              "invalid_explicit_value_parser_output",
                              path,
                              "parser output must contain only ExplicitValueRecord values",
                          )
                      if item.source_id != source_record.source_id:
                          raise assessment_error(
                              "parser_output_source_mismatch",
                              path,
                              "parser output source_id does not match source_record",
                          )
                      if (
                          item.source_record_fingerprint
                          != source_record.source_record_fingerprint
                      ):
                          raise assessment_error(
                              "parser_output_source_mismatch",
                              path,
                              "parser output source fingerprint does not match source_record",
                          )
                      if item.end_offset > len(source_text):
                          raise assessment_error(
                              "parser_output_span_out_of_bounds",
                              path,
                              "parser output span exceeds verified source text",
                          )
                      expected_span = hashlib.sha256(
                          source_text[item.start_offset : item.end_offset].encode("utf-8")
                      ).hexdigest()
                      if item.span_content_fingerprint != expected_span:
                          raise assessment_error(
                              "parser_output_span_mismatch",
                              path,
                              "parser output span fingerprint does not match verified source text",
                          )
                      records.append(item)
                  ordered = tuple(
                      sorted(
                          records,
                          key=lambda item: (
                              item.start_offset,
                              item.end_offset,
                              item.value_kind.value,
                              item.explicit_value_fingerprint,
                          ),
                      )
                  )
                  record_fingerprints = tuple(
                      item.explicit_value_fingerprint for item in ordered
                  )
                  if len(set(record_fingerprints)) != len(record_fingerprints):
                      raise assessment_error(
                          "duplicate_explicit_value_record",
                          "$.parser_output",
                          "parser output records must be unique",
                      )
                  for previous, current in zip(ordered, ordered[1:]):
                      if current.start_offset < previous.end_offset:
                          raise assessment_error(
                              "overlapping_explicit_values",
                              "$.parser_output",
                              "parser output records must not overlap",
                          )
                  return ordered


              def parse_enterprise_explicit_values(
                  source_record: EnterpriseSourceRecord,
                  source_text: str,
                  *,
                  parser: EnterpriseExplicitValueParser | None = None,
              ) -> tuple[ExplicitValueRecord, ...]:
                  """Parse verified text and revalidate provider output before return."""
                  resolved = DeterministicExplicitValueParser() if parser is None else parser
                  if not isinstance(resolved, EnterpriseExplicitValueParser):
                      raise assessment_error(
                          "invalid_explicit_value_parser",
                          "$.parser",
                          "parser must implement EnterpriseExplicitValueParser",
                      )
                  DeterministicExplicitValueParser._validate_source(
                      source_record,
                      source_text,
                  )
                  try:
                      values = resolved.parse(source_record, source_text)
                  except AssessmentSpecError:
                      raise
                  except Exception:
                      raise assessment_error(
                          "explicit_value_parser_failure",
                          "$.parser",
                          "parser failed before returning validated explicit values",
                      ) from None
                  return _validated_parser_output(source_record, source_text, values)
          ''').strip("\n")
          implementation.write_text(prefix + "\n\n" + tail + "\n", encoding="utf-8")

          tests = Path("tests/test_scoring_enterprise_explicit_values.py")
          test_text = tests.read_text(encoding="utf-8")
          test_marker = "\ndef test_provider_output_is_revalidated_against_verified_source()"
          test_prefix, test_separator, _ = test_text.partition(test_marker)
          if not test_separator:
              raise SystemExit("provider output test marker not found")
          test_tail = textwrap.dedent('''
              def test_provider_output_is_revalidated_against_verified_source() -> None:
                  """Custom providers are canonicalized and rebound to verified source text."""
                  text = "event 2026-09-30 then 2026-10-01"
                  source = _source(text)
                  records = DeterministicExplicitValueParser().parse(source, text)

                  class StaticParser:
                      """Return one configured object through the provider protocol."""

                      def __init__(self, output: Any) -> None:
                          """Store output for one deterministic boundary invocation."""
                          self.output = output

                      def parse(
                          self,
                          source_record: EnterpriseSourceRecord,
                          source_text: str,
                      ) -> Any:
                          """Return configured output after observing exact inputs."""
                          assert source_record is source
                          assert source_text == text
                          return self.output

                  assert parse_enterprise_explicit_values(
                      source,
                      text,
                      parser=StaticParser(tuple(reversed(records))),
                  ) == records

                  invalid_outputs = (
                      (list(records), "invalid_explicit_value_parser_output"),
                      ((object(),), "invalid_explicit_value_parser_output"),
                      (
                          (replace(records[0], source_id="other_source"),),
                          "parser_output_source_mismatch",
                      ),
                      (
                          (replace(records[0], source_record_fingerprint=FP_A),),
                          "parser_output_source_mismatch",
                      ),
                      (
                          (
                              replace(
                                  records[0],
                                  end_offset=len(text) + 1,
                                  span_content_fingerprint=FP_B,
                              ),
                          ),
                          "parser_output_span_out_of_bounds",
                      ),
                      (
                          (replace(records[0], span_content_fingerprint=FP_B),),
                          "parser_output_span_mismatch",
                      ),
                      ((records[0], records[0]), "duplicate_explicit_value_record"),
                  )
                  for output, error in invalid_outputs:
                      with pytest.raises(AssessmentSpecError, match=error):
                          parse_enterprise_explicit_values(
                              source,
                              text,
                              parser=StaticParser(output),
                          )

                  overlap_start = records[0].start_offset + 1
                  overlap_end = records[0].end_offset
                  overlap = replace(
                      records[1],
                      start_offset=overlap_start,
                      end_offset=overlap_end,
                      span_content_fingerprint=hashlib.sha256(
                          text[overlap_start:overlap_end].encode("utf-8")
                      ).hexdigest(),
                  )
                  with pytest.raises(
                      AssessmentSpecError,
                      match="overlapping_explicit_values",
                  ):
                      parse_enterprise_explicit_values(
                          source,
                          text,
                          parser=StaticParser((records[0], overlap)),
                      )

                  with pytest.raises(
                      AssessmentSpecError,
                      match="explicit_value_record_limit",
                  ):
                      parse_enterprise_explicit_values(
                          source,
                          text,
                          parser=StaticParser((records[0],) * 129),
                      )


              def test_custom_provider_cannot_bypass_source_replay_validation() -> None:
                  """The stable boundary validates source replay before provider execution."""
                  text = "event 2026-09-30"
                  source = _source(text, fingerprint_text="different")

                  class NeverParser:
                      """Protocol parser that must not observe an invalid source replay."""

                      def parse(
                          self,
                          source_record: EnterpriseSourceRecord,
                          source_text: str,
                      ) -> tuple[ExplicitValueRecord, ...]:
                          """Fail if source validation does not precede provider execution."""
                          raise AssertionError("provider must not run")

                  with pytest.raises(
                      AssessmentSpecError,
                      match="source_content_fingerprint_mismatch",
                  ):
                      parse_enterprise_explicit_values(
                          source,
                          text,
                          parser=NeverParser(),
                      )


              def test_custom_parser_callback_failures_are_redacted() -> None:
                  """Arbitrary provider exceptions do not cross the public boundary."""
                  text = "No explicit values."
                  source = _source(text)

                  class FailingParser:
                      """Raise a non-domain exception from the provider callback."""

                      def parse(
                          self,
                          source_record: EnterpriseSourceRecord,
                          source_text: str,
                      ) -> tuple[ExplicitValueRecord, ...]:
                          """Raise one private provider failure."""
                          raise RuntimeError("private provider detail")

                  with pytest.raises(
                      AssessmentSpecError,
                      match="explicit_value_parser_failure",
                  ) as captured:
                      parse_enterprise_explicit_values(
                          source,
                          text,
                          parser=FailingParser(),
                      )
                  assert "private provider detail" not in str(captured.value)


              @pytest.mark.parametrize(
                  ("metadata", "error"),
                  (
                      ({"source_channel": "portal"}, "unexpected_explicit_value_metadata"),
                      ({"offset_unit": "utf8_byte"}, "invalid_offset_unit"),
                  ),
              )
              def test_explicit_value_metadata_is_strictly_allowlisted(
                  metadata: dict[str, Any],
                  error: str,
              ) -> None:
                  """Metadata cannot carry arbitrary values or change offset semantics."""
                  with pytest.raises(AssessmentSpecError, match=error):
                      _record(metadata=metadata)
          ''').strip("\n")
          tests.write_text(test_prefix + "\n\n" + test_tail + "\n", encoding="utf-8")

          docs = Path("docs/enterprise_issue_evidence_contracts.md")
          doc_text = docs.read_text(encoding="utf-8")
          doc_before = "Semantic assertions remain behind a separate\nprovider-neutral, human-validated boundary."
          doc_after = "Semantic assertions remain behind a separate\nprovider-neutral, human-validated boundary. Custom parser output is bounded,\ncanonicalized, and rebound to the exact verified source revision and span bytes\nbefore it can cross the public API. Arbitrary provider exceptions are redacted.\nExplicit-value caller metadata is restricted to the declared offset unit."
          if doc_before not in doc_text:
              raise SystemExit("documentation insertion point not found")
          docs.write_text(doc_text.replace(doc_before, doc_after, 1), encoding="utf-8")

          fragment = Path("docs/changelog.d/enterprise-explicit-value-parser.md")
          fragment_text = fragment.read_text(encoding="utf-8")
          fragment_before = "  clear-text customer identifiers.\n"
          fragment_after = "  clear-text customer identifiers.\n- Added fail-closed custom-parser output rebinding, callback redaction, exact span\n  verification, duplicate/overlap rejection, and strict explicit-value metadata.\n"
          if fragment_before not in fragment_text:
              raise SystemExit("changelog insertion point not found")
          fragment.write_text(
              fragment_text.replace(fragment_before, fragment_after, 1),
              encoding="utf-8",
          )
          PY
          python scripts/render_changelog_fragments.py --update CHANGELOG.md

      - name: Commit hardening and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr-533-provider-hardening.yml
          git add CHANGELOG.md docs/changelog.d/enterprise-explicit-value-parser.md docs/enterprise_issue_evidence_contracts.md python/fast_mlsirm/scoring/enterprise_issue/explicit_values.py tests/test_scoring_enterprise_explicit_values.py
          git diff --cached --check
          git commit -m "fix(enterprise): validate provider parser output"
          git push origin HEAD:feat/enterprise-explicit-value-parser
