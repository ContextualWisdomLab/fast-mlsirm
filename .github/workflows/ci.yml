name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read

concurrency:
  # Keep one active CI run per PR while preserving independent push runs. A
  # synchronized head cancels its queued/running predecessor instead of
  # multiplying the hosted-runner backlog with stale evidence.
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Matrix legs report as "python (3.12)" / "python (3.14)". Branch protection
  # still requires the exact check context name `python`, so a thin aggregate
  # job below re-exports matrix success under that name.
  python-matrix:
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'closed') }}
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      # Rust toolchain is required so the maturin build compiles the primary
      # numeric core (fast_mlsirm._core) during the editable install; the
      # Rust<->NumPy parity gate then exercises the Rust path.
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
      - run: python -m pip install --require-hashes -r requirements/ci.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Verify Rust core is the resolved default backend
        run: python -c "import fast_mlsirm._core as c; from fast_mlsirm.backend import resolve_backend; from fast_mlsirm import FitConfig; assert hasattr(c, 'neg_loglik_and_grad'); assert resolve_backend(FitConfig().backend) == 'rust'; print('rust primary OK')"
      - run: pytest

  python:
    name: python
    needs: [python-matrix, focal-gpu-native]
    if: ${{ always() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'closed')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every CPython matrix leg and actual GPU evidence
        env:
          # focal-gpu-native never runs fork code on the self-hosted runner, so
          # only fork PRs may pass with it skipped; the post-merge push run
          # still requires hardware success.
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          GPU_RESULT: ${{ needs.focal-gpu-native.result }}
        run: |
          echo "python-matrix result=${{ needs.python-matrix.result }} focal-gpu-native result=$GPU_RESULT fork_pr=$FORK_PR"
          test "${{ needs.python-matrix.result }}" = "success"
          if [ "$FORK_PR" = "true" ] && [ "$GPU_RESULT" = "skipped" ]; then
            echo "::notice::Fork PR: hardware GPU evidence is deferred to the post-merge push run."
          else
            test "$GPU_RESULT" = "success"
          fi


  focal-gpu-native:
    # Hardware runner must be isolated from research data and credentials.
    # GitHub Docs, "Adding self-hosted runners", security warning:
    # https://docs.github.com/en/actions/how-tos/manage-runners/self-hosted-runners/add-runners
    # The required python aggregate rejects skipped/failed hardware evidence.
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, linux, x64, focal-gpu-isolated]
    timeout-minutes: 240
    env:
      FOCAL_GPU_NATIVE: "1"
      FOCAL_GPU_RECOVERY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
      - name: Build isolated Python environment and native core
        run: |
          python -m venv .venv-focal-gpu
          # Python 3.12 venv manual: activation prepends the environment bin to PATH.
          # https://docs.python.org/3.12/library/venv.html#how-venvs-work
          export PATH="$PWD/.venv-focal-gpu/bin:$PATH"
          .venv-focal-gpu/bin/python -m pip install --require-hashes -r requirements/ci.txt
          .venv-focal-gpu/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Execute all six actual hardware contracts
        run: |
          .venv-focal-gpu/bin/python -m pytest -q -s --junitxml=focal-gpu-junit.xml \
            tests/test_two_tier_focal_gpu_native.py::test_actual_gpu_six_latent_score_and_focal_update \
            tests/test_two_tier_focal_gpu_native.py::test_actual_gpu_six_latent_continuous_population_recovery \
            tests/test_two_tier_focal_gpu_native.py::test_actual_gpu_reference_focal_expected_score_pipeline \
            tests/test_two_tier_group_pipeline_native.py::test_group_pipeline_preserves_slots_priors_and_nonconvergence \
            tests/test_two_tier_focal_gpu_native.py::test_actual_gpu_primary_only_matches_unidimensional_and_focal_prior \
            tests/test_two_tier_focal_gpu_native.py::test_actual_gpu_primary_only_group_pipeline
      - name: Reject missing or nonexecuted hardware contracts
        run: |
          .venv-focal-gpu/bin/python - <<'PY'
          from xml.etree import ElementTree

          cases = ElementTree.parse("focal-gpu-junit.xml").getroot().findall(".//testcase")
          expected = {
              "test_actual_gpu_six_latent_score_and_focal_update",
              "test_actual_gpu_six_latent_continuous_population_recovery",
              "test_actual_gpu_reference_focal_expected_score_pipeline",
              "test_group_pipeline_preserves_slots_priors_and_nonconvergence",
              "test_actual_gpu_primary_only_matches_unidimensional_and_focal_prior",
              "test_actual_gpu_primary_only_group_pipeline",
          }
          assert len(cases) == 6 and {case.get("name") for case in cases} == expected, "All six hardware contracts must execute"
          for case in cases:
              assert not any(case.find(tag) is not None for tag in ("skipped", "failure", "error")), "Hardware contracts must pass without skips"
          PY
      - name: Check no-prior bifactor fits against s1-pinned main bits
        run: |
          # The pinned bits came from this runner; hosted glibc differs.
          cargo test -p mlsirm-core --test bifactor_no_prior_main_reference -- --ignored --exact none_path_matches_main_bits_single_and_multigroup | tee no-prior-bits.log
          grep -q "test result: ok. 1 passed" no-prior-bits.log
      - name: Execute bifactor GPU parity on hardware
        env:
          STAGE5_HIGH_Q: "1"
          STAGE5_HIGH_Q_BOOTSTRAP_REPS: "2"
          STAGE5_BOOTSTRAP_REPS: "2"
        run: |
          .venv-focal-gpu/bin/python -m pytest -q -s --junitxml=bifactor-gpu-parity-junit.xml \
            tests/test_bifactor_gpu.py::test_bifactor_gpu_equivalence_single_group \
            tests/test_bifactor_gpu.py::test_bifactor_gpu_equivalence_multigroup \
            tests/test_bifactor_gpu.py::test_explicit_bifactor_gpu_rejects_software_adapter \
            tests/test_bifactor_bootstrap_stopping.py::test_cpu_gpu_bootstrap_replicate_parity \
            tests/test_bifactor_bootstrap_benchmark.py::test_joint_bootstrap_cpu_vs_gpu_wall_time_and_parity \
            tests/test_bifactor_gpu_high_q.py::test_bifactor_gpu_parity_q121 \
            tests/test_bifactor_gpu_high_q.py::test_bifactor_gpu_parity_q241 \
            tests/test_bifactor_gpu_high_q.py::test_bifactor_gpu_parity_q481 \
            tests/test_bifactor_gpu_high_q.py::test_bifactor_gpu_parity_q241_wide_items_metal_workgroups \
            tests/test_bifactor_gpu_high_q.py::test_bifactor_cpu_q121_vs_q241_agree \
            tests/test_bifactor_bootstrap_benchmark.py::test_joint_bootstrap_cpu_vs_gpu_wall_time_q121
      - name: Reject skipped bifactor GPU parity
        run: |
          .venv-focal-gpu/bin/python - <<'PY'
          from xml.etree import ElementTree

          cases = ElementTree.parse("bifactor-gpu-parity-junit.xml").getroot().findall(".//testcase")
          expected = {
              "test_bifactor_gpu_equivalence_single_group",
              "test_bifactor_gpu_equivalence_multigroup",
              "test_explicit_bifactor_gpu_rejects_software_adapter",
              "test_cpu_gpu_bootstrap_replicate_parity",
              "test_joint_bootstrap_cpu_vs_gpu_wall_time_and_parity",
              "test_bifactor_gpu_parity_q121",
              "test_bifactor_gpu_parity_q241",
              "test_bifactor_gpu_parity_q481",
              "test_bifactor_gpu_parity_q241_wide_items_metal_workgroups",
              "test_bifactor_cpu_q121_vs_q241_agree",
              "test_joint_bootstrap_cpu_vs_gpu_wall_time_q121",
          }
          assert len(cases) == len(expected) and {case.get("name") for case in cases} == expected, "Bifactor GPU parity must execute"
          for case in cases:
              assert not any(case.find(tag) is not None for tag in ("skipped", "failure", "error")), "Bifactor GPU parity must pass without skips"
          PY

  rust:
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'closed') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
      # Ordinary Rust tests include the deterministic equation and bounded
      # recovery-contract sentinels. Exhaustive ignored studies run in the
      # scheduled Statistical Studies workflow rather than on every PR.
      - run: cargo test --workspace
      - run: cargo test --manifest-path crates/fast-mlsirm-py/Cargo.toml

  gpu-smoke:
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'closed') }}
    # Lavapipe proves the MLSIRM marginal kernel and proves that an explicit
    # bifactor GPU fit rejects a software adapter. Bifactor numerical parity
    # runs on focal-gpu-native. The CPU 121-vs-241 node check stays here.
    # The full paper-design recovery study remains in the scheduled workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      WGPU_BACKEND: vulkan
      XDG_RUNTIME_DIR: /tmp/fast-mlsirm-xdg-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
      - name: Install software Vulkan adapter
        run: |
          # The hosted runner's mirror+file registry can keep selecting a
          # black-holed Azure mirror even after apt falls back for InRelease.
          # Use a job-local source file pinned to canonical Ubuntu archives so
          # package payloads do not re-enter that broken mirror selection path.
          . /etc/os-release
          test -n "${VERSION_CODENAME:-}"
          cat > /tmp/fast-mlsirm-ubuntu.sources <<EOF
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: ${VERSION_CODENAME} ${VERSION_CODENAME}-updates ${VERSION_CODENAME}-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: ${VERSION_CODENAME}-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          timeout 120s sudo apt-get \
            -o Dir::Etc::sourcelist=/tmp/fast-mlsirm-ubuntu.sources \
            -o Dir::Etc::sourceparts=- \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=10 \
            -o Acquire::https::Timeout=10 \
            -o DPkg::Lock::Timeout=30 \
            update
          timeout 180s sudo apt-get \
            -o Dir::Etc::sourcelist=/tmp/fast-mlsirm-ubuntu.sources \
            -o Dir::Etc::sourceparts=- \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=10 \
            -o Acquire::https::Timeout=10 \
            -o DPkg::Lock::Timeout=30 \
            install --yes mesa-vulkan-drivers vulkan-tools
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' -print -quit)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
      - name: Prove Vulkan compute adapter availability
        run: vulkaninfo --summary
      - run: python -m pip install --require-hashes -r requirements/ci.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Run lavapipe marginal parity and software-adapter rejection
        env:
          STAGE5_HIGH_Q: "1"
          EXPECT_SOFTWARE_GPU_REJECTION: "1"
        run: |
          pytest -q --junitxml=gpu-junit.xml \
            tests/test_marginal_parity.py::test_marginal_gpu_agrees_with_cpu_loosely \
            tests/test_bifactor_gpu.py::test_explicit_bifactor_gpu_rejects_software_adapter \
            tests/test_bifactor_gpu_high_q.py::test_bifactor_cpu_q121_vs_q241_agree
      - name: Reject skipped GPU evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          root = ElementTree.parse(Path("gpu-junit.xml")).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
          if tests < 1:
              raise SystemExit("GPU evidence did not execute a test")
          if skipped != 0:
              raise SystemExit(f"GPU evidence contained {skipped} skipped test(s)")
          PY

  fuzz:
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'closed') }}
    # Short, bounded coverage-guided fuzzing so PR cost stays low. The
    # property-based Hypothesis tests already run in the `python` job (via the
    # dev extra); this job adds the Atheris coverage-guided harnesses with a
    # ~60s-per-target budget. Longer campaigns can be run nightly if desired.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      # pip is version-pinned so the toolchain used to resolve the fuzz extras
      # is reproducible (OpenSSF Scorecard pinned-dependencies hardening).
      - run: python -m pip install --upgrade "pip==26.1.2"
      # The property checks below use pytest from the dev extra; fuzz alone
      # provides Atheris and Hypothesis, but not the pytest command.
      # Editable/local installs cannot use --require-hashes.
      - run: python -m pip install -e '.[dev,fuzz]'
      - name: Run Hypothesis input properties without a skip
        run: pytest tests/test_fuzz_properties.py -q --junitxml=fuzz-properties-junit.xml
      - name: Reject skipped Hypothesis evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          root = ElementTree.parse(Path("fuzz-properties-junit.xml")).getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          tests = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
          if tests < 1:
              raise SystemExit("Hypothesis evidence did not execute a test")
          if skipped != 0:
              raise SystemExit(
                  f"Hypothesis evidence contained {skipped} skipped test(s)"
              )
          PY
      - name: Fuzz load_factor_csv (CSV parser)
        run: |
          python fuzz/atheris/fuzz_load_factor_csv.py \
            -max_total_time=60 -timeout=25 fuzz/corpus/load_factor_csv
      - name: Fuzz render_diagnostics_report (JSON -> HTML)
        run: |
          python fuzz/atheris/fuzz_render_report.py \
            -max_total_time=60 -timeout=25 fuzz/corpus/render_report
      - name: Fuzz config validators
        run: |
          python fuzz/atheris/fuzz_config.py \
            -max_total_time=60 -timeout=25 fuzz/corpus/config

  package:
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'closed') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
      - run: python -m pip install --require-hashes -r requirements/package.txt
      - run: python -m build --no-isolation
      - run: python -m pip install --no-index --no-deps --force-reinstall dist/*.whl
      - run: python -c "import fast_mlsirm, fast_mlsirm._core as core; print(fast_mlsirm.__version__, hasattr(core, 'neg_loglik_and_grad'))"
      - name: Run release acceptance smoke
        run: |
          python scripts/release_acceptance.py --out release-acceptance --require-rust --persons 12 --dims 1 --items-per-dim 2 --latent-dim 1 --latent-dims 1,2 --folds 2 --max-iter 1 --n-restarts 1
          python - <<'PY'
          import json

          with open("release-acceptance/acceptance_summary.json", encoding="utf-8") as fh:
              summary = json.load(fh)
          assert summary["status"] == "ok"
          PY
      - name: Run enterprise sales readiness gate
        run: |
          python scripts/sales_readiness.py \
            --acceptance release-acceptance/acceptance_summary.json \
            --dist dist \
            --require-rust \
            --require-20b-product \
            --check-import \
            --out release-acceptance/sales_readiness_manifest.json
          python - <<'PY'
          import json

          with open("release-acceptance/sales_readiness_manifest.json", encoding="utf-8") as fh:
              manifest = json.load(fh)
          assert manifest["status"] == "ok"
          PY

  focal-gpu-joint-bootstrap:
    # The five-scale joint bootstrap ran past focal-gpu-native's 240-minute
    # limit on s1 (PR #2246, 2026-09-29), so it is post-merge evidence on
    # main/develop pushes rather than a PR gate. Same isolated runner rules.
    if: ${{ github.event_name == 'push' }}
    runs-on: [self-hosted, linux, x64, focal-gpu-isolated]
    timeout-minutes: 720
    env:
      FOCAL_GPU_NATIVE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
      - name: Build isolated Python environment and native core
        run: |
          python -m venv .venv-focal-gpu
          .venv-focal-gpu/bin/python -m pip install --require-hashes -r requirements/ci.txt
          .venv-focal-gpu/bin/python -m pip install --no-deps --no-build-isolation -e .
      - name: Execute the joint five-scale bootstrap on hardware
        run: |
          .venv-focal-gpu/bin/python -m pytest -q -s --junitxml=joint-bootstrap-junit.xml \
            tests/test_joint_two_tier_score_bootstrap.py::test_joint_five_scale_resample_uses_actual_gpu
      - name: Reject a skipped joint bootstrap
        run: |
          .venv-focal-gpu/bin/python - <<'PY'
          from xml.etree import ElementTree

          cases = ElementTree.parse("joint-bootstrap-junit.xml").getroot().findall(".//testcase")
          assert [case.get("name") for case in cases] == ["test_joint_five_scale_resample_uses_actual_gpu"], "Joint bootstrap must execute"
          assert not any(cases[0].find(tag) is not None for tag in ("skipped", "failure", "error")), "Joint bootstrap must pass without skips"
          PY
