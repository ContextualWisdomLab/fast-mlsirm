name: Retry PR 890 cumulative capture repair

on:
  push:
    branches: [fix/hourly-pr-query-bounds-889]
    paths:
      - .github/workflows/retry-890-capture-budget.yml

permissions:
  contents: write

concurrency:
  group: retry-pr-890-capture-budget
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/hourly-pr-query-bounds-889
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Recover and apply the already-reviewed patch payload
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          from pathlib import Path

          source = Path(".github/workflows/repair-890-capture-budget.yml")
          lines = source.read_text(encoding="utf-8").splitlines()
          start = next(
              index + 1
              for index, line in enumerate(lines)
              if "repair-890.py.b64" in line and "<<'B64'" in line
          )
          end = next(
              index for index in range(start, len(lines)) if lines[index].strip() == "B64"
          )
          encoded = "".join(line.strip() for line in lines[start:end])
          if not encoded:
              raise SystemExit("embedded repair payload is empty")
          patch_script = base64.b64decode(encoded, validate=True)
          destination = Path("/tmp/repair-890.py")
          destination.write_bytes(patch_script)
          PY
          python /tmp/repair-890.py
      - name: Install hash-locked validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci.txt
          cat > "$RUNNER_TEMP/coverage-requirements.txt" <<'EOF'
          coverage==7.15.4 \
              --hash=sha256:964730a1e9de9c0cf11be6a1a3c79ce419c34882842abd256086ba4698705e84
          EOF
          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            -r "$RUNNER_TEMP/coverage-requirements.txt"
      - name: Verify focused tests and exact coverage
        run: |
          set -euo pipefail
          python -m coverage erase
          python -m coverage run --branch -m pytest \
            tests/test_capture_pr_queue_snapshot.py \
            tests/test_hourly_snapshot_split_workflow.py \
            -q
          python -m coverage report \
            --include=scripts/capture_pr_queue_snapshot.py \
            --fail-under=100
          python -m compileall -q \
            scripts/capture_pr_queue_snapshot.py \
            tests/test_capture_pr_queue_snapshot.py \
            tests/test_hourly_snapshot_split_workflow.py
      - name: Commit validated repair and remove one-shot workflows
        run: |
          set -euo pipefail
          git config user.name "seonghobae"
          git config user.email "me@seonghobae.me"
          git rm \
            .github/workflows/repair-890-capture-budget.yml \
            .github/workflows/retry-890-capture-budget.yml
          git add \
            .github/workflows/hourly-pr-governance.yml \
            docs/changelog.d/889-hourly-pr-query-bounds.md \
            docs/doctoring/889-github-graphql-query-bounds.md \
            scripts/capture_pr_queue_snapshot.py \
            tests/test_capture_pr_queue_snapshot.py \
            tests/test_hourly_snapshot_split_workflow.py
          git diff --cached --check
          git commit -m "fix(ops): cap cumulative queue capture time"
          git push origin HEAD:fix/hourly-pr-query-bounds-889
