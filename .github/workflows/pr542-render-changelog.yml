name: PR 542 Render Changelog

on:
  push:
    branches:
      - feat/shared-facets-calibration-report

permissions:
  contents: write

concurrency:
  group: pr542-render-changelog
  cancel-in-progress: false

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/shared-facets-calibration-report
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Render authoritative changelog fragments
        run: python scripts/render_changelog_fragments.py --update CHANGELOG.md

      - name: Commit deterministic changelog update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): render shared facets report note"
          git push origin HEAD:feat/shared-facets-calibration-report
