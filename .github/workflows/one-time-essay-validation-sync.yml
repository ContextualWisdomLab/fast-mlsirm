# This workflow removes itself after synchronizing generated repository artifacts.
name: One-time essay validation contract synchronization

on:
  push:
    branches:
      - feat/essay-validation-evidence-report
    paths:
      - .github/workflows/one-time-essay-validation-sync.yml

permissions: {}

concurrency:
  group: one-time-essay-validation-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synchronize-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/essay-validation-evidence-report
          fetch-depth: 0
      - name: Synchronize public-surface expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_scoring_essay_contracts.py")
          content = path.read_text(encoding="utf-8")
          replacements = (
              (
                  '        "EssaySubmission",\n',
                  '        "EssaySubmission",\n'
                  '        "EssayValidationEvidenceReport",\n'
                  '        "EssayValidationMetric",\n',
              ),
              (
                  '        "MAX_ESSAY_REVIEW_FLAGS",\n',
                  '        "MAX_ESSAY_REVIEW_FLAGS",\n'
                  '        "MAX_ESSAY_VALIDATION_REVIEW_TRIGGERS",\n',
              ),
              (
                  '        "build_essay_submission",\n',
                  '        "build_essay_submission",\n'
                  '        "build_essay_validation_evidence_report",\n',
              ),
          )
          for old, new in replacements:
              if new in content:
                  continue
              if content.count(old) != 1:
                  raise RuntimeError(f"expected exactly one export anchor: {old!r}")
              content = content.replace(old, new)
          path.write_text(content, encoding="utf-8")
          PY
      - name: Render authoritative changelog
        run: |
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
      - name: Commit synchronization and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-essay-validation-sync.yml
          git add tests/test_scoring_essay_contracts.py CHANGELOG.md
          git commit -m "test(essay): synchronize validation report contracts"
          git push origin "HEAD:feat/essay-validation-evidence-report"
