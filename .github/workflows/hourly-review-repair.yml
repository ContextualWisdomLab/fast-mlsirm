name: fast-mlsirm Hourly Review Repair

on:
  schedule:
    # Avoid minute-zero shared-runner congestion while maintaining one-hour cadence.
    - cron: "37 * * * *"

concurrency:
  group: fast-mlsirm-hourly-review-repair
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dispatch-review-repair:
    permissions:
      contents: read
    uses: ContextualWisdomLab/.github/.github/workflows/pr-review-fix-scheduler.yml@2f16cca4aae2d11ccc928f8e03fdcbd97a96d5a2
    with:
      target_repository: ContextualWisdomLab/fast-mlsirm
      base_branch: main
      max_prs: "50"
      max_dispatches: "1"
      retry_hours: "1"
    secrets:
      PR_REVIEW_MERGE_TOKEN: ${{ secrets.PR_REVIEW_MERGE_TOKEN }}
      OPENCODE_APPROVE_TOKEN: ${{ secrets.OPENCODE_APPROVE_TOKEN }}
