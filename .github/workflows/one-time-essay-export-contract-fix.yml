name: One-time essay export contract fix

on:
  push:
    branches:
      - feat/essay-score-report-review-routing
    paths:
      - .github/workflows/one-time-essay-export-contract-fix.yml

permissions:
  contents: write

concurrency:
  group: one-time-essay-export-contract-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-export-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Synchronize the established public-surface contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_scoring_essay_contracts.py")
          content = path.read_text(encoding="utf-8")
          replacements = {
              '''        "EssaySubmission",
                  "MAX_ESSAY_EVIDENCE_REFERENCES",''': '''        "EssayScoreReport",
                  "EssaySubmission",
                  "MAX_ESSAY_EVIDENCE_REFERENCES",
                  "MAX_ESSAY_REPORT_REVIEW_TRIGGERS",''',
              '''        "build_essay_response_evidence",
                  "build_essay_scoring_request",''': '''        "build_essay_response_evidence",
                  "build_essay_score_report",
                  "build_essay_scoring_request",''',
          }
          for old, new in replacements.items():
              if content.count(old) != 1:
                  raise RuntimeError(f"expected exactly one public-surface block: {old!r}")
              content = content.replace(old, new)
          path.write_text(content, encoding="utf-8")
          PY
      - name: Commit the focused test synchronization and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-essay-export-contract-fix.yml
          git add tests/test_scoring_essay_contracts.py
          git commit -m "test(essay): synchronize public report exports"
          git push origin "HEAD:${GITHUB_REF_NAME}"
