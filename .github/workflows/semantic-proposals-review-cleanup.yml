name: Prepare semantic proposal review branch

on:
  push:
    branches:
      - feat/enterprise-semantic-issue-proposals-reviewed
    paths:
      - .github/workflows/semantic-proposals-review-cleanup.yml

permissions:
  contents: write

concurrency:
  group: semantic-proposals-review-cleanup
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact clean branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/enterprise-semantic-issue-proposals-reviewed
          fetch-depth: 0

      - name: Merge current main without discarding composed exports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ "${#conflicts[@]}" -ne 1 || "${conflicts[0]}" != "python/fast_mlsirm/scoring/enterprise_issue/__init__.py" ]]; then
              printf 'Unexpected merge conflicts:\n%s\n' "${conflicts[*]}" >&2
              exit 1
            fi
            git checkout --ours python/fast_mlsirm/scoring/enterprise_issue/__init__.py
            git add python/fast_mlsirm/scoring/enterprise_issue/__init__.py
            git commit --no-edit
          fi

      - name: Apply accepted focused corrections
        shell: bash
        run: |
          set -euo pipefail
          python scripts/pr537_semantic_fixes.py
          python - <<'PY'
          from pathlib import Path

          module = Path(
              "python/fast_mlsirm/scoring/enterprise_issue/semantic_proposals.py"
          )
          text = module.read_text(encoding="utf-8")
          import_anchor = "from .contracts import (\n"
          semantic_import = (
              "from .semantic import (\n"
              "    StaticEnterpriseIssueExtractor,\n"
              "    extract_enterprise_atomic_issues,\n"
              ")\n"
          )
          if semantic_import not in text:
              if import_anchor not in text:
                  raise SystemExit("semantic proposal import anchor is missing")
              text = text.replace(import_anchor, semantic_import + import_anchor, 1)

          old_return = (
              "    compiled.sort(key=lambda value: value.atomic_issue_fingerprint)\n"
              "    perspectives.sort(key=lambda value: value.perspective_fingerprint)\n"
              "    return tuple(compiled), tuple(perspectives)\n"
          )
          new_return = (
              "    validated_issues = extract_enterprise_atomic_issues(\n"
              "        tuple(record for record, _text in sources),\n"
              "        {record.source_id: text for record, text in sources},\n"
              "        extractor=StaticEnterpriseIssueExtractor(tuple(compiled)),\n"
              "    )\n"
              "    perspectives.sort(key=lambda value: value.perspective_fingerprint)\n"
              "    return validated_issues, tuple(perspectives)\n"
          )
          if new_return not in text:
              if text.count(old_return) != 1:
                  raise SystemExit("semantic proposal return anchor is missing")
              text = text.replace(old_return, new_return, 1)
          module.write_text(text, encoding="utf-8")

          guide = Path("docs/enterprise_issue_evidence_contracts.md")
          guide_text = guide.read_text(encoding="utf-8")
          marker = "## Evidence-grounded semantic issue proposals"
          if marker not in guide_text:
              section = '''

## Evidence-grounded semantic issue proposals

`EnterpriseSemanticIssueProvider` is the provider-neutral trust boundary for
semantic issue candidates over authorized enterprise text. Before any provider
callback, `extract_enterprise_semantic_issues()` replays every exact
`EnterpriseSourceRecord` by matching the Python Unicode-code-point character
count and SHA-256 over the transient source text's UTF-8 bytes. The source-text
mapping must contain exactly the declared source identifiers. A replay failure
rejects the complete batch before provider execution.

Providers return bounded primitive proposal and assertion mappings rather than
package-owned records. The package derives the issue-content fingerprint from a
transient issue statement, verifies every source ID and code-point span, hashes
the exact UTF-8 span bytes, and reconstructs only the existing
`EvidenceSpanRecord`, `CounterevidenceRecord`, `StakeholderPerspective`, and
`AtomicIssueRecord` contracts. The resulting issues pass through the central
`extract_enterprise_atomic_issues()` replay boundary before release. Provider
order, source order, assertion order, and mapping insertion order do not determine
public output order.

Epistemic roles remain separate. Direct facts, supported inferences, and
unresolved ambiguities become issue evidence spans. Counterevidence remains a
`CounterevidenceRecord`. Stakeholder value judgments become separate
`StakeholderPerspective` values and cannot create an atomic issue without
factual, inferential, ambiguity, or counterevidence support. Compilation proves
only source, span, schema, and provenance consistency; it does not establish
semantic truth, materiality, construct validity, fairness, causal effect,
expected utility, recommendation quality, or deployment readiness.

Raw source text and transient issue statements are never serialized. Semantic
metadata rejects source-text, prompt, authorization, credential, token,
password, API-key, and secret-like keys. Provider failures are redacted,
malformed or excessive collections fail closed, duplicate or unresolved
overlapping spans are rejected, and source content is always treated as data
rather than executable instructions. The core executes no model, tool, network,
shell, filesystem, ranking, scoring, calibration, or queue action.

`OfflineSemanticIssueFixtureProvider` supplies a deterministic disconnected
adapter for testing and standalone use. Live model adapters may wrap the runtime
protocol in a service layer; they must still pass both canonical validators and
must not alter the independent review-agent credential boundary.
'''
              anchor = "\n## Replay and provenance\n"
              if anchor not in guide_text:
                  raise SystemExit("enterprise evidence guide anchor is missing")
              guide.write_text(
                  guide_text.replace(anchor, section + anchor, 1),
                  encoding="utf-8",
              )

          fragment = Path(
              "docs/changelog.d/enterprise-semantic-issue-proposals.md"
          )
          fragment_text = fragment.read_text(encoding="utf-8")
          composition = (
              "- Composed compiled proposals through the central semantic issue replay\n"
              "  boundary before release so provider proposal validation and canonical\n"
              "  atomic-issue validation cannot diverge.\n"
          )
          if composition not in fragment_text:
              fragment.write_text(
                  fragment_text.rstrip() + "\n" + composition,
                  encoding="utf-8",
              )

          doctoring = Path(
              "docs/doctoring/enterprise-semantic-issue-proposals.md"
          )
          doctoring_text = doctoring.read_text(encoding="utf-8")
          old_next = (
              "The next issue #404 slice should compile accepted atomic issues into connected\n"
              "criterion-level judge observations using the existing shared scoring contracts.\n"
          )
          new_next = (
              "Compiled proposals pass through the central atomic-issue replay boundary and\n"
              "connect to the existing criterion-level request and observation adapters.\n"
              "The next issue #404 slice should add human-anchored multi-judge calibration,\n"
              "held-out validation, and buyer-visible review workflow evidence.\n"
          )
          if old_next in doctoring_text:
              doctoring.write_text(
                  doctoring_text.replace(old_next, new_next, 1),
                  encoding="utf-8",
              )
          PY
          python scripts/render_changelog_fragments.py --update CHANGELOG.md
          python scripts/render_changelog_fragments.py --check CHANGELOG.md

      - name: Build isolated focused validation environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install "ruff==0.16.1" "coverage==7.15.3"
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run focused validation
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          ruff check --fix \
            python/fast_mlsirm/scoring/enterprise_issue/__init__.py \
            python/fast_mlsirm/scoring/enterprise_issue/semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_provider_boundary.py
          ruff format \
            python/fast_mlsirm/scoring/enterprise_issue/__init__.py \
            python/fast_mlsirm/scoring/enterprise_issue/semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_provider_boundary.py
          ruff format --check \
            python/fast_mlsirm/scoring/enterprise_issue/__init__.py \
            python/fast_mlsirm/scoring/enterprise_issue/semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_provider_boundary.py
          ruff check \
            python/fast_mlsirm/scoring/enterprise_issue/__init__.py \
            python/fast_mlsirm/scoring/enterprise_issue/semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_provider_boundary.py
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q \
            tests/test_scoring_enterprise_issue_semantic.py \
            tests/test_scoring_enterprise_semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_provider_boundary.py
          python -m coverage erase
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m coverage run \
            --branch \
            --source=python/fast_mlsirm/scoring/enterprise_issue/semantic_proposals.py \
            -m pytest -q \
            tests/test_scoring_enterprise_semantic_proposals.py \
            tests/test_scoring_enterprise_semantic_provider_boundary.py
          python -m coverage report \
            --include='*/semantic_proposals.py' \
            --fail-under=100
          python scripts/check_docstring_coverage.py
          python scripts/render_changelog_fragments.py --check CHANGELOG.md
          git diff --check

      - name: Commit reviewed product changes and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/pr-537-focused-trigger.txt \
            .github/workflows/pr-537-focused-fixes.yml \
            .github/workflows/semantic-proposals-review-cleanup.yml \
            scripts/pr537_semantic_fixes.py
          git add -A
          git diff --cached --check
          git commit -m "feat(enterprise): compose semantic proposal validation"
          git push origin HEAD:feat/enterprise-semantic-issue-proposals-reviewed
