# This workflow removes itself after strengthening nested payload privacy checks.
name: One-time essay validation privacy assertion

on:
  push:
    branches:
      - feat/essay-validation-evidence-report
    paths:
      - .github/workflows/one-time-essay-validation-privacy-assertion.yml

permissions: {}

concurrency:
  group: one-time-essay-validation-privacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strengthen-privacy-assertion:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/essay-validation-evidence-report
          fetch-depth: 0
      - name: Strengthen nested payload privacy assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_scoring_essay_validation_reporting.py")
          content = path.read_text(encoding="utf-8")
          import_anchor = "from dataclasses import replace\n"
          if "import json\n" not in content:
              if content.count(import_anchor) != 1:
                  raise RuntimeError("expected exactly one import anchor")
              content = content.replace(import_anchor, import_anchor + "import json\n")

          old = "    assert _AUTOMATED.tolist() not in payload.values()\n"
          new = '''    serialized = json.dumps(payload, sort_keys=True)
              for label_vector in (
                  _AUTOMATED,
                  _REFERENCE,
                  _HUMAN_A,
                  _HUMAN_B,
                  _SUBGROUP,
              ):
                  assert json.dumps(label_vector.tolist()) not in serialized
          '''
          old_count = content.count(old)
          new_count = content.count(new)
          if old_count == 1 and new_count == 0:
              content = content.replace(old, new)
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise RuntimeError(
                  "expected one legacy or one strengthened privacy assertion"
              )
          path.write_text(content, encoding="utf-8")
          PY
      - name: Run focused validation
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
          pytest tests/test_scoring_essay_validation_reporting.py tests/test_scoring_essay_contracts.py
      - name: Commit fix and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-essay-validation-privacy-assertion.yml
          git add tests/test_scoring_essay_validation_reporting.py
          git commit -m "test(essay): inspect nested validation payload privacy"
          git push origin "HEAD:feat/essay-validation-evidence-report"
