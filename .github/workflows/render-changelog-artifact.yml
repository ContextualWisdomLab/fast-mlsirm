name: Render Changelog Artifact

on:
  pull_request:
    paths:
      - .github/workflows/render-changelog-artifact.yml
      - CHANGELOG.md
      - docs/changelog.d/**
      - scripts/render_changelog_fragments.py

permissions:
  contents: read

concurrency:
  group: render-changelog-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Render authoritative changelog fragments
        run: python scripts/render_changelog_fragments.py --update CHANGELOG.md
      - name: Publish rendered changelog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rendered-changelog-${{ github.event.pull_request.head.sha }}
          path: CHANGELOG.md
          if-no-files-found: error
          retention-days: 1
