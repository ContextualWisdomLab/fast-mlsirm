name: CodeQL

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-actions:
    # Branch protection requires this exact context on pull requests. Keep the
    # Actions-language advanced scan live while repository default setup owns
    # the ordinary Python CodeQL path.
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: actions
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3

  analyze-python:
    # Default setup already scans Python. Retain an explicit advanced Python
    # path for operator diagnostics without creating duplicate PR uploads.
    if: github.event_name == 'workflow_dispatch'
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: python
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
