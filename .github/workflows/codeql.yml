name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep one authoritative run per PR/ref so predecessor heads do not retain
  # scarce hosted-runner queue capacity after the reviewed source changes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-actions:
    # Branch protection requires a deterministic Actions-language CodeQL check
    # on active PRs. Lifecycle events also enter this workflow so Draft/closed
    # transitions cancel stale work and Ready can reacquire evidence without
    # source churn. Default setup remains the code-scanning upload owner.
    if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.action != 'closed') }}
    name: Analyze (actions)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: actions
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          upload: never

  analyze-python:
    # Default setup already owns ordinary Python code-scanning uploads.
    # Retain a no-upload advanced diagnostic only for explicit operator runs.
    if: github.event_name == 'workflow_dispatch'
    name: Analyze (python)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          languages: python
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          upload: never
