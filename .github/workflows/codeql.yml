name: CodeQL

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-actions:
    # Branch protection requires the advanced-workflow Actions context on PRs.
    # Python remains on CodeQL default setup during ordinary PR activity.
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: actions
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3

  analyze-python:
    # Avoid duplicate Python uploads because default setup already analyzes it.
    # Retain this advanced job only for explicit operator diagnostics.
    if: github.event_name == 'workflow_dispatch'
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: python
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
