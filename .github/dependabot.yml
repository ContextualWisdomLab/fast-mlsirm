version: 2
updates:
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/crates/fast-mlsirm-py"
      - "/fuzz"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      cargo-lock-roots:
        group-by: dependency-name
      cargo-security-lock-roots:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
